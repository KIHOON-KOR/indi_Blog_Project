services:
  # ---------------------------------------------------------------------------
  # 1. Django 백엔드 (개발용)
  # ---------------------------------------------------------------------------
  backend:
    build: .
    container_name: blog_backend      # [변경] 컨테이너 이름을 직관적으로 변경
    volumes:
      - ./:/app
      # - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # [중요] DB 접속 호스트는 아래 db 서비스의 'container_name'과 같아야 합니다.
      - POSTGRES_HOST=blog_db
    depends_on:
      - db
    networks:
      - app_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # ---------------------------------------------------------------------------
  # 2. PostgreSQL 데이터베이스
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15
    container_name: blog_db           # [변경] DB 컨테이너 이름 변경
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - app_network

  # ---------------------------------------------------------------------------
  # [주석 처리] 나중에 주석 풀 때도 이름이 맞도록 수정해 두었습니다.
