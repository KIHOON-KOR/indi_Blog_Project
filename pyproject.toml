[project]
name = "django-blog-project"
version = "0.1.0"
description = ""
authors = [
    {name = "kihoon",email = "nike6736@naver.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.0.1,<7.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "django-environ (>=0.12.0,<0.13.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "google-genai (>=1.59.0,<2.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "boto3 (>=1.42.63,<2.0.0)",
    "django-storages (>=1.14.6,<2.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "openai (>=2.26.0,<3.0.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "django-redis (>=6.0.0,<7.0.0)",
    "django-silk (>=5.5.0,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.12.0"
ruff = "^0.14.11"
mypy = "^1.19.1"
django-stubs = "^5.2.8"
coverage = "^7.13.1"
djangorestframework-stubs = "^3.16.6"
telnyx = "^4.10.0"

[tool.poetry]
package-mode = false

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main"
]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
telnyx = "^2.0"