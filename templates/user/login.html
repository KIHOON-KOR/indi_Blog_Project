{% extends 'base.html' %}

{% block title %}로그인 - My Blog{% endblock %}

{% block content %}
<div class="col-md-6 col-lg-4 col-xl-3" style="min-width: 380px; max-width: 480px;">

    <div class="text-center text-white mb-4">
        <h2 class="fw-bold">Welcome Back!</h2>
        <p class="opacity-75">나만의 공간으로 로그인하세요.</p>
    </div>

    <div class="card auth-card p-4 p-sm-5 bg-white" id="login-card-body">
        <div class="card-body p-0">

            <h4 class="fw-bold text-center mb-4" style="color: var(--brand-dark-green);">로그인</h4>

            <form id="loginForm">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email">이메일 주소</label>
                </div>

                <div class="form-group mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label mb-0">비밀번호</label>
                        <a href="{% url 'password_reset_page' %}" class="text-success text-decoration-none small">비밀번호를
                            잊으셨나요?</a>
                    </div>
                    <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호"
                           required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 fs-6 mb-3">
                    로그인 하기
                </button>
            </form>

            <div class="d-flex align-items-center my-4">
                <div class="flex-grow-1 bg-secondary" style="height: 1px; opacity: 0.2;"></div>
                <span class="px-3 text-muted small">또는</span>
                <div class="flex-grow-1 bg-secondary" style="height: 1px; opacity: 0.2;"></div>
            </div>

            <div class="d-grid gap-2">
                <button type="button" id="githubLoginBtn"
                        class="btn btn-dark py-2 fw-bold d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-github fs-5"></i> GitHub로 로그인
                </button>
            </div>
            <div class="d-grid gap-2 mt-2">
                <button type="button" id="discordLoginBtn"
                        class="btn py-2 fw-bold d-flex align-items-center justify-content-center gap-2"
                        style="background-color: #5865F2; color: white; border: none;">
                    <i class="bi bi-discord fs-5"></i> Discord로 로그인
                </button>
            </div>

            <div class="text-center text-muted mt-4">
                아직 계정이 없으신가요? <br>
                <a href="/api/v1/user/signup-page/" class="text-brand">3초 만에 회원가입 하기</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 1. 기존 일반 이메일 로그인 로직입니다. (기존 코드 유지)
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        // 폼이 제출될 때 브라우저가 새로고침되는 기본 동작을 막아줍니다.
        e.preventDefault();
        // 사용자가 입력한 이메일 값을 가져옵니다.
        const email = document.getElementById('email').value;
        // 사용자가 입력한 비밀번호 값을 가져옵니다.
        const password = document.getElementById('password').value;

        // 서버 통신 중 에러를 대비해 try-catch 블록으로 감싸줍니다.
        try {
            // 제출 버튼 요소를 찾아 변수에 저장합니다.
            const submitBtn = this.querySelector('button[type="submit"]');
            // 원래 버튼에 적혀있던 텍스트('로그인 하기')를 임시로 저장해둡니다.
            const originalBtnText = submitBtn.innerText;
            // 로딩 중임을 알리기 위해 버튼 텍스트를 변경합니다.
            submitBtn.innerText = '로그인 중...';
            // 중복 클릭을 방지하기 위해 버튼을 비활성화(클릭 불가) 처리합니다.
            submitBtn.disabled = true;

            // 백엔드의 일반 로그인 API로 POST 요청을 보냅니다.
            const response = await fetch('/api/v1/user/login/', {
                // HTTP 메소드를 POST로 설정합니다.
                method: 'POST',
                // 서버에게 우리가 보내는 데이터가 JSON 형식임을 알려줍니다.
                headers: {'Content-Type': 'application/json'},
                // 이메일과 비밀번호를 JSON 문자열로 변환하여 요청 본문(body)에 담습니다.
                body: JSON.stringify({email: email, password: password})
            });

            // [추가] 브루트포스 공격 방어에 걸렸을 경우(429 에러) 친절하게 안내합니다.
            if (response.status === 429) {
                alert("로그인 시도 횟수를 초과했습니다. 계정 보호를 위해 잠시 후 다시 시도해주세요.");
                submitBtn.innerText = originalBtnText; // 버튼 복구
                submitBtn.disabled = false;            // 버튼 활성화
                return;                                // 로직 즉시 종료
            }

            // 서버로부터 받은 응답 데이터를 JSON 객체로 변환합니다.
            const data = await response.json();

            // 응답 상태 코드가 200번대(성공)일 경우 실행됩니다.
            if (response.ok) {
                // 발급받은 Access Token을 브라우저 로컬 스토리지에 저장합니다.
                localStorage.setItem('access_token', data.token.access);
                // 발급받은 Refresh Token도 브라우저 로컬 스토리지에 저장합니다.
                localStorage.setItem('refresh_token', data.token.refresh);
                // 화면 우측 상단 등에 표시할 사용자 닉네임도 저장해둡니다.
                localStorage.setItem('nickname', data.user.nickname);
                // 로그인이 완료되었으므로 메인 페이지(홈)로 이동시킵니다.
                window.location.href = "/";
            } else {
                // 실패했을 경우 서버에서 보내준 에러 메시지를 알림창으로 띄웁니다.
                alert("로그인 실패: " + (data.message || "정보를 확인하세요."));
                // 실패했으므로 버튼 텍스트를 원래대로 복구합니다.
                submitBtn.innerText = originalBtnText;
                // 다시 시도할 수 있도록 버튼의 비활성화를 풀어줍니다.
                submitBtn.disabled = false;
            }
        } catch (error) {
            // 네트워크 오류 등 fetch 자체가 실패했을 때 콘솔에 에러를 기록합니다.
            console.error('Error:', error);
            // 사용자에게 통신 오류가 발생했음을 알림창으로 알려줍니다.
            alert("서버 통신 중 오류가 발생했습니다.");
            // 버튼 텍스트를 원래대로 복구합니다.
            submitBtn.innerText = originalBtnText;
            // 다시 클릭할 수 있게 비활성화를 풀어줍니다.
            submitBtn.disabled = false;
        }
    });

    // 2. 깃허브 로그인 버튼 클릭 이벤트입니다.
    document.getElementById('githubLoginBtn').addEventListener('click', function () {
        // 백엔드의 깃허브 로그인 인가(Authorize) URL로 브라우저를 이동시킵니다.
        window.location.href = "/api/v1/user/login/github/";
    });

    // 3. ✨ 디스코드 로그인 버튼 클릭 이벤트입니다.
    document.getElementById('discordLoginBtn').addEventListener('click', function () {
        // 백엔드의 디스코드 로그인 인가(Authorize) URL로 브라우저를 이동시킵니다.
        window.location.href = "/api/v1/user/login/discord/";
    });

    // 4. 페이지 로드 시 소셜 로그인 콜백(리다이렉트)인지 확인하는 로직입니다.
    document.addEventListener('DOMContentLoaded', async function () {
        // 현재 브라우저 주소창의 쿼리 파라미터(? 뒤의 값들)를 파싱하기 위한 객체를 생성합니다.
        const urlParams = new URLSearchParams(window.location.search);
        // 파라미터 중 'code'라는 이름의 값을 가져옵니다. (소셜 제공자가 넘겨준 인가 코드)
        const code = urlParams.get('code');
        // 파라미터 중 'provider'라는 값을 가져옵니다. 값이 없으면 기본값으로 'github'을 할당합니다.
        const provider = urlParams.get('provider') || 'github';

        // 만약 주소창에 'code' 값이 존재한다면, 소셜 로그인 연동 후 돌아온 상태임을 의미합니다.
        if (code) {
            // 로그인 카드 내부의 HTML 요소를 가져옵니다.
            const cardBody = document.querySelector('.card-body');
            // 폼 입력창들을 숨기고, 사용자에게 로그인 처리 중임을 보여주는 로딩 UI로 덮어씌웁니다.
            cardBody.innerHTML = `
                    <div class="text-center py-5">
                        <div class="spinner-border text-dark mb-3" style="width: 3rem; height: 3rem;"></div>
                        <h5 class="fw-bold text-dark">${provider.toUpperCase()} 로그인 처리 중...</h5>
                        <p class="text-muted small">잠시만 기다려주세요.</p>
                    </div>
                `;

            // 서버 통신 중 발생할 에러를 잡기 위해 try-catch 블록을 엽니다.
            try {
                // 공급자(provider)가 깃허브인지 디스코드인지에 따라 요청을 보낼 백엔드 API 주소를 다르게 설정합니다.
                const apiUrl = provider === 'discord'
                        ? '/api/v1/user/login/discord/callback/'
                        : '/api/v1/user/login/github/callback/';

                // 결정된 백엔드 API 주소로 인가 코드(code)를 담아 POST 요청을 보냅니다.
                // (※ 백엔드 디스코드 콜백 API도 POST 방식을 사용하도록 수정했다고 가정한 최선의 코드입니다.)
                const response = await fetch(apiUrl, {
                    // HTTP 통신 방식을 POST로 지정합니다.
                    method: 'POST',
                    // 우리가 보내는 데이터가 JSON 형식임을 헤더에 명시합니다.
                    headers: {'Content-Type': 'application/json'},
                    // 주소창에서 추출한 code 값을 JSON 문자열로 만들어 요청 본문에 담습니다.
                    body: JSON.stringify({code: code})
                });

                // 백엔드에서 처리 후 돌려준 응답을 JSON 객체로 파싱합니다.
                const data = await response.json();

                // 백엔드 처리가 성공적(200번대 응답)으로 끝났다면 실행됩니다.
                if (response.ok) {
                    // 백엔드가 발급해준 Access Token을 로컬 스토리지에 안전하게 저장합니다.
                    localStorage.setItem('access_token', data.token.access);
                    // 백엔드가 발급해준 Refresh Token을 로컬 스토리지에 저장합니다.
                    localStorage.setItem('refresh_token', data.token.refresh);
                    // 백엔드가 넘겨준 유저의 닉네임을 로컬 스토리지에 저장합니다.
                    localStorage.setItem('nickname', data.user.nickname);

                    // 모든 로그인 과정이 끝났으므로 쿼리 파라미터를 지우고 메인 홈페이지로 이동합니다.
                    window.location.href = "/";
                } else {
                    // 서버에서 에러 응답을 보냈다면 에러 메시지를 알림으로 띄웁니다.
                    alert("소셜 로그인 실패: " + (data.message || "알 수 없는 오류"));
                    // 다시 시도할 수 있도록 주소창의 찌꺼기(code)를 떼고 깨끗한 로그인 페이지로 돌려보냅니다.
                    window.location.href = "/api/v1/user/login-page/";
                }
            } catch (error) {
                // 인터넷 끊김 등 네트워크 자체 오류 시 에러 로그를 콘솔에 남깁니다.
                console.error('Error:', error);
                // 사용자에게 통신 오류 알림을 띄워줍니다.
                alert("서버 통신 중 오류가 발생했습니다.");
                // 깨끗한 로그인 페이지로 다시 돌려보냅니다.
                window.location.href = "/api/v1/user/login-page/";
            }
        }
    });
</script>
{% endblock %}
