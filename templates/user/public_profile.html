{% extends 'base.html' %} {% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body text-center" id="profile-container">
                    <p id="loading-message">프로필 정보를 불러오는 중입니다...</p>
                </div>
            </div>

            <div class="card shadow-sm mt-4">
                <div class="card-body" id="stats-container" style="display: none;">
                    <h5 class="card-title">활동 통계</h5>
                    <hr>
                    <div class="d-flex justify-content-around text-center mt-3">
                        <div>
                            <p class="text-muted mb-1">총 작성 글</p>
                            <h4 id="stat-post-count">0</h4>
                        </div>
                        <div>
                            <p class="text-muted mb-1">현재 등급</p>
                            <h4 id="stat-current-grade">-</h4>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-5" id="user-posts-container">
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Django 템플릿에서 전달받은 닉네임을 JS 변수에 저장합니다.
    const targetNickname = "{{ nickname }}";

    // 2. 페이지가 렌더링 완료되면 즉시 프로필 데이터를 가져오는 함수를 실행합니다.
    document.addEventListener("DOMContentLoaded", () => {
        fetchPublicProfile();
    });

    // 3. 백엔드 API를 호출하는 비동기 함수입니다.
    async function fetchPublicProfile() {
        try {
            // 우리가 만들어둔 닉네임 기반 프로필 조회 API로 GET 요청을 보냅니다.
            const response = await fetch(`/api/v1/user/profile/${targetNickname}/`);

            // 4. 요청이 실패했다면 (예: 없는 유저 404 에러)
            if (!response.ok) {
                throw new Error("존재하지 않거나 탈퇴한 유저입니다.");
            }

            // 5. 성공적으로 데이터를 받았다면 JSON으로 변환합니다.
            const data = await response.json();

            // 6. 화면에 데이터를 그리는 함수를 호출합니다.
            renderProfile(data);

        } catch (error) {
            // 에러 발생 시 사용자에게 에러 메시지를 띄웁니다.
            document.getElementById("profile-container").innerHTML = `
            <div class="alert alert-danger">${error.message}</div>
        `;
        }
    }

    // 7. 받아온 JSON 데이터를 HTML 요소에 끼워 넣는 함수입니다.
    function renderProfile(data) {
        const userInfo = data.user_info;
        const stats = data.stats;

        // 기본 프로필 이미지 주소 (프로필 이미지가 없을 때 사용)
        const defaultProfileImg = "https://via.placeholder.com/150";

        // HTML 구조를 조립하여 profile-container 안에 넣습니다.
        document.getElementById("profile-container").innerHTML = `
        <img src="${userInfo.profile_img || defaultProfileImg}" 
             alt="${userInfo.nickname}님의 프로필" 
             class="rounded-circle mb-3" 
             style="width: 150px; height: 150px; object-fit: cover;">
        <h3 class="font-weight-bold">${userInfo.nickname}</h3>
        <p class="text-muted mt-2">${userInfo.bio || "아직 자기소개가 없습니다."}</p>
    `;

        // 통계 컨테이너를 보이게 처리하고, 데이터를 채워 넣습니다.
        const statsContainer = document.getElementById("stats-container");
        statsContainer.style.display = "block";

        document.getElementById("stat-post-count").innerText = `${stats.total_post_count}개`;
        document.getElementById("stat-current-grade").innerText = stats.current_grade ? stats.current_grade.label : "일반";
    }
</script>
{% endblock %}
