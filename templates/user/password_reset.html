{% extends 'base.html' %} {% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4"><h3 class="text-center mb-4">비밀번호 찾기</h3>
                    <p class="text-muted text-center mb-4">가입하신 이메일을 입력하시면 인증번호를 보내드립니다.</p>

                    <div class="form-group mb-3">
                        <label for="email" class="form-label">이메일 주소</label>
                        <div class="input-group"><input type="email" id="email" class="form-control"
                                                        placeholder="example@gmail.com" required>
                            <button type="button" id="btn-send-code" class="btn btn-outline-success">인증번호 발송</button>
                        </div>
                    </div>

                    <div id="reset-group" style="display: none;">

                        <div class="form-group mb-3">
                            <label for="verification-code" class="form-label">인증번호 6자리</label>
                            <input type="text" id="verification-code" class="form-control"
                                   placeholder="메일로 받은 6자리 숫자 입력" maxlength="6">
                        </div>

                        <div class="form-group mb-4">
                            <label for="new-password" class="form-label">새로운 비밀번호</label>
                            <input type="password" id="new-password" class="form-control"
                                   placeholder="새롭게 사용할 비밀번호를 입력하세요">
                        </div>

                        <button type="button" id="btn-reset-password" class="btn btn-success w-100">비밀번호 변경하기</button>

                        <small id="reset-message" class="mt-2 d-block text-center fw-bold"></small>
                    </div>

                    <div class="text-center mt-3">
                        <a href="{% url 'login_page' %}" class="text-success text-decoration-none smal">로그인 페이지로 돌아가기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Django CSRF 토큰을 가져오는 함수 (보안 필수)
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    const csrftoken = getCookie('csrftoken'); // 토큰 값 저장

    // 2. [인증번호 발송] 버튼 클릭 이벤트
    document.getElementById('btn-send-code').addEventListener('click', async function () {
        const emailInput = document.getElementById('email'); // 이메일 입력칸 요소 가져오기
        const email = emailInput.value;                      // 실제 사용자가 친 이메일 텍스트

        if (!email) {                                        // 이메일을 안 쳤다면
            alert("이메일을 입력해주세요.");
            return;
        }

        this.innerText = "발송 중...";                       // 버튼 글자를 로딩중으로 변경
        this.disabled = true;                                // 중복 클릭 방지용 비활성화

        try {
            // 우리가 만든 [인증번호 발송 API] 호출! (기본 URL 앞에 /api/v1/ 붙인 것 유지)
            const response = await fetch('/api/v1/user/password/reset/request/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({email: email})       // 이메일 데이터를 담아서 보냄
            });

            const data = await response.json();              // 서버의 응답을 JSON으로 변환

            if (response.ok) {                               // 200 OK (발송 성공)라면
                alert("인증번호가 발송되었습니다. 5분 안에 확인해주세요.");
                document.getElementById('reset-group').style.display = 'block'; // 숨겨둔 '새 비밀번호' 영역 표시!
                emailInput.readOnly = true;                  // 중간에 이메일을 못 바꾸게 잠금
            } else {                                         // 에러가 났다면 (없는 이메일, 소셜 계정 등)
                // 에러 메시지 추출 로직 (배열 형태이거나 단순 텍스트일 때 모두 대응)
                let errorMsg = "메일 발송에 실패했습니다.";
                if (data.email && data.email.length > 0) errorMsg = data.email[0];
                else if (data.non_field_errors) errorMsg = data.non_field_errors[0];
                else if (data.message) errorMsg = data.message;
                else if (data.error_detail) errorMsg = data.error_detail;

                alert(errorMsg);                             // 에러 원인을 사용자에게 알려줌
            }
        } catch (error) {
            alert("서버 통신 오류가 발생했습니다.");
        } finally {
            this.innerText = "인증번호 재발송";              // 버튼 글자를 '재발송'으로 변경
            this.disabled = false;                           // 버튼 클릭 다시 활성화
        }
    });

    // 3. [비밀번호 변경하기] 버튼 클릭 이벤트
    document.getElementById('btn-reset-password').addEventListener('click', async function () {
        const email = document.getElementById('email').value;             // 이메일
        const code = document.getElementById('verification-code').value;  // 6자리 인증번호
        const newPassword = document.getElementById('new-password').value;// 새로 입력한 비밀번호
        const messageEl = document.getElementById('reset-message');       // 알림 텍스트 요소

        // 기초적인 방어 로직 (빈칸 및 길이 검사)
        if (code.length !== 6) {
            messageEl.className = "text-danger mt-2 d-block text-center";
            messageEl.innerText = "인증번호 6자리를 정확히 입력해주세요.";
            return;
        }
        if (newPassword.length < 4) { // (블로그 정책에 맞게 비밀번호 최소 길이 조절 가능)
            messageEl.className = "text-danger mt-2 d-block text-center";
            messageEl.innerText = "새 비밀번호를 확인해주세요.";
            return;
        }

        this.innerText = "변경 중...";                       // 버튼 텍스트 변경
        this.disabled = true;                                // 버튼 비활성화

        try {
            // 우리가 만든 [비밀번호 변경 API] 호출!
            const response = await fetch('/api/v1/user/password/reset/confirm/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                // 이메일, 인증코드, 새 비밀번호 3가지를 한 번에 서버로 전송
                body: JSON.stringify({
                    email: email,
                    code: code,
                    new_password: newPassword
                })
            });

            const data = await response.json();

            if (response.ok) {                               // 성공적으로 변경되었다면!
                messageEl.className = "text-success mt-2 d-block text-center";
                messageEl.innerText = "비밀번호가 성공적으로 변경되었습니다!";

                alert("비밀번호가 변경되었습니다. 새 비밀번호로 로그인해주세요."); // 팝업창 띄우기
                window.location.href = "{% url 'login_page' %}"; // 즉시 로그인 페이지로 강제 이동!
            } else {                                         // 코드가 틀렸거나 만료되었다면
                let errorMsg = "비밀번호 변경 실패";
                if (data.code && data.code.length > 0) errorMsg = data.code[0];
                else if (data.message) errorMsg = data.message;
                else if (data.error_detail) errorMsg = data.error_detail;

                messageEl.className = "text-danger mt-2 d-block text-center";
                messageEl.innerText = errorMsg;              // 실패 이유를 폼 아래에 빨간 글씨로 띄움

                this.innerText = "비밀번호 변경하기";          // 버튼 원상복구
                this.disabled = false;
            }
        } catch (error) {
            messageEl.className = "text-danger mt-2 d-block text-center";
            messageEl.innerText = "서버 오류가 발생했습니다.";
            this.innerText = "비밀번호 변경하기";
            this.disabled = false;
        }
    });
</script>
{% endblock %}
