{% extends 'base.html' %}

{% block title %}회원가입 - My Blog{% endblock %}

{% block content %}
<div class="col-md-8 col-lg-6 col-xl-5" style="min-width: 380px; max-width: 550px;">

    <div class="text-center text-white mb-4">
        <h2 class="fw-bold">Join Us</h2>
        <p class="opacity-75">새로운 블로그 여정을 시작해보세요.</p>
    </div>

    <div class="card auth-card p-4 p-sm-5 bg-white">
        <div class="card-body p-0">

            <h4 class="fw-bold text-center mb-4" style="color: var(--brand-dark-green);">계정 만들기</h4>

            <form id="signupForm">
                <div class="form-group mb-3">
                    <label for="email">이메일</label>
                    <div class="input-group">
                        <input type="email" id="email" name="email" class="form-control" placeholder="이메일을 입력하세요"
                               required>
                        <button type="button" id="btn-send-email" class="btn btn-outline-success">인증번호 발송</button>
                    </div>
                </div>

                <div class="form-group mb-3" id="verify-group" style="display: none;">
                    <label for="verification-code">인증번호</label>
                    <div class="input-group">
                        <input type="text" id="verification-code" class="form-control" placeholder="6자리 인증번호"
                               maxlength="6">
                        <button type="button" id="btn-verify-code" class="btn btn-primary">인증 확인</button>
                    </div>
                    <small id="verify-message" class="text-danger mt-1 d-block"></small>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="nickname" placeholder="Nickname" required>
                    <label for="nickname">닉네임</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" minlength="8" required>
                    <label for="password">비밀번호 (8자 이상)</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="passwordConfirm" placeholder="Password Confirm" required>
                    <label for="passwordConfirm">비밀번호 확인</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 fs-6 mb-3">
                    회원가입 완료
                </button>
            </form>

            <div class="text-center text-muted mt-4">
                이미 계정이 있으신가요? <br>
                <a href="/api/v1/user/login-page/" class="text-brand">로그인 하러가기</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 1. Django의 CSRF 토큰을 가져오는 함수입니다. (POST 요청 시 보안을 위해 필수)
    function getCookie(name) {                                    // 쿠키 이름을 받아 값을 찾아주는 함수입니다.
        let cookieValue = null;                                   // 초기값은 비워둡니다.
        if (document.cookie && document.cookie !== '') {          // 현재 브라우저에 저장된 쿠키가 존재한다면
            const cookies = document.cookie.split(';');           // 쿠키들을 세미콜론(;) 기준으로 쪼개어 배열로 만듭니다.
            for (let i = 0; i < cookies.length; i++) {            // 쪼개진 쿠키들을 하나씩 검사합니다.
                const cookie = cookies[i].trim();                 // 쿠키 앞뒤의 공백을 제거합니다.
                if (cookie.substring(0, name.length + 1) === (name + '=')) { // 찾고 있는 이름(csrftoken=)과 일치한다면
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1)); // 값을 추출하여 저장합니다.
                    break;                                        // 찾았으므로 반복문을 종료합니다.
                }
            }
        }
        return cookieValue;                                       // 찾은 토큰 값을 반환합니다.
    }

    const csrftoken = getCookie('csrftoken');                     // 위 함수를 사용해 CSRF 토큰을 가져와 변수에 저장합니다.

    // 2. 이메일 인증 상태를 관리하는 전역 변수입니다. (이게 True여야만 가입을 시켜줍니다)
    let isEmailVerified = false;

    // 3. [인증번호 발송] 버튼 클릭 이벤트
    document.getElementById('btn-send-email').addEventListener('click', async function () { // 발송 버튼을 눌렀을 때 실행되는 함수입니다.
        const emailInput = document.getElementById('email');      // 이메일 입력칸 HTML 요소를 가져옵니다.
        const email = emailInput.value;                           // 사용자가 입력한 실제 이메일 텍스트를 가져옵니다.

        if (!email) {                                             // 이메일 칸이 비어있다면
            alert("이메일을 먼저 입력해주세요.");                     // 경고창을 띄우고
            return;                                               // 함수를 종료합니다 (API 호출 안 함).
        }

        // 로딩 중임을 알리기 위해 버튼 텍스트를 잠시 바꿉니다.
        this.innerText = "발송 중...";                            // this는 클릭된 버튼 자신입니다.
        this.disabled = true;                                     // 중복 클릭을 막기 위해 버튼을 비활성화합니다.

        try {                                                     // 통신 중 에러가 날 것을 대비해 try-catch 문을 씁니다.
            const response = await fetch('/api/v1/user/email/send/', {   // 우리가 만든 [이메일 발송 API] 주소로 요청을 보냅니다.
                method: 'POST',                                   // POST 방식으로 보냅니다.
                headers: {                                        // 데이터의 형식과 보안 토큰을 헤더에 담습니다.
                    'Content-Type': 'application/json',           // JSON 형태로 데이터를 보낸다고 서버에 알려줍니다.
                    'X-CSRFToken': csrftoken                      // Django 보안을 통과하기 위해 CSRF 토큰을 넣습니다.
                },
                body: JSON.stringify({email: email})            // 사용자 이메일을 JSON 문자열로 변환하여 본문에 담아 보냅니다.
            });

            const data = await response.json();                   // 서버에서 돌아온 응답(성공/실패 메시지)을 JSON으로 해석합니다.

            if (response.ok) {                                    // 서버 응답이 200번대(성공)라면
                alert("인증번호가 발송되었습니다. 5분 안에 입력해주세요."); // 성공 알림창을 띄웁니다.
                document.getElementById('verify-group').style.display = 'block'; // 숨겨두었던 [인증번호 입력칸]을 화면에 보여줍니다.
                emailInput.readOnly = true;                       // 인증번호를 받는 도중에 이메일을 수정하지 못하도록 읽기 전용으로 바꿉니다.
            } else {
                // DRF가 보내는 에러 형식({"email": ["..."]})을 예쁘게 뽑아서 보여줍니다.
                let errorMsg = "이메일 발송에 실패했습니다.";
                if (data.email && data.email.length > 0) {
                    errorMsg = data.email[0]; // "이미 가입된 이메일입니다." 또는 "올바른 형식이 아닙니다."
                } else if (data.message) {
                    errorMsg = data.message;
                }
                alert(errorMsg);
            }
        } catch (error) {                                         // 네트워크 연결 끊김 등의 심각한 에러가 발생했다면
            alert("서버 통신 중 오류가 발생했습니다.");               // 통신 에러 알림을 띄웁니다.
        } finally {                                               // 통신이 성공하든 실패하든 마지막에 무조건 실행되는 구문입니다.
            this.innerText = "인증번호 재발송";                     // 버튼 텍스트를 원래대로(재발송) 돌려놓습니다.
            this.disabled = false;                                // 버튼을 다시 누를 수 있게 활성화합니다.
        }
    });

    // 4. [인증 확인] 버튼 클릭 이벤트
    document.getElementById('btn-verify-code').addEventListener('click', async function () { // 확인 버튼을 눌렀을 때 실행됩니다.
        const email = document.getElementById('email').value;     // 현재 입력된 이메일을 가져옵니다.
        const code = document.getElementById('verification-code').value; // 사용자가 방금 입력한 6자리 인증번호를 가져옵니다.
        const messageEl = document.getElementById('verify-message'); // 성공/에러 메시지를 띄워줄 작은 텍스트 영역을 가져옵니다.

        if (code.length !== 6) {                                  // 인증번호가 6자리가 아니라면
            messageEl.innerText = "인증번호 6자리를 정확히 입력해주세요."; // 빨간색 에러 메시지를 띄우고
            return;                                               // API 호출 없이 종료합니다.
        }

        try {                                                     // 서버와 통신을 시작합니다.
            const response = await fetch('/api/v1/user/email/verify/', { // 우리가 만든 [인증번호 확인 API]로 요청을 보냅니다.
                method: 'POST',                                   // POST 방식입니다.
                headers: {
                    'Content-Type': 'application/json',           // JSON 형식 선언
                    'X-CSRFToken': csrftoken                      // 보안 토큰 포함
                },
                body: JSON.stringify({email: email, code: code}) // 이메일과 인증번호를 세트로 묶어 서버로 보냅니다.
            });

            const data = await response.json();                   // 서버의 응답을 해석합니다.

            if (response.ok) {                                    // 인증에 성공했다면 (200 OK)
                isEmailVerified = true;                           // 전역 변수를 True로 바꿔 드디어 가입 자격을 줍니다.
                messageEl.className = "text-success mt-1 d-block"; // 메시지 글자색을 초록색으로 바꿉니다.
                messageEl.innerText = "이메일 인증이 완료되었습니다."; // 성공 메시지를 화면에 띄웁니다.

                document.getElementById('verification-code').readOnly = true; // 더 이상 코드를 수정하지 못하게 막습니다.
                this.disabled = true;                             // [인증 확인] 버튼도 더 이상 못 누르게 비활성화합니다.
                document.getElementById('btn-send-email').style.display = 'none'; // [인증번호 발송] 버튼은 아예 숨겨버립니다.
            } else {                                              // 인증에 실패했다면 (코드가 틀렸거나 시간 초과)
                messageEl.className = "text-danger mt-1 d-block"; // 메시지 글자색을 빨간색으로 유지합니다.
                messageEl.innerText = data.message || "인증번호가 일치하지 않습니다."; // 서버가 보내준 실패 이유를 띄웁니다.
            }
        } catch (error) {                                         // 네트워크 에러 발생 시
            messageEl.innerText = "서버 통신 중 오류가 발생했습니다."; // 통신 오류 메시지를 띄웁니다.
        }
    });

    // 5. 최종 회원가입 폼 제출 이벤트 로직
    // HTML에 작성된 id와 동일하게 'signupForm'으로 수정하여 이벤트를 정확히 연결
    document.getElementById('signupForm').addEventListener('submit', async function (e) {

        // 브라우저가 멋대로 페이지를 새로고침하는 현상을 무조건 막아줌
        e.preventDefault();

        // 이메일 인증을 안 했다면 가입을 막고 이메일 칸으로 커서를 이동시킴
        if (!isEmailVerified) {
            alert("이메일 인증을 먼저 완료해주세요!");
            document.getElementById('email').focus();
            return; // 함수 실행을 여기서 멈춰서 서버로 데이터를 보내지 않음
        }

        // 사용자가 입력한 데이터들을 HTML 요소에서 꺼내와 변수에 담음
        const email = document.getElementById('email').value;
        const nickname = document.getElementById('nickname').value;
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('passwordConfirm').value;

        // 비밀번호와 비밀번호 확인 칸에 적은 내용이 똑같은지 검사하는 '프론트엔드 방어 로직'을 추가
        if (password !== passwordConfirm) {
            alert("비밀번호가 일치하지 않습니다. 다시 확인해주세요.");
            document.getElementById('passwordConfirm').focus();
            return;
        }

        // 가입 버튼을 누른 후, 사용자가 버튼을 여러 번 눌러 중복 가입되는 것을 막기 위해 버튼을 잠금
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.innerText;
        submitBtn.disabled = true;
        submitBtn.innerText = "회원가입 처리 중...";

        try {
            // 새로고침 없이 백엔드 회원가입 API로 데이터를 몰래 쏴주는 fetch 비동기 통신을 시작
            const response = await fetch('/api/v1/user/signup/', {
                method: 'POST', // 데이터를 생성하므로 POST 방식을 사용
                headers: {
                    'Content-Type': 'application/json', // 데이터를 JSON 형태로 보낸다고 알림
                    'X-CSRFToken': csrftoken            // Django의 보안 검사를 통과하기 위한 토큰
                },
                // 이메일, 닉네임, 비밀번호를 JSON 문자열로 예쁘게 포장해서 보냄
                body: JSON.stringify({
                    email: email,
                    nickname: nickname,
                    password: password
                })
            });

            // 백엔드에서 돌아온 대답(성공/실패 등)을 JSON 형태로 해독
            const data = await response.json();

            if (response.ok) {
                // 백엔드 응답이 201 Created 등 성공적이라면, 축하 알림을 띄움
                alert("회원가입이 성공적으로 완료되었습니다! 로그인 페이지로 이동합니다.");
                // 가입이 완료되었으므로 깔끔하게 로그인 페이지로 사용자를 이동
                window.location.href = "/api/v1/user/login-page/";
            } else {
                // 이메일 중복, 닉네임 중복 등 백엔드에서 빠꾸를 먹였다면 에러를 보여줌
                let errorMsg = "회원가입에 실패했습니다.";
                // DRF 특성상 배열 형태로 에러가 올 수 있으므로 이를 안전하게 꺼내옴
                if (data.email) errorMsg = data.email[0];
                else if (data.nickname) errorMsg = data.nickname[0];
                else if (data.password) errorMsg = data.password[0];
                else if (data.message) errorMsg = data.message;

                alert(errorMsg);
            }
        } catch (error) {
            // 서버가 꺼져있거나 인터넷이 끊기는 등 아예 통신이 안 된 경우의 예외 처리
            alert("서버 통신 중 오류가 발생했습니다.");
        } finally {
            // 가입에 실패했거나 통신이 끝났다면, 사용자가 다시 시도할 수 있도록 버튼의 잠금을 풀어줌
            submitBtn.disabled = false;
            submitBtn.innerText = originalBtnText;
        }
    });
</script>
{% endblock %}
