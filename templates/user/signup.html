{% extends 'base.html' %}

{% block title %}회원가입 - My Blog{% endblock %}

{% block content %}
<div class="col-md-8 col-lg-6 col-xl-5" style="min-width: 380px; max-width: 550px;">

    <div class="text-center text-white mb-4">
        <h2 class="fw-bold">Join Us</h2>
        <p class="opacity-75">새로운 블로그 여정을 시작해보세요.</p>
    </div>

    <div class="card auth-card p-4 p-sm-5 bg-white">
        <div class="card-body p-0">

            <h4 class="fw-bold text-center mb-4" style="color: var(--brand-dark-green);">계정 만들기</h4>

            <form id="signupForm">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email">이메일</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="nickname" placeholder="Nickname" required>
                    <label for="nickname">닉네임</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" minlength="8" required>
                    <label for="password">비밀번호 (8자 이상)</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="passwordConfirm" placeholder="Password Confirm" required>
                    <label for="passwordConfirm">비밀번호 확인</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 fs-6 mb-3">
                    회원가입 완료
                </button>
            </form>

            <div class="text-center text-muted mt-4">
                이미 계정이 있으신가요? <br>
                <a href="/api/v1/user/login-page/" class="text-brand">로그인 하러가기</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // JS 코드는 이전과 동일합니다.
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const nickname = document.getElementById('nickname').value;
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('passwordConfirm').value;

        if (password !== passwordConfirm) {
            alert("비밀번호가 일치하지 않습니다."); return;
        }
        if (password.length < 8) {
            alert("비밀번호는 최소 8자 이상이어야 합니다."); return;
        }

        const submitBtn = this.querySelector('button[type="submit"]');
        submitBtn.innerText = '처리 중...'; submitBtn.disabled = true;

        try {
            const response = await fetch('/api/v1/user/signup/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, nickname, password })
            });

            const data = await response.json();

            if (response.ok) {
                alert("가입을 축하합니다! 로그인 페이지로 이동합니다.");
                window.location.href = "/api/v1/user/login-page/";
            } else {
                let errorMessage = "회원가입 실패:\n";
                if (typeof data === 'object') {
                    for (const [key, value] of Object.entries(data)) { errorMessage += `- ${value}\n`; }
                } else { errorMessage += "서버 오류가 발생했습니다."; }
                alert(errorMessage);
                submitBtn.innerText = '회원가입 완료'; submitBtn.disabled = false;
            }
        } catch (error) {
            console.error('Error:', error); alert("오류 발생");
            submitBtn.innerText = '회원가입 완료'; submitBtn.disabled = false;
        }
    });
</script>
{% endblock %}
