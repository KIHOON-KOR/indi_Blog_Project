{% extends 'base.html' %}

{% block title %}홈 - My Blog{% endblock %}

{% block content %}
<div class="container-fluid px-0">
    <div class="row g-4 w-100 m-0">

        <div class="col-lg-5 col-xl-4">

            <div class="card border-0 shadow-lg rounded-4 mb-4 text-white"
                 style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2);">
                <div class="card-body p-4">
                    <span class="badge bg-light text-dark mb-2 rounded-pill px-3">Dashboard</span>
                    <h2 class="fw-bold mb-1">환영합니다!</h2>
                    <p class="opacity-75 mb-4">오늘도 당신의 정원을 가꿔보세요.</p>
                    <a href="/api/v1/post/write/" class="btn btn-light btn-lg w-100 rounded-pill fw-bold shadow-sm">
                        <i class="bi bi-pencil-fill me-2"></i>새로운 기록 남기기
                    </a>
                </div>
            </div>

            <div id="grade-card" class="card border-0 shadow-lg rounded-4 overflow-hidden"
                 style="background: white; display: none; transition: transform 0.3s ease;">
                <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
                    <h5 class="fw-bold mb-0" style="color: var(--brand-dark-green);">나의 코딩 정원</h5>
                </div>

                <div class="card-body p-4 text-center">

                    <div id="svg-plant-container" class="level-0 mb-3"
                         style="height: 140px; display: flex; align-items: flex-end; justify-content: center;">
                        <svg viewBox="0 0 100 120" style="width: 100px; height: 120px; overflow: visible;">
                            <ellipse cx="50" cy="115" rx="7" ry="5" fill="#8d6e63"/>

                            <path class="plant-path stem" d="M50,115 Q40,60 50,15" fill="none"
                                  stroke="var(--brand-accent-green)" stroke-width="5" stroke-linecap="round"/>
                            <path class="plant-path branch branch-1" d="M47,70 Q20,60 15,40" fill="none"
                                  stroke="var(--brand-accent-green)" stroke-width="3" stroke-linecap="round"/>
                            <path class="plant-path branch branch-2" d="M48,40 Q75,35 85,25" fill="none"
                                  stroke="var(--brand-accent-green)" stroke-width="3" stroke-linecap="round"/>

                            <circle class="plant-leaf leaf-group-1" cx="50" cy="10" r="6"
                                    fill="var(--brand-accent-green)" style="transform-origin: 50px 10px;"/>
                            <circle class="plant-leaf leaf-group-1" cx="88" cy="23" r="5"
                                    fill="var(--brand-accent-green)" style="transform-origin: 88px 23px;"/>
                            <circle class="plant-leaf leaf-group-2" cx="12" cy="38" r="5"
                                    fill="var(--brand-accent-green)" style="transform-origin: 12px 38px;"/>
                            <circle class="plant-leaf leaf-group-2" cx="30" cy="62" r="4"
                                    fill="var(--brand-accent-green)" style="transform-origin: 30px 62px;"/>
                            <circle class="plant-leaf leaf-group-2" cx="65" cy="45" r="4"
                                    fill="var(--brand-accent-green)" style="transform-origin: 65px 45px;"/>
                        </svg>
                    </div>

                    <h4 id="grade-label" class="fw-bold text-success mb-1"></h4>
                    <p id="grade-message" class="text-muted small mb-2"></p>

                    <div class="mb-2">
                        <span id="next-grade-info"
                              class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-3 py-2 rounded-pill fw-medium"
                              style="display: none; font-size: 0.75rem;">
                        </span>
                    </div>

                    <div class="mt-4 pt-3 border-top text-start">
                        <div class="d-flex justify-content-between align-items-end mb-2">
                            <span class="fw-bold text-dark" style="font-size: 0.85rem;">1년 간의 발자취 (365일)</span>
                            <span class="text-muted" style="font-size: 0.7rem;">초록색 = 글 작성일</span>
                        </div>

                        <div class="heatmap-scroll-wrapper">
                            <div id="heatmap-grid" class="d-grid gap-1"
                                 style="grid-template-rows: repeat(7, 1fr); grid-auto-flow: column;">
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="col-lg-7 col-xl-8">
            <div class="card border-0 shadow-lg rounded-4 h-100" style="background: rgba(255, 255, 255, 0.95);">
                <div class="card-body p-4 p-md-5">

                    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">

                        <h4 class="fw-bold m-0 text-nowrap" style="color: var(--brand-dark-green);">나의 최근 이야기</h4>

                        <div class="d-flex gap-2 flex-wrap">
                            <a href="/api/v1/post/all/page/"
                               class="btn btn-success btn-sm rounded-pill px-3 text-nowrap">전체 피드 구경하기</a>

                            <a href="/api/v1/post/my/page/" id="my-blog-link"
                               class="btn btn-outline-success btn-sm rounded-pill px-3 text-nowrap"
                               style="display: none;">내 블로그 가기</a>
                        </div>
                    </div>

                    <div id="post-list-container">
                        <div class="text-center py-5">
                            <div class="spinner-border text-success" role="status"></div>
                            <p class="text-muted mt-2">이야기를 불러오고 있습니다...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // HTML 문서가 전부 로드되면 내부의 함수들을 실행합니다.
    document.addEventListener("DOMContentLoaded", function () {
        // 내 최근 글을 불러오는 새로운 함수를 호출합니다.
        fetchMyRecentPosts();
        // 잔디밭 렌더링 함수를 호출합니다.
        fetchMyGardenStats();
    });

    const GRADE_SETTINGS = [
        {min: 50, label: '울창한 숲', msg: '완벽하게 피어난 아름다운 정원입니다.', level: 6},
        {min: 40, label: '풍성한 나무', msg: '잎사귀가 아주 풍성하게 열렸어요!', level: 5},
        {min: 30, label: '커다란 나무', msg: '가지가 무성한 듬직한 나무가 자랐어요.', level: 4},
        {min: 20, label: '튼튼한 묘목', msg: '새로운 가지가 힘차게 뻗어나갑니다.', level: 3},
        {min: 10, label: '어린 묘목', msg: '어엿한 줄기가 형태를 잡았어요.', level: 2},
        {min: 5, label: '파릇한 새싹', msg: '흙을 뚫고 예쁜 줄기가 올라왔어요!', level: 1},
        {min: 0, label: '희망찬 씨앗', msg: '글을 작성해서 씨앗을 틔워주세요.', level: 0},
    ];

    async function fetchMyGardenStats() {
        const token = localStorage.getItem('access_token');
        if (!token) return;

        const gradeCard = document.getElementById('grade-card');
        const svgContainer = document.getElementById('svg-plant-container');
        const label = document.getElementById('grade-label');
        const message = document.getElementById('grade-message');
        const nextInfo = document.getElementById('next-grade-info');

        try {
            let allPosts = [];
            let totalCount = 0;
            let nextUrl = '/api/v1/post/my/';

            while (nextUrl) {
                const response = await fetch(nextUrl, {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                const data = await response.json();

                if (response.ok) {
                    const posts = data.results || data;
                    allPosts = allPosts.concat(posts);
                    if (totalCount === 0) totalCount = data.count !== undefined ? data.count : posts.length;
                    nextUrl = data.next || null;
                } else {
                    break;
                }
            }

            const currentGrade = GRADE_SETTINGS.find(g => totalCount >= g.min);
            const nextGrade = [...GRADE_SETTINGS].reverse().find(g => g.min > totalCount);

            label.innerText = currentGrade.label;
            message.innerText = currentGrade.msg;

            if (nextGrade) {
                const remain = nextGrade.min - totalCount;
                nextInfo.innerText = `🚀 다음 '${nextGrade.label}'까지 ${remain}개 남음!`;
            } else {
                nextInfo.innerText = `🎉 최고 레벨 달성! 당신은 블로그 마스터!`;
            }
            nextInfo.style.display = 'inline-block';

            svgContainer.className = `mb-3 level-${currentGrade.level}`;
            gradeCard.style.display = 'block';

            renderHeatmap(allPosts);

        } catch (error) {
            console.error('Garden Stats Load Error:', error);
        }
    }

    function renderHeatmap(posts) {
        const heatmapGrid = document.getElementById('heatmap-grid');
        const scrollWrapper = document.querySelector('.heatmap-scroll-wrapper');
        heatmapGrid.innerHTML = '';

        const postDates = posts.map(p => {
            const d = new Date(p.created_at);
            return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
        });

        const totalDays = 365;
        const today = new Date();

        for (let i = totalDays - 1; i >= 0; i--) {
            const targetDate = new Date(today);
            targetDate.setDate(today.getDate() - i);
            const dateString = `${targetDate.getFullYear()}-${targetDate.getMonth()+1}-${targetDate.getDate()}`;

            const isPosted = postDates.includes(dateString);
            const box = document.createElement('div');
            box.className = 'heatmap-box ' + (isPosted ? 'active' : '');

            const displayDate = targetDate.toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            box.title = isPosted ? `${displayDate} : 글을 작성했습니다 🌱` : `${displayDate} : 기록 없음`;

            heatmapGrid.appendChild(box);
        }

        setTimeout(() => {
            scrollWrapper.scrollLeft = scrollWrapper.scrollWidth;
        }, 100);
    }

    // ✨ 수정포인트 2: 전체 목록 조회가 아닌 '내 최근 글 조회' 로직으로 완전히 변경했습니다.
    async function fetchMyRecentPosts() {
        // 리스트를 그려줄 부모 HTML 컨테이너 요소를 찾습니다.
        const container = document.getElementById('post-list-container');
        // 로그인 인증 수단인 JWT 토큰을 로컬스토리지에서 꺼내옵니다.
        const token = localStorage.getItem('access_token');
        // '내 블로그 가기' 버튼 요소를 가져옵니다.
        const myBlogLink = document.getElementById('my-blog-link');

        // 만약 토큰이 없다면 (즉, 비로그인 상태라면)
        if (!token) {
            // 빈 리스트 대신 사용자에게 로그인을 유도하는 예쁜 안내문구를 삽입합니다.
            container.innerHTML = `<div class="text-center py-5 text-muted">
                <p>로그인하고 나만의 코딩 정원을 가꿔보세요 🌱</p>
                <a href="/api/v1/user/login-page/" class="btn btn-outline-success btn-sm mt-2">로그인 하러가기</a>
            </div>`;
            // 서버 통신 없이 바로 함수를 종료합니다. (최적화)
            return;
        }

        // 로그인된 상태라면, 숨겨두었던 '내 블로그 가기' 버튼을 화면에 보여줍니다.
        myBlogLink.style.display = 'inline-block';

        try {
            // 내 포스트 목록을 가져오는 API로 GET 요청을 보냅니다.
            const response = await fetch('/api/v1/post/my/', {
                // 내 글을 조회해야 하므로 헤더에 인증 토큰을 잊지 않고 담아줍니다.
                headers: {'Authorization': 'Bearer ' + token}
            });
            // 서버에서 돌아온 응답 데이터를 JSON 객체로 변환합니다.
            const data = await response.json();

            // HTTP 응답 코드가 200번대(정상)일 경우
            if (response.ok) {
                // 페이지네이션 구조를 고려하여 실제 포스트 배열 데이터를 추출합니다.
                const posts = data.results || data;

                // 내가 작성한 글이 하나도 없을 경우의 예외 처리입니다.
                if (posts.length === 0) {
                    // 첫 글 작성을 유도하는 메시지를 보여줍니다.
                    container.innerHTML = `<div class="text-center py-5 text-muted">아직 작성된 이야기가 없습니다.<br>첫 글을 작성해보세요!</div>`;
                    return; // 함수 종료
                }

                // 기존에 있던 로딩 스피너 HTML을 비워서 초기화합니다.
                container.innerHTML = '';

                // 💡 최적화 포인트: 대시보드에서는 목록 전체가 필요하지 않으므로 slice(0,5)를 사용해 최신 5개 글만 순회합니다.
                posts.slice(0, 5).forEach(post => {
                    // 작성일을 사용자가 보기 편한 형태(yyyy. mm. dd.)의 문자열로 바꿉니다.
                    const date = new Date(post.created_at).toLocaleDateString();

                    // 해당 게시글이 '전체 공개' 설정인지 확인하여 boolean 값으로 저장합니다.
                    const isPublic = post.visibility === 'PUBLIC';
                    // 공개 여부에 따라 UI 뱃지에 표시할 텍스트를 할당합니다.
                    const badgeText = isPublic ? '공개됨' : '비공개';
                    // 공개 여부에 따라 UI 뱃지에 입힐 부트스트랩 색상 클래스(초록 or 회색)를 할당합니다.
                    const badgeClass = isPublic ? 'bg-success' : 'bg-secondary';

                    // 각 글에 대한 HTML 카드 조각을 생성합니다. (백틱 기호 사용)
                    const postHtml = `
                        <div class="mb-3">
                            <a href="/api/v1/post/${post.id}/page/" class="text-decoration-none card border-0 bg-light-subtle hover-shadow transition-all p-3 rounded-3 d-block border-start border-4 border-success">
                                <div class="d-flex justify-content-between align-items-start mb-1">
                                    <h6 class="fw-bold text-dark mb-0 text-truncate" style="max-width: 80%;">${post.title}</h6>
                                    <span class="text-muted" style="font-size: 0.75rem;">${date}</span>
                                </div>
                                <div class="d-flex align-items-center justify-content-between mt-2">
                                    <div class="d-flex align-items-center">
                                        <div class="bg-success rounded-circle me-2" style="width: 8px; height: 8px;"></div>
                                        <small class="text-success fw-medium">${post.author_nickname || '나의 기록'}</small>
                                    </div>
                                    <span class="badge ${badgeClass} bg-opacity-10 text-${isPublic ? 'success' : 'secondary'} rounded-pill px-2" style="font-size: 0.7rem;">
                                        ${isPublic ? '' : '🔒 '}${badgeText}
                                    </span>
                                </div>
                            </a>
                        </div>
                    `;
                    // 만들어진 HTML 카드 조각을 컨테이너 안에 차례대로 추가합니다.
                    container.insertAdjacentHTML('beforeend', postHtml);
                });
            } else {
                // 토큰 만료 등 서버에서 에러 응답을 보냈을 때의 처리입니다.
                container.innerHTML = '<p class="text-danger text-center">목록을 불러오지 못했습니다.</p>';
            }
        } catch (error) {
            // 인터넷 연결 끊김 등 서버와 아예 통신하지 못했을 때의 에러 처리입니다.
            container.innerHTML = '<p class="text-danger text-center">서버와의 통신 오류</p>';
        }
    }
</script>

<style>
    /* 1. SVG 식물 애니메이션 CSS 유지 */
    .plant-path {
        stroke-dasharray: 150;
        stroke-dashoffset: 150;
        transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .plant-leaf {
        opacity: 0;
        transform: scale(0);
        transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.8s;
    }

    .level-1 .stem {
        stroke-dashoffset: 90;
    }

    .level-2 .stem {
        stroke-dashoffset: 0;
    }

    .level-3 .stem, .level-3 .branch-1 {
        stroke-dashoffset: 0;
    }

    .level-4 .stem, .level-4 .branch-1, .level-4 .branch-2 {
        stroke-dashoffset: 0;
    }

    .level-5 .stem, .level-5 .branch-1, .level-5 .branch-2 {
        stroke-dashoffset: 0;
    }

    .level-5 .leaf-group-1 {
        opacity: 1;
        transform: scale(1);
    }

    .level-6 .stem, .level-6 .branch-1, .level-6 .branch-2 {
        stroke-dashoffset: 0;
    }

    .level-6 .leaf-group-1, .level-6 .leaf-group-2 {
        opacity: 1;
        transform: scale(1);
    }

    /* ✨ 2. 365일 잔디밭(Heatmap) 전용 스타일 ✨ */
    .heatmap-scroll-wrapper {
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 8px;
    }

    .heatmap-scroll-wrapper::-webkit-scrollbar {
        height: 6px;
    }

    .heatmap-scroll-wrapper::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 10px;
    }

    .heatmap-scroll-wrapper::-webkit-scrollbar-track {
        background: transparent;
    }

    .heatmap-box {
        width: 12px;
        height: 12px;
        background-color: #ebedf0;
        border-radius: 2px;
        transition: background-color 0.4s ease, transform 0.2s ease;
        cursor: pointer;
    }

    .heatmap-box:hover {
        transform: scale(1.4);
        z-index: 10;
        position: relative;
    }

    .heatmap-box.active {
        background-color: var(--brand-accent-green);
        box-shadow: 0 0 4px rgba(30, 135, 84, 0.5);
    }

    /* 리스트 스타일 */
    .hover-shadow:hover {
        transform: translateX(5px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05) !important;
        background: #fff !important;
    }

    .transition-all {
        transition: all 0.3s ease;
    }

    #post-list-container {
        max-height: 600px;
        overflow-y: auto;
        padding-right: 5px;
    }

    #post-list-container::-webkit-scrollbar {
        width: 5px;
    }

    #post-list-container::-webkit-scrollbar-thumb {
        background: #e0e0e0;
        border-radius: 10px;
    }
</style>
{% endblock %}
