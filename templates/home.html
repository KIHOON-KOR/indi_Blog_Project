{% extends 'base.html' %} {% block title %}홈 - My Blog{% endblock %} {% block content %} <div class="container-fluid px-0"> <div class="row g-4 w-100 m-0"> <div class="col-lg-5 col-xl-4"> <div class="card border-0 shadow-lg rounded-4 mb-4 text-white"
                 style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2);">
                <div class="card-body p-4"> <span class="badge bg-light text-dark mb-2 rounded-pill px-3">Dashboard</span> <h2 class="fw-bold mb-1">환영합니다!</h2> <p class="opacity-75 mb-4">오늘도 당신의 정원을 가꿔보세요.</p> <a href="/api/v1/post/write/" class="btn btn-light btn-lg w-100 rounded-pill fw-bold shadow-sm"> <i class="bi bi-pencil-fill me-2"></i>새로운 기록 남기기
                    </a>
                </div>
            </div>

            <div id="grade-card" class="card border-0 shadow-lg rounded-4 overflow-hidden"
                 style="background: white; display: none; transition: transform 0.3s ease;"> <div class="card-header bg-transparent border-0 pt-4 px-4"> <h5 class="fw-bold mb-0" style="color: var(--brand-dark-green);">나의 성장 정원</h5> </div>
                <div class="card-body p-4 text-center"> <div id="grade-animation-container" class="mb-3 d-flex align-items-center justify-content-center"
                         style="height: 160px; background: #f8f9fa; border-radius: 1rem;"> <div class="spinner-border text-success spinner-border-sm" role="status"></div> </div>
                    <h4 id="grade-label" class="fw-bold text-success mb-2"></h4> <div class="px-3">
                        <p id="grade-message" class="text-muted small mb-0 p-2 bg-light rounded-3"></p> </div>
                </div>
            </div>
        </div>

        <div class="col-lg-7 col-xl-8"> <div class="card border-0 shadow-lg rounded-4 h-100" style="background: rgba(255, 255, 255, 0.95);">
                <div class="card-body p-4 p-md-5"> <div class="d-flex justify-content-between align-items-center mb-4"> <h4 class="fw-bold m-0" style="color: var(--brand-dark-green);">최근 소식</h4> <a href="/api/v1/post/all/page/" class="btn btn-outline-success btn-sm rounded-pill px-3">전체보기</a> </div>

                    <div id="post-list-container"> <div class="text-center py-5"> <div class="spinner-border text-success" role="status"></div>
                            <p class="text-muted mt-2">이야기를 불러오고 있습니다...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    /**
     * 페이지 로드 완료 시 초기화 함수를 호출합니다.
     */
    document.addEventListener("DOMContentLoaded", function () {
        fetchRecentPosts(); // 최근 게시글 로드 함수 호출
        fetchMyGrade();      // 내 성장 등급 로드 함수 호출
    });

    /**
     * 등급 데이터를 관리하는 상수 배열입니다. (기존 데이터 유지)
     */
    const GRADE_SETTINGS = [
        { min: 30, label: '울창한 숲', msg: '당신의 정원이 숲이 되었네요!', img: 'https://cdn.pixabay.com/animation/2023/04/19/18/10/18-10-14-118_512.gif' },
        { min: 20, label: '커다란 나무', msg: '정말 듬직한 나무가 자랐어요.', img: 'https://cdn.pixabay.com/animation/2022/10/26/12/32/12-32-03-343_512.gif' },
        { min: 10, label: '어린 묘목', msg: '이제 제법 나무다운 모습이네요!', img: 'https://cdn.pixabay.com/animation/2023/10/25/11/49/11-49-14-124_512.gif' },
        { min: 5,  label: '파릇한 새싹', msg: '와! 싹이 틔었어요. 더 키워보세요!', img: 'https://cdn.pixabay.com/animation/2023/03/26/01/15/01-15-42-612_512.gif' },
        { min: 0,  label: '희망찬 씨앗', msg: '첫 글을 써서 성장을 시작하세요.', img: 'https://cdn.pixabay.com/animation/2023/05/02/09/11/09-11-06-654_512.gif' },
    ];

    /**
     * 사용자의 포스트 개수에 따라 등급 카드를 업데이트합니다.
     */
    async function fetchMyGrade() {
        const token = localStorage.getItem('access_token'); // 로컬 스토리지에서 토큰 획득
        if (!token) return; // 미로그인 시 중단

        const gradeCard = document.getElementById('grade-card'); // 등급 카드 선택
        const animContainer = document.getElementById('grade-animation-container'); // 이미지 영역 선택
        const label = document.getElementById('grade-label'); // 등급 이름 영역 선택
        const message = document.getElementById('grade-message'); // 메시지 영역 선택

        try {
            const response = await fetch('/api/v1/post/my/', { // 내 포스트 API 호출
                headers: {'Authorization': 'Bearer ' + token}
            });
            const data = await response.json(); // 결과 파싱

            if (response.ok) {
                const posts = data.results || data; // 포스트 데이터 추출
                const count = posts.length; // 개수 산출

                const currentGrade = GRADE_SETTINGS.find(g => count >= g.min); // 현재 등급 찾기

                gradeCard.style.display = 'block'; // 카드 보이기
                animContainer.innerHTML = `<img src="${currentGrade.img}" style="width: 140px; height: 140px; object-fit: contain;">`; // 이미지 교체
                label.innerText = currentGrade.label; // 라벨 교체
                message.innerText = `${currentGrade.msg} (현재 ${count}개의 열매)`; // 메시지 구성
            }
        } catch (error) {
            console.error('Grade Load Error:', error); // 에러 로그
        }
    }

    /**
     * 최근 게시글을 가져와서 디자인된 리스트로 출력합니다.
     */
    async function fetchRecentPosts() {
        const container = document.getElementById('post-list-container'); // 목록 컨테이너 선택

        try {
            const response = await fetch('/api/v1/post/'); // 게시글 API 호출
            const data = await response.json(); // 결과 파싱

            if (response.ok) {
                const posts = data.results || data; // 데이터 추출

                if (posts.length === 0) { // 글이 없는 경우
                    container.innerHTML = `<div class="text-center py-5 text-muted">아직 작성된 이야기가 없습니다.</div>`;
                    return;
                }

                container.innerHTML = ''; // 기존 내용 삭제

                posts.forEach(post => { // 게시글 순회 및 HTML 생성
                    const date = new Date(post.created_at).toLocaleDateString(); // 날짜 변환
                    // 더 세련된 형태의 리스트 아이템 디자인으로 변경
                    const postHtml = `
                        <div class="mb-3">
                            <a href="/api/v1/post/${post.id}/page/" class="text-decoration-none card border-0 bg-light-subtle hover-shadow transition-all p-3 rounded-3 d-block border-start border-4 border-success">
                                <div class="d-flex justify-content-between align-items-start mb-1">
                                    <h6 class="fw-bold text-dark mb-0 text-truncate" style="max-width: 80%;">${post.title}</h6>
                                    <span class="text-muted" style="font-size: 0.75rem;">${date}</span>
                                </div>
                                <div class="d-flex align-items-center">
                                    <div class="bg-success rounded-circle me-2" style="width: 8px; height: 8px;"></div>
                                    <small class="text-success fw-medium">${post.author_nickname || '익명 사용자'}</small>
                                </div>
                            </a>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', postHtml); // HTML 삽입
                });
            } else {
                container.innerHTML = '<p class="text-danger text-center">목록을 불러오지 못했습니다.</p>';
            }
        } catch (error) {
            console.error('Error fetching posts:', error); // 에러 로그
            container.innerHTML = '<p class="text-danger text-center">서버와의 통신 오류</p>';
        }
    }
</script>

<style>
    /* 🎨 디자인의 디테일을 살리는 커스텀 스타일 */
    .hover-shadow:hover {
        transform: translateX(5px); /* 호버 시 오른쪽으로 살짝 이동 */
        box-shadow: 0 4px 15px rgba(0,0,0,0.05) !important; /* 부드러운 그림자 */
        background: #fff !important; /* 배경색 반전 */
    }
    .transition-all {
        transition: all 0.3s ease; /* 모든 변화에 애니메이션 적용 */
    }
    #post-list-container {
        max-height: 600px; /* 너무 길어지지 않게 최대 높이 설정 */
        overflow-y: auto; /* 내용이 많으면 스크롤 */
        padding-right: 5px;
    }
    /* 스크롤바 디자인 */
    #post-list-container::-webkit-scrollbar { width: 5px; }
    #post-list-container::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 10px; }
</style>
{% endblock %}
