{% extends 'base.html' %}
{% block title %}내 시리즈 관리 - My Blog{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4 text-white">
        <h2 class="fw-bold">내 시리즈 관리</h2>
        <button class="btn btn-primary" onclick="createSeries()">+ 새 시리즈 만들기</button>
    </div>

    <div class="row" id="seriesContainer">
        <div class="text-center text-white opacity-75 py-5">
            <div class="spinner-border" role="status"></div>
            <p class="mt-2">시리즈를 불러오는 중입니다...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const token = localStorage.getItem('access_token');
    if (!token) {
        alert("로그인이 필요합니다.");
        window.location.href = "/api/v1/user/login-page/";
    }

    // 1. 시리즈 목록 불러오기 (Read)
    async function fetchMySeries() {
        const container = document.getElementById('seriesContainer');
        try {
            const res = await fetch('/api/v1/series/my/', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await res.json();
            const seriesList = data.results || data;

            if (seriesList.length === 0) {
                container.innerHTML = `<div class="col-12 text-center text-white opacity-75 py-5"><h4>아직 만들어진 시리즈가 없습니다.</h4></div>`;
                return;
            }

            container.innerHTML = '';
            seriesList.forEach(series => {
                container.innerHTML += `
                    <div class="col-md-4 mb-4">
                        <div class="card shadow-sm h-100 border-0 bg-white">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title fw-bold text-dark mb-3">
                                    <a href="/api/v1/series/${series.id}/page/" class="text-decoration-none text-dark hover-primary">${series.name}</a>
                                </h5>
                                <div class="mt-auto d-flex justify-content-end gap-2">
                                    <button class="btn btn-sm btn-outline-secondary" onclick="updateSeries(${series.id}, '${series.name}')">수정</button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteSeries(${series.id})">삭제</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        } catch (error) {
            console.error(error);
            container.innerHTML = `<div class="col-12 text-center text-danger py-5">목록을 불러오는데 실패했습니다.</div>`;
        }
    }

    // 2. 시리즈 생성 (Create)
    async function createSeries() {
        const name = prompt("새로운 시리즈 이름을 입력하세요:");
        if (!name || name.trim() === "") return;

        const res = await fetch('/api/v1/series/my/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ name: name.trim() })
        });

        if (res.ok) {
            fetchMySeries(); // 성공 시 목록 새로고침
        } else {
            const error = await res.json();
            alert("생성 실패: " + (error.message || "중복된 이름이거나 오류가 발생했습니다."));
        }
    }

    // 3. 시리즈 수정 (Update)
    async function updateSeries(id, currentName) {
        const newName = prompt("변경할 시리즈 이름을 입력하세요:", currentName);
        if (!newName || newName.trim() === "" || newName === currentName) return;

        const res = await fetch(`/api/v1/series/my/${id}/`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ name: newName.trim() })
        });

        if (res.ok) {
            fetchMySeries(); // 성공 시 목록 새로고침
        } else {
            alert("수정 실패: 중복된 이름이거나 오류가 발생했습니다.");
        }
    }

    // 4. 시리즈 삭제 (Delete)
    async function deleteSeries(id) {
        if (!confirm("정말 이 시리즈를 삭제하시겠습니까?\n(포스트는 삭제되지 않으며 '시리즈 없음' 상태로 변경됩니다.)")) return;

        const res = await fetch(`/api/v1/series/my/${id}/`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.ok) {
            fetchMySeries(); // 성공 시 목록 새로고침
        } else {
            alert("삭제에 실패했습니다.");
        }
    }

    // 페이지 로드 시 목록 렌더링
    document.addEventListener("DOMContentLoaded", fetchMySeries);
</script>
{% endblock %}
