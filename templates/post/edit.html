{% extends 'base.html' %}
{% block title %}글 수정 - My Blog{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"/>
{% endblock %}

{% block content %}
<div class="row justify-content-center w-100">
    <div class="col-lg-8">
        <div class="text-center text-white mb-4">
            <h2 class="fw-bold">Edit Story</h2>
            <p class="opacity-75">내용을 다듬어 더 멋진 글을 완성해보세요.</p>
        </div>

        <div class="card auth-card shadow-lg border-0 bg-white">
            <div class="card-body p-5">
                <form id="editForm">
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">제목</label>
                        <input type="text" class="form-control form-control-lg border-2" id="title" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">본문 내용</label>
                        <div id="editor"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold text-secondary">공개 설정</label>
                            <select class="form-select" id="visibility">
                                <option value="PUBLIC">전체 공개</option>
                                <option value="PRIVATE">비공개 (나만 보기)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold text-secondary">시리즈 설정</label>
                            <select class="form-select" id="series">
                                <option value="">선택 안 함</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="tags" class="form-label fw-bold text-secondary">태그</label>
                        <input type="text" class="form-control" id="tags" placeholder="예: Python, Django, 일상 (쉼표로 구분)">
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-5 border-top pt-4">
                        <button type="button" onclick="history.back()" class="btn btn-light rounded-pill px-4">취소
                        </button>
                        <button type="submit" class="btn btn-primary rounded-pill px-5 shadow">수정 완료</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

<script>
    const segments = window.location.pathname.split('/');
    const currentPostId = segments[segments.indexOf('post') + 1];
    const token = localStorage.getItem('access_token');
    let editor;

    document.addEventListener("DOMContentLoaded", async () => {
        editor = new toastui.Editor({
            el: document.querySelector('#editor'),
            height: '500px',
            initialEditType: 'markdown',
            previewStyle: 'vertical'
        });

        // [추가 1] 백엔드에서 내 시리즈 목록을 가져와 옵션 렌더링
        try {
            const seriesRes = await fetch('/api/v1/series/my/', {
                headers: {'Authorization': 'Bearer ' + token}
            });
            if (seriesRes.ok) {
                const seriesData = await seriesRes.json();
                const seriesList = seriesData.results || seriesData;
                const seriesSelect = document.getElementById('series');

                seriesList.forEach(series => {
                    const option = document.createElement('option');
                    option.value = series.id;
                    option.textContent = series.name;
                    seriesSelect.appendChild(option);
                });
            }
        } catch (e) {
            console.error('시리즈 목록 로드 실패', e);
        }

        // [추가 2] 기존 게시글 데이터를 가져와서 각 폼의 값을 채움
        try {
            const res = await fetch(`/api/v1/post/${currentPostId}/`);
            const data = await res.json();

            if (res.ok) {
                document.getElementById('title').value = data.title;
                document.getElementById('visibility').value = data.visibility;

                // 기존 글이 시리즈에 포함되어 있다면 해당 시리즈 선택 상태로 만들기
                if (data.series) {
                    document.getElementById('series').value = data.series;
                }

                if (data.tags && data.tags.length > 0) {
                    document.getElementById('tags').value = data.tags.join(', ');
                }

                editor.setMarkdown(data.content);
            }
        } catch (e) {
            console.error(e);
        }
    });

    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const tagsInput = document.getElementById('tags').value;
        const tagsArray = tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag !== "");
        const seriesValue = document.getElementById('series').value;

        // [추가] payload에 수정한 시리즈(series) 데이터를 포함
        const payload = {
            title: document.getElementById('title').value,
            content: editor.getMarkdown(),
            visibility: document.getElementById('visibility').value,
            tags: tagsArray,
            series: seriesValue ? parseInt(seriesValue) : null
        };

        const res = await fetch(`/api/v1/post/${currentPostId}/`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert("성공적으로 수정되었습니다.");
            window.location.href = `/api/v1/post/${currentPostId}/page/`;
        } else {
            alert("수정에 실패했습니다.");
        }
    });
</script>
{% endblock %}
