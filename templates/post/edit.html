{% extends 'base.html' %}
{% block title %}글 수정 - My Blog{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"/>
{% endblock %}

{% block content %}
<div class="row justify-content-center w-100">
    <div class="col-lg-8">
        <div class="text-center text-white mb-4">
            <h2 class="fw-bold">Edit Story</h2>
            <p class="opacity-75">내용을 다듬어 더 멋진 글을 완성해보세요.</p>
        </div>

        <div class="card auth-card shadow-lg border-0 bg-white">
            <div class="card-body p-5">
                <form id="editForm">
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">제목</label>
                        <input type="text" class="form-control form-control-lg border-2" id="title" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">본문 내용</label>
                        <div id="editor"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold text-secondary">공개 설정</label>
                            <select class="form-select" id="visibility">
                                <option value="PUBLIC">전체 공개</option>
                                <option value="PRIVATE">비공개 (나만 보기)</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="tags" class="form-label fw-bold text-secondary">태그</label>
                        <input type="text" class="form-control" id="tags" placeholder="예: Python, Django, 일상 (쉼표로 구분)">
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-5 border-top pt-4">
                        <button type="button" onclick="history.back()" class="btn btn-light rounded-pill px-4">취소
                        </button>
                        <button type="submit" class="btn btn-primary rounded-pill px-5 shadow">수정 완료</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

<script>
    // URL 경로를 '/' 기준으로 쪼개어 배열로 만듭니다. (예: ['', 'api', 'v1', 'post', '12', 'edit', 'page', ''])
    const segments = window.location.pathname.split('/');
    // 'post'라는 단어 바로 다음 배열 요소를 가져와 현재 게시글의 ID로 사용합니다.
    const currentPostId = segments[segments.indexOf('post') + 1];
    // 브라우저 로컬 스토리지에 저장된 사용자 인증 토큰을 가져옵니다.
    const token = localStorage.getItem('access_token');

    // Toast UI 에디터 객체를 담을 전역 변수를 선언합니다.
    let editor;

    // HTML 문서(DOM)가 완전히 로드되면 내부의 비동기 함수를 실행합니다.
    document.addEventListener("DOMContentLoaded", async () => {
        // 지정된 HTML 요소(#editor)에 마크다운 에디터를 생성하고 설정값을 부여합니다.
        editor = new toastui.Editor({
            el: document.querySelector('#editor'), // 에디터를 렌더링할 타겟 요소
            height: '500px',                       // 에디터의 세로 크기
            initialEditType: 'markdown',           // 초기 작성 모드는 마크다운
            previewStyle: 'vertical'               // 미리보기를 오른쪽에 세로로 분할하여 표시
        });

        try {
            // 현재 게시글의 상세 정보를 가져오기 위해 백엔드 API로 GET 요청을 보냅니다.
            const res = await fetch(`/api/v1/post/${currentPostId}/`);
            // 서버에서 온 응답 데이터를 JSON 객체로 변환합니다.
            const data = await res.json();

            // HTTP 응답 코드가 200번대(정상)일 경우
            if (res.ok) {
                // 가져온 데이터에서 제목을 찾아 제목 입력창의 값으로 넣습니다.
                document.getElementById('title').value = data.title;
                // 가져온 데이터에서 공개 여부를 찾아 셀렉트 박스의 값으로 세팅합니다.
                document.getElementById('visibility').value = data.visibility;

                // ✨ [수정됨] 만약 서버에서 보내준 데이터에 태그 배열이 존재한다면?
                if (data.tags && data.tags.length > 0) {
                    // 배열 요소들을 쉼표와 공백(', ')으로 이어 붙인 문자열로 만들어 태그 입력창에 넣습니다.
                    document.getElementById('tags').value = data.tags.join(', ');
                }

                // 가져온 본문 마크다운 문자열을 에디터 내부에 채워 넣습니다.
                editor.setMarkdown(data.content);
            }
        } catch (e) {
            // 서버 통신 중 에러가 발생하면 개발자 도구 콘솔에 에러를 출력합니다.
            console.error(e);
        }
    });

    // 'editForm' 폼에서 제출(submit) 이벤트가 발생했을 때 실행할 비동기 함수를 등록합니다.
    document.getElementById('editForm').addEventListener('submit', async (e) => {
        // 폼이 제출될 때 페이지가 새로고침되는 기본 브라우저 동작을 막습니다.
        e.preventDefault();

        // ✨ [수정됨] 사용자가 수정한 태그 입력창의 문자열 값을 가져옵니다.
        const tagsInput = document.getElementById('tags').value;

        // ✨ [수정됨] 태그 문자열을 쉼표 기준으로 쪼개고, 앞뒤 공백을 없앤 뒤, 빈 문자열이 아닌 것만 모아 배열로 만듭니다.
        const tagsArray = tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag !== "");

        // 서버로 보낼 데이터를 담을 자바스크립트 객체(Payload)를 구성합니다.
        const payload = {
            title: document.getElementById('title').value, // 수정된 제목
            content: editor.getMarkdown(),                 // 에디터에서 가져온 마크다운 본문
            visibility: document.getElementById('visibility').value, // 공개 설정 상태
            tags: tagsArray                                // ✨ [추가됨] 정리된 태그 배열 데이터
        };

        // 서버의 해당 게시글 정보 수정 API로 PUT 요청을 보냅니다.
        const res = await fetch(`/api/v1/post/${currentPostId}/`, {
            method: 'PUT', // 리소스 전체 수정을 의미하는 HTTP 메서드
            headers: {
                'Content-Type': 'application/json', // 보내는 데이터가 JSON 형식임을 알림
                'Authorization': 'Bearer ' + token  // 내 글임을 증명하는 인증 토큰
            },
            body: JSON.stringify(payload) // 자바스크립트 객체를 JSON 문자열로 변환하여 본문에 담음
        });

        // 요청이 성공적으로 처리되었다면
        if (res.ok) {
            // 사용자에게 성공 알림창을 띄웁니다.
            alert("성공적으로 수정되었습니다.");
            // 수정된 게시글의 상세 페이지로 화면을 이동시킵니다.
            window.location.href = `/api/v1/post/${currentPostId}/page/`;
        } else {
            // 에러가 발생했다면 실패 알림창을 띄웁니다.
            alert("수정에 실패했습니다.");
        }
    });
</script>
{% endblock %}
