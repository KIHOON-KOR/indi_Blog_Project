{% extends 'base.html' %}
{% block title %}글 수정 - My Blog{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"/>
<style>
    /* 썸네일 미리보기 박스의 점선 테두리 스타일입니다. */
    .border-dashed {
        border-style: dashed !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center w-100">
    <div class="col-12 col-xl-15">
        <div class="text-center text-white mb-4">
            <h2 class="fw-bold">Edit Story</h2>
            <p class="opacity-75">내용을 다듬어 더 멋진 글을 완성해보세요.</p>
        </div>

        <div class="card auth-card shadow-lg border-0 bg-white">
            <div class="card-body p-4 p-md-5">
                <form id="editForm">
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">제목</label>
                        <input type="text" class="form-control form-control-lg border-2" id="title" required>
                    </div>

                    <div class="mb-5">
                        <div class="d-flex justify-content-between align-items-end mb-2">
                            <label class="form-label fw-bold text-secondary mb-0">본문 내용</label>

                            <div class="d-flex align-items-center gap-3">
                                <span class="text-muted small fw-bold">
                                    글자 수: <span id="text-count" class="text-success">0</span>자
                                </span>

                                <button type="button"
                                        class="btn btn-sm btn-warning fw-bold rounded-pill px-3 shadow-sm text-dark"
                                        data-bs-toggle="modal" data-bs-target="#aiToneModal">
                                    <i class="bi bi-magic me-1"></i> AI로 글 다듬기
                                </button>
                            </div>
                        </div>
                        <div id="editor"></div>
                    </div>

                    <div class="row g-4 mb-4">
                        <div class="col-lg-6">
                            <div class="bg-light rounded-4 p-4 h-100 border border-light-subtle">
                                <h5 class="fw-bold text-dark mb-4"><i class="bi bi-gear-fill text-success me-2"></i>기본
                                    설정</h5>

                                <div class="row mb-3">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <label class="form-label fw-bold text-secondary small">공개 설정</label>
                                        <select class="form-select border-0 shadow-sm" id="visibility">
                                            <option value="PUBLIC">전체 공개</option>
                                            <option value="PRIVATE">비공개 (나만 보기)</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label fw-bold text-secondary small">시리즈 설정</label>
                                        <select class="form-select border-0 shadow-sm" id="series">
                                            <option value="">선택 안 함</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mt-4">
                                    <label for="tags" class="form-label fw-bold text-secondary small">태그</label>
                                    <input type="text" class="form-control border-0 shadow-sm" id="tags"
                                           placeholder="예: Python, Django, 일상 (쉼표로 구분)">
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="bg-light rounded-4 p-4 h-100 border border-light-subtle d-flex flex-column">
                                <h5 class="fw-bold text-dark mb-3"><i class="bi bi-image text-success me-2"></i>대표 썸네일
                                </h5>

                                <label for="thumbnail-file" class="form-label text-secondary fw-bold small">
                                    이미지 파일 업로드 (새로 변경할 경우에만 선택)
                                </label>
                                <input type="file" class="form-control border-0 shadow-sm mb-3" id="thumbnail-file"
                                       accept="image/*">

                                <div id="thumbnail-preview"
                                     class="rounded-3 border border-2 border-dashed border-secondary border-opacity-25 d-flex align-items-center justify-content-center overflow-hidden flex-grow-1 bg-white relative"
                                     style="min-height: 160px;">
                                    <span class="text-muted small"
                                          id="preview-text">이미지를 선택하면<br>여기에 미리보기가 표시됩니다.</span>
                                    <img id="preview-img" src="" class="w-100 h-100 object-fit-cover d-none"
                                         alt="썸네일 미리보기">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">

                        <span id="auto-save-time" class="text-muted small fw-bold ms-2"></span>

                        <div class="d-flex gap-2">
                            <button type="button" onclick="history.back()" class="btn btn-light rounded-pill px-4">취소
                            </button>
                            <button type="submit" class="btn btn-primary rounded-pill px-5 shadow">수정 완료</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="aiToneModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content rounded-4 border-0 shadow-lg">

            <div class="modal-header bg-light border-bottom-0 pt-4 px-4 rounded-top-4">
                <h5 class="modal-title fw-bold" style="color: var(--brand-dark-green);">
                    <i class="bi bi-magic text-warning me-2"></i>AI 문체 변환기
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4 bg-white">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary small">원본 텍스트 (최대 2000자)</label>

                        <textarea id="ai-source-text" class="form-control border-2" rows="8"
                                  maxlength="2000"
                                  placeholder="예: 강남역 마라탕 존맛탱 웨이팅 엄청 김..."></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary small">변환된 텍스트</label>
                        <div class="position-relative h-100">
                            <textarea id="ai-result-text" class="form-control bg-light border-0" rows="8"
                                      placeholder="결과가 여기에 표시됩니다." readonly></textarea>

                            <div id="ai-loading" class="position-absolute top-50 start-50 translate-middle d-none">
                                <div class="spinner-border text-success" role="status"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <label class="form-label fw-bold text-secondary small mb-2">원하는 문체를 선택하세요</label>
                    <div class="d-flex gap-2 flex-wrap">
                        <input type="radio" class="btn-check" name="tone-options" id="tone-pro" value="professional"
                               checked>
                        <label class="btn btn-outline-success rounded-pill px-3" for="tone-pro">💻 전문적인 IT</label>

                        <input type="radio" class="btn-check" name="tone-options" id="tone-friendly" value="friendly">
                        <label class="btn btn-outline-success rounded-pill px-3" for="tone-friendly">😊 친근한 리뷰</label>

                        <input type="radio" class="btn-check" name="tone-options" id="tone-emo" value="emotional">
                        <label class="btn btn-outline-success rounded-pill px-3" for="tone-emo">🌙 감성 에세이</label>
                    </div>
                </div>
            </div>

            <div class="modal-footer bg-light border-top-0 pb-4 px-4 rounded-bottom-4 d-flex justify-content-between">
                <button type="button" id="btn-ai-convert" class="btn btn-dark rounded-pill px-4">변환하기</button>
                <button type="button" id="btn-ai-apply" class="btn btn-primary rounded-pill px-4 shadow-sm" disabled>
                    에디터에 삽입
                </button>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

<script>
    // 1. URL에서 게시글 ID 추출 및 로컬 스토리지 정보 가져오기
    const segments = window.location.pathname.split('/');
    const currentPostId = segments[segments.indexOf('post') + 1];
    const token = localStorage.getItem('access_token');

    // 전역 변수 모음
    let editor;
    let isOriginalTemp = false; // 원래 임시저장 글이었는지 확인
    let lastSavedContent = "";  // 변경사항 비교 변수
    let finalImageUrl = "";     // 썸네일 URL 저장 변수

    // 🌟 오직 단 한 번만 열리는 메인 실행 블록입니다!
    document.addEventListener("DOMContentLoaded", async () => {

        if (!token) {
            alert("로그인이 필요한 서비스입니다.");
            window.location.href = "/api/v1/user/login-page/";
            return;
        }

        // ==========================================
        // 1. 에디터 초기화
        // ==========================================
        editor = new toastui.Editor({
            el: document.querySelector('#editor'),
            height: '700px',
            initialEditType: 'markdown',
            previewStyle: 'vertical',
            hooks: {
                addImageBlobHook: async (blob, callback) => {
                    try {
                        const urlResponse = await fetch(`/api/v1/post/image/presigned-url/?filename=${encodeURIComponent(blob.name)}`, {
                            headers: {'Authorization': 'Bearer ' + token}
                        });
                        if (!urlResponse.ok) throw new Error('백엔드 URL 발급 실패');
                        const urlData = await urlResponse.json();

                        const s3Response = await fetch(urlData.presigned_url, {
                            method: 'PUT',
                            headers: {'Content-Type': blob.type},
                            body: blob
                        });
                        if (!s3Response.ok) throw new Error('S3 직접 업로드 실패');

                        callback(urlData.image_url, blob.name);
                    } catch (error) {
                        console.error('본문 이미지 업로드 오류:', error);
                        alert('이미지 업로드에 실패했습니다. 네트워크 상태를 확인해주세요.');
                    }
                }
            }
        });

        // 글자 수 카운트 기능
        const textCountElement = document.getElementById('text-count');
        editor.on('change', function () {
            let text = editor.getMarkdown();
            let length = text.replace(/\s/g, '').length; // 공백 제외 길이
            textCountElement.innerText = length;
            textCountElement.className = length > 0 ? 'text-success fw-bold' : 'text-secondary fw-bold';
        });

        // ==========================================
        // 2. 시리즈 목록 불러오기
        // ==========================================
        try {
            const seriesRes = await fetch('/api/v1/series/my/', {
                headers: {'Authorization': 'Bearer ' + token}
            });
            if (seriesRes.ok) {
                const seriesData = await seriesRes.json();
                const seriesList = seriesData.results || seriesData;
                const seriesSelect = document.getElementById('series');
                seriesList.forEach(series => {
                    const option = document.createElement('option');
                    option.value = series.id;
                    option.textContent = series.name;
                    seriesSelect.appendChild(option);
                });
            }
        } catch (e) {
            console.error('시리즈 로드 실패', e);
        }

        // ==========================================
        // 3. 기존 게시글 데이터 불러와서 채우기
        // ==========================================
        try {
            const res = await fetch(`/api/v1/post/${currentPostId}/`);
            const data = await res.json();

            if (res.ok) {
                // 제목 입력 칸에 백엔드에서 받아온 기존 제목을 채워 넣습니다.
                document.getElementById('title').value = data.title;
                // 공개 설정 드롭다운을 기존 상태(공개/비공개)로 맞춥니다.
                document.getElementById('visibility').value = data.visibility;

                // 백엔드에서 내려주는 시리즈 ID의 키값은 'series_id' 이므로 이에 맞춰 검사
                if (data.series_id) {
                    // 글이 속해있던 시리즈가 존재한다면, 시리즈 선택 드롭다운의 값을 해당 ID로 변경하여 선택 상태로 만듬
                    document.getElementById('series').value = data.series_id;
                }

                // 태그 배열이 존재하고 1개 이상이라면 쉼표 단위 문자열로 변환하여 입력 칸에 채웁니다.
                if (data.tags && data.tags.length > 0) {
                    document.getElementById('tags').value = data.tags.join(', ');
                }

                // 기존 썸네일 세팅
                if (data.thumbnail) {
                    finalImageUrl = data.thumbnail;
                    document.getElementById('preview-img').src = data.thumbnail;
                    document.getElementById('preview-img').classList.remove('d-none');
                    document.getElementById('preview-text').style.display = 'none';
                }

                editor.setMarkdown(data.content);

                // 자동저장을 위한 전역 변수 초기화
                isOriginalTemp = data.is_temp === true;
                lastSavedContent = data.content;

                // 로컬 백업 복구 로직
                // ========================================================
                // 브라우저 로컬 스토리지에 이 글의 백업본이 남아있는지 확인합니다.
                const backupContent = localStorage.getItem(`backup_post_${currentPostId}`);

                // 만약 백업본이 존재하고, 그 백업본이 방금 서버에서 불러온 원본 내용과 다를 경우에만 물어봅니다.
                // (같으면 굳이 물어볼 필요가 없으니까요!)
                if (backupContent && backupContent !== data.content) {
                    // confirm 창을 띄워 사용자의 의사를 물어봅니다. (확인=true, 취소=false 반환)
                    const wantsToRestore = confirm("이전에 수정하다 만 백업본이 있습니다. 불러오시겠습니까?\n(취소 시 기존 백업본은 영구 삭제됩니다.)");

                    if (wantsToRestore) {
                        // [확인]을 누르면, 에디터의 내용을 로컬 백업본으로 싹 덮어씌웁니다.
                        editor.setMarkdown(backupContent);
                        // 다음 5분 뒤 비교를 위해, 현재 내용도 백업본으로 갱신해 줍니다.
                        lastSavedContent = backupContent;
                    } else {
                        // [취소]를 누르면, 백업본이 필요 없다는 뜻이므로 로컬 스토리지에서 깨끗하게 지워줍니다.
                        localStorage.removeItem(`backup_post_${currentPostId}`);
                    }
                }
            }
        } catch (e) {
            console.error(e);
        }

        // ==========================================
        // 4. 대표 썸네일 업로드 기능
        // ==========================================
        const fileInput = document.getElementById('thumbnail-file');
        const previewImg = document.getElementById('preview-img');
        const previewText = document.getElementById('preview-text');

        fileInput.addEventListener('change', async function () {
            const file = this.files[0];
            if (!file) return;

            previewText.innerHTML = '<div class="spinner-border spinner-border-sm text-success"></div><br>업로드 중...';
            previewText.style.display = 'block';
            previewImg.classList.add('d-none');

            try {
                const urlResponse = await fetch(`/api/v1/post/image/presigned-url/?filename=${encodeURIComponent(file.name)}`, {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                const urlData = await urlResponse.json();
                if (!urlResponse.ok) throw new Error("URL 발급 실패");

                const s3Response = await fetch(urlData.presigned_url, {
                    method: 'PUT',
                    headers: {'Content-Type': file.type},
                    body: file
                });

                if (s3Response.ok) {
                    finalImageUrl = urlData.image_url;
                    previewImg.src = finalImageUrl;
                    previewImg.classList.remove('d-none');
                    previewText.style.display = 'none';
                } else {
                    throw new Error("S3 직접 업로드 실패");
                }
            } catch (error) {
                console.error("업로드 에러:", error);
                previewText.innerHTML = '<span class="text-danger">업로드에 실패했습니다.</span>';
                fileInput.value = "";
            }
        });

        // ==========================================
        // 5. AI 문체 변환기 이벤트 연결
        // ==========================================
        // 1. [변환하기] 버튼을 눌렀을 때 실행되는 이벤트입니다.
        document.getElementById('btn-ai-convert').addEventListener('click', async () => {
            const text = document.getElementById('ai-source-text').value.trim();
            const tone = document.querySelector('input[name="tone-options"]:checked').value;

            if (!text) {
                alert('변환할 텍스트를 입력해주세요.');
                return;
            }

            // [추가] 프론트엔드 방어 로직: 악의적으로 maxlength를 뚫었을 경우를 대비해 JS에서도 한번 더 길이를 검사합니다.
            if (text.length > 2000) {
                alert('텍스트는 최대 2000자까지만 변환할 수 있습니다.');
                return; // 백엔드로 무거운 요청을 보내기 전에 차단합니다.
            }

            const resultTextArea = document.getElementById('ai-result-text');
            resultTextArea.value = '';

            // 1️⃣ 버튼을 누르자마자 로딩 스피너를 켭니다.
            document.getElementById('ai-loading').classList.remove('d-none');

            const convertBtn = document.getElementById('btn-ai-convert');
            convertBtn.disabled = true;
            convertBtn.innerText = '변환 중...';

            try {
                const response = await fetch('/api/ai/tone-convert/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('access_token') // token 변수가 전역에 있다면 token으로 쓰셔도 무방합니다.
                    },
                    body: JSON.stringify({text: text, tone: tone})
                });

                // [수정] 응답 상태가 정상이 아닐 때의 에러 처리 로직을 세분화합니다.
                if (!response.ok) {
                    // 서버에서 보낸 429 Too Many Requests 에러인지 확인합니다. (Throttling 제한에 걸린 경우)
                    if (response.status === 429) {
                        alert('잠시 후 다시 시도해주세요. (요청 횟수 초과)');
                        return; // 함수를 종료하여 스트리밍을 시도하지 않게 합니다.
                    }

                    // 429가 아닌 다른 에러(예: 400 등)일 경우 기존처럼 상세 에러를 파싱하여 띄웁니다.
                    const errorData = await response.json();
                    alert('변환 실패: ' + (errorData.message || errorData.error || '알 수 없는 오류'));
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');

                let isFirstChunk = true;

                // [최적화 추가] 스트리밍 데이터가 네트워크 통신 중 잘려서 올 수 있으므로,
                // 조각난 텍스트를 임시로 모아둘 버퍼(Buffer) 문자열을 준비합니다.
                let buffer = "";

                while (true) {
                    const {done, value} = await reader.read();

                    if (done) break;

                    // 새로 도착한 바이트 조각을 텍스트로 디코딩하여 버퍼에 차곡차곡 쌓아둡니다.
                    buffer += decoder.decode(value, {stream: true});

                    // SSE (Server-Sent Events) 표준 규약은 이벤트 하나가 끝날 때마다 '\n\n'을 보냅니다.
                    // 버퍼를 '\n\n' 기준으로 쪼개어 완전한 이벤트 덩어리(메시지)들만 배열로 만듭니다.
                    const parts = buffer.split('\n\n');

                    // 배열의 맨 마지막 요소는 아직 '\n\n'이 도착하지 않은 '잘린 조각'일 확률이 높습니다.
                    // pop()으로 빼내어 다시 버퍼에 넣어두고(다음 통신 때 이어붙이기 위해), 완전한 조각들만 반복문으로 돌립니다.
                    buffer = parts.pop();

                    for (const part of parts) {
                        // 빈 조각은 무시하고 넘어갑니다.
                        if (part.trim() === "") continue;

                        // [에러 방어] 백엔드에서 보낸 'event: error' (구글 서버 다운 등)를 감지합니다!
                        if (part.includes('event: error')) {
                            // '\n'으로 쪼개서 'data: '로 시작하는 진짜 에러 내용 줄을 찾습니다.
                            const dataLine = part.split('\n').find(line => line.startsWith('data: '));
                            if (dataLine) {
                                // 'data: ' 글자를 지우고 순수 JSON 텍스트만 남겨서 파싱합니다.
                                const errorJson = JSON.parse(dataLine.replace('data: ', ''));
                                alert("AI 오류: " + errorJson.error); // 예쁘게 알림창을 띄워줍니다.
                            }
                            return; // 더 이상 스트리밍을 진행하지 않고 함수를 강제 종료합니다.
                        }

                        // [정상 처리] 스트리밍 텍스트 데이터인 경우 ('data: ' 로 시작)
                        if (part.startsWith('data: ')) {
                            // 'data: ' 접두사를 제거하여 순수 JSON 문자열만 추출합니다.
                            const dataStr = part.replace('data: ', '');

                            try {
                                // 추출한 텍스트를 안전한 자바스크립트 객체(JSON)로 변환합니다.
                                const parsedData = JSON.parse(dataStr);

                                // 2️⃣ 첫 번째 정상 텍스트가 도착했다면 로딩 스피너를 숨깁니다!
                                if (isFirstChunk && parsedData.text) {
                                    document.getElementById('ai-loading').classList.add('d-none');
                                    isFirstChunk = false;
                                }

                                // 백엔드에서 JSON 안에 "text"라는 키로 보낸 실제 글자만 쏙 빼서 화면에 이어 붙입니다.
                                resultTextArea.value += parsedData.text;
                                // 글자가 추가될 때마다 스크롤을 맨 아래로 자연스럽게 내려줍니다.
                                resultTextArea.scrollTop = resultTextArea.scrollHeight;

                            } catch (e) {
                                // 만약 JSON 파싱에 실패하더라도 화면이 멈추지 않게 조용히 콘솔에만 기록합니다.
                                console.error("데이터 파싱 오류:", e, dataStr);
                            }
                        }
                    }
                }

                document.getElementById('btn-ai-apply').disabled = false;

            } catch (error) {
                console.error('AI Convert Error:', error);
                alert('서버 통신 중 오류가 발생했습니다.');
            } finally {
                // 스트리밍이 정상적으로 끝났든, 에러가 났든 반드시 로딩을 끄고 버튼 상태를 복구합니다.
                document.getElementById('ai-loading').classList.add('d-none');
                convertBtn.disabled = false;
                convertBtn.innerText = '변환하기';
            }
        });

        document.getElementById('btn-ai-apply').addEventListener('click', () => {
            const resultText = document.getElementById('ai-result-text').value;
            if (resultText && editor) {
                editor.insertText('\n\n' + resultText + '\n\n');
                const modal = bootstrap.Modal.getInstance(document.getElementById('aiToneModal'));
                modal.hide();
            }
        });

        // ==========================================
        // 6. 게시글 수정(발행) 제출 폼 로직
        // ==========================================
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const tagsInput = document.getElementById('tags').value;
            const tagsArray = tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag !== "");
            const seriesValue = document.getElementById('series').value;

            const payload = {
                title: document.getElementById('title').value,
                content: editor.getMarkdown(),
                visibility: document.getElementById('visibility').value,
                tags: tagsArray,
                series: seriesValue ? parseInt(seriesValue) : null,
                thumbnail: finalImageUrl !== "" ? finalImageUrl : null
            };

            const res = await fetch(`/api/v1/post/${currentPostId}/`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                // 서버에 수정 완료(발행)가 무사히 끝났으므로, 더 이상 쓸모없는 로컬 백업을 깔끔하게 지워줍니다.
                localStorage.removeItem(`backup_post_${currentPostId}`);

                alert("성공적으로 수정되었습니다.");
                window.location.href = `/api/v1/post/${currentPostId}/page/`;
            } else {
                alert("수정에 실패했습니다.");
            }
        });

        // ==========================================
        // 7. 대망의 '자동 임시저장 / 로컬 백업' 타이머
        // ==========================================
        // 💡 테스트를 위해 10초(10000ms)로 셋팅해두었습니다!
        // 💡 테스트 후 문제가 없다면 300000(5분)으로 꼭 변경해 주세요!
        setInterval(async () => {
            const currentContent = editor.getMarkdown();
            const title = document.getElementById('title').value;

            // ⚠️ 제목이 비어있거나 변경사항이 없으면 서버로 안 보냅니다! (중요)
            if (!title || !currentContent || currentContent === lastSavedContent) return;

            const timeDisplay = document.getElementById('auto-save-time');
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            // 일반 발행된 글을 수정 중일 때 -> 브라우저 로컬스토리지 백업
            if (!isOriginalTemp) {
                localStorage.setItem(`backup_post_${currentPostId}`, currentContent);
                if (timeDisplay) {
                    timeDisplay.innerHTML = `<i class="bi bi-shield-check text-success"></i> 브라우저 안전 백업: ${timeString}`;
                }
                lastSavedContent = currentContent;
                return;
            }

            // 임시저장 글을 수정 중일 때 -> 백엔드로 PUT 요청
            const payload = {
                title: title,
                content: currentContent,
                is_temp: true,
                visibility: document.getElementById('visibility').value,
                tags: document.getElementById('tags').value.split(',').map(tag => tag.trim()).filter(tag => tag !== ""),
            };

            try {
                const response = await fetch(`/api/v1/post/${currentPostId}/`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    lastSavedContent = currentContent;
                    if (timeDisplay) timeDisplay.innerText = `마지막 자동 저장: ${timeString}`;
                }
            } catch (error) {
                console.error('자동 임시저장 실패:', error);
            }
        }, 300000);

    });
</script>
{% endblock %}
