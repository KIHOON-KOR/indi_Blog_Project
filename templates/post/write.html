{% extends 'base.html' %}
{% block title %}글쓰기 - My Blog{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"/>
<style>
    /* 썸네일 미리보기 박스의 점선 테두리 스타일입니다. */
    .border-dashed {
        border-style: dashed !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center w-100">
    <div class="col-12 col-xl-15">
        <div class="text-center text-white mb-4">
            <h2 class="fw-bold">New Story</h2>
            <p class="opacity-75">당신의 지식과 경험을 공유해주세요.</p>
        </div>

        <div class="card auth-card shadow-lg border-0">
            <div class="card-body p-4 p-md-5">
                <form id="postForm">
                    <div class="mb-4">
                        <label for="title" class="form-label fw-bold text-secondary">제목</label>
                        <input type="text" class="form-control form-control-lg border-2" id="title"
                               placeholder="매력적인 제목을 입력하세요" required>
                    </div>

                    <div class="mb-5">
                        <div class="d-flex justify-content-between align-items-end mb-2">
                            <label class="form-label fw-bold text-secondary mb-0">본문 내용</label>
                            <button type="button"
                                    class="btn btn-sm btn-warning fw-bold rounded-pill px-3 shadow-sm text-dark"
                                    data-bs-toggle="modal" data-bs-target="#aiToneModal">
                                <i class="bi bi-magic me-1"></i> AI로 글 다듬기
                            </button>
                        </div>
                        <div id="editor"></div>
                    </div>

                    <div class="row g-4 mb-4">

                        <div class="col-lg-6">
                            <div class="bg-light rounded-4 p-4 h-100 border border-light-subtle">
                                <h5 class="fw-bold text-dark mb-4"><i class="bi bi-gear-fill text-success me-2"></i>기본
                                    설정</h5>

                                <div class="row mb-3">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <label for="visibility" class="form-label fw-bold text-secondary small">공개
                                            설정</label>
                                        <select class="form-select border-0 shadow-sm" id="visibility">
                                            <option value="PUBLIC" selected>전체 공개</option>
                                            <option value="PRIVATE">비공개 (나만 보기)</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="series" class="form-label fw-bold text-secondary small">시리즈
                                            (선택)</label>
                                        <select class="form-select border-0 shadow-sm" id="series">
                                            <option value="">선택 안 함</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mt-4">
                                    <label for="tags" class="form-label fw-bold text-secondary small">태그</label>
                                    <input type="text" class="form-control border-0 shadow-sm" id="tags"
                                           placeholder="예: Python, Django, 일상 (쉼표로 구분)">
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="bg-light rounded-4 p-4 h-100 border border-light-subtle d-flex flex-column">
                                <h5 class="fw-bold text-dark mb-3"><i class="bi bi-image text-success me-2"></i>대표 썸네일
                                </h5>

                                <label for="thumbnail-file" class="form-label text-secondary fw-bold small">
                                    이미지 파일 업로드 (S3 직접 전송)
                                </label>
                                <input type="file" class="form-control border-0 shadow-sm mb-3" id="thumbnail-file"
                                       accept="image/*">

                                <div id="thumbnail-preview"
                                     class="rounded-3 border border-2 border-dashed border-secondary border-opacity-25 d-flex align-items-center justify-content-center overflow-hidden flex-grow-1 bg-white relative"
                                     style="min-height: 160px;">
                                    <span class="text-muted small"
                                          id="preview-text">이미지를 선택하면<br>여기에 미리보기가 표시됩니다.</span>
                                    <img id="preview-img" src="" class="w-100 h-100 object-fit-cover d-none"
                                         alt="썸네일 미리보기">
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="/" class="btn btn-light rounded-pill px-4">취소</a>
                        <button type="button" id="tempSaveBtn" class="btn btn-outline-secondary rounded-pill px-4">
                            임시저장
                        </button>
                        <button type="submit" class="btn btn-primary rounded-pill px-5 shadow">발행하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="aiToneModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content rounded-4 border-0 shadow-lg">

            <div class="modal-header bg-light border-bottom-0 pt-4 px-4 rounded-top-4">
                <h5 class="modal-title fw-bold" style="color: var(--brand-dark-green);">
                    <i class="bi bi-magic text-warning me-2"></i>AI 문체 변환기
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4 bg-white">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary small">원본 텍스트 (대충 적어도 찰떡같이!)</label>
                        <textarea id="ai-source-text" class="form-control border-2" rows="8"
                                  placeholder="예: 강남역 마라탕 존맛탱 웨이팅 엄청 김..."></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-secondary small">변환된 텍스트</label>
                        <div class="position-relative h-100">
                            <textarea id="ai-result-text" class="form-control bg-light border-0" rows="8"
                                      placeholder="결과가 여기에 표시됩니다." readonly></textarea>

                            <div id="ai-loading" class="position-absolute top-50 start-50 translate-middle d-none">
                                <div class="spinner-border text-success" role="status"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <label class="form-label fw-bold text-secondary small mb-2">원하는 문체를 선택하세요</label>
                    <div class="d-flex gap-2 flex-wrap">

                        <input type="radio" class="btn-check" name="tone-options" id="tone-pro" value="professional"
                               checked>
                        <label class="btn btn-outline-success rounded-pill px-3" for="tone-pro">💻 전문적인 IT</label>

                        <input type="radio" class="btn-check" name="tone-options" id="tone-friendly" value="friendly">
                        <label class="btn btn-outline-success rounded-pill px-3" for="tone-friendly">😊 친근한 리뷰</label>

                        <input type="radio" class="btn-check" name="tone-options" id="tone-emo" value="emotional">
                        <label class="btn btn-outline-success rounded-pill px-3" for="tone-emo">🌙 감성 에세이</label>

                    </div>
                </div>
            </div>

            <div class="modal-footer bg-light border-top-0 pb-4 px-4 rounded-bottom-4 d-flex justify-content-between">
                <button type="button" id="btn-ai-convert" class="btn btn-dark rounded-pill px-4">변환하기</button>
                <button type="button" id="btn-ai-apply" class="btn btn-primary rounded-pill px-4 shadow-sm" disabled>
                    에디터에 삽입
                </button>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

<script>
    // 에디터 객체 전역 변수
    let editor;

    // 🚨 여기서 시작한 괄호가 맨 마지막에 잘 닫혀야 합니다!
    document.addEventListener("DOMContentLoaded", async function () {
        const token = localStorage.getItem('access_token');
        if (!token) {
            alert("로그인이 필요한 서비스입니다.");
            window.location.href = "/api/v1/user/login-page/";
            return;
        }

        // 에디터 렌더링 (본문 적는 곳!)
        editor = new toastui.Editor({
            el: document.querySelector('#editor'),
            height: '700px', // 넓어진 화면에 맞춘 시원한 높이
            initialEditType: 'markdown',
            previewStyle: 'vertical',
            placeholder: '자유롭게 이야기를 풀어보세요...'
        });

        // 맞춤법 검사 및 우클릭 허용 로직
        setTimeout(() => {
            const editorInputArea = document.querySelector('.ProseMirror');
            if (editorInputArea) {
                editorInputArea.setAttribute('spellcheck', 'true');
                editorInputArea.setAttribute('lang', 'ko');
                editorInputArea.addEventListener('contextmenu', function (e) {
                    e.stopPropagation();
                });
            }
        }, 100);

        // 시리즈 목록 불러오기
        try {
            const seriesRes = await fetch('/api/v1/series/my/', {
                headers: {'Authorization': 'Bearer ' + token}
            });
            if (seriesRes.ok) {
                const seriesData = await seriesRes.json();
                const seriesList = seriesData.results || seriesData;
                const seriesSelect = document.getElementById('series');

                seriesList.forEach(series => {
                    const option = document.createElement('option');
                    option.value = series.id;
                    option.textContent = series.name;
                    seriesSelect.appendChild(option);
                });
            }
        } catch (error) {
            console.error('시리즈 목록 로드 실패:', error);
        }

        // ✨ S3에 업로드하고 발급받은 최종 이미지 주소를 저장할 변수입니다.
        let finalImageUrl = "";

        // 이미지 파일 업로드 로직
        const fileInput = document.getElementById('thumbnail-file');
        const previewImg = document.getElementById('preview-img');
        const previewText = document.getElementById('preview-text');

        // 파일 선택 창에서 파일이 변경(선택)되었을 때 실행되는 이벤트 리스너입니다.
        fileInput.addEventListener('change', async function () {
            // 사용자가 선택한 첫 번째 파일을 가져옵니다.
            const file = this.files[0];
            // 파일이 선택되지 않았다면(취소 누름) 함수를 바로 종료합니다.
            if (!file) return;

            // 업로드가 진행 중임을 알리는 로딩 스피너를 보여줍니다.
            previewText.innerHTML = '<div class="spinner-border spinner-border-sm text-success"></div><br>S3로 업로드 중...';
            previewText.style.display = 'block';
            // 기존에 보이던 미리보기 이미지는 숨깁니다.
            previewImg.classList.add('d-none');

            try {
                // 1. URL 발급
                // 내 백엔드 서버에 프론트엔드가 선택한 파일의 '이름'을 보내며 S3 임시 업로드 권한(URL)을 요청합니다.
                // encodeURIComponent를 사용해 파일명에 포함된 특수문자나 한글이 깨지지 않도록 보호합니다.
                const urlResponse = await fetch(`/api/v1/post/image/presigned-url/?filename=${encodeURIComponent(file.name)}`, {
                    headers: {'Authorization': 'Bearer ' + token}
                });

                // 백엔드에서 온 응답 데이터를 JSON으로 파싱합니다.
                const urlData = await urlResponse.json();

                // URL 발급에 실패(400번대, 500번대 에러)했다면 예외를 발생시킵니다.
                if (!urlResponse.ok) throw new Error("URL 발급 실패: " + JSON.stringify(urlData));

                // 2. S3 직접 업로드
                // 백엔드가 S3로부터 받아와서 프론트엔드에 넘겨준 '임시 업로드용 S3 주소(presigned_url)'로
                // 프론트엔드가 '직접' 파일을 PUT 방식으로 쏘아 올립니다. (서버 부하 감소)
                const s3Response = await fetch(urlData.presigned_url, {
                    method: 'PUT',
                    // S3가 이 파일이 이미지임을 알 수 있도록 헤더에 파일의 실제 타입(예: image/png)을 명시합니다.
                    headers: {'Content-Type': file.type},
                    // 실제 파일 데이터를 본문(body)에 담아 보냅니다.
                    body: file
                });

                // S3 업로드가 성공적으로 완료되었다면 (상태 코드 200 OK)
                if (s3Response.ok) {
                    // 백엔드가 미리 만들어준 '최종 접속 가능한 이미지 S3 주소(image_url)'를 전역 변수에 저장해둡니다.
                    // 나중에 '발행하기' 버튼을 누를 때 백엔드 DB에 이 주소를 저장하기 위함입니다.
                    finalImageUrl = urlData.image_url;

                    // 미리보기 img 태그의 주소를 방금 업로드한 S3 주소로 변경합니다.
                    previewImg.src = finalImageUrl;
                    // 미리보기 이미지가 화면에 보이도록 숨김 클래스(d-none)를 제거합니다.
                    previewImg.classList.remove('d-none');
                    // 글자 안내 문구는 이제 필요 없으므로 숨깁니다.
                    previewText.style.display = 'none';
                } else {
                    // S3에서 업로드를 거부했다면(CORS, 권한 문제 등) 예외를 발생시킵니다.
                    throw new Error("S3 직접 업로드 실패: " + s3Response.status);
                }

            } catch (error) {
                // 백엔드 URL 발급 실패 또는 S3 업로드 실패 시 이 곳으로 빠집니다.
                console.error("업로드 에러:", error);
                // 사용자에게 업로드 실패 사실을 알립니다.
                previewText.innerHTML = '<span class="text-danger">업로드에 실패했습니다. CORS 설정이나 권한을 확인하세요.</span>';
                // 실패했으므로 파일 입력창을 초기화합니다.
                fileInput.value = "";
                // 실패 시 전역 변수도 초기화하여 찌꺼기 데이터가 저장되지 않게 합니다.
                finalImageUrl = "";
            }
        });

        // 글 발행 / 임시저장 통신 함수
        async function savePost(isTemp = false) {
            const title = document.getElementById('title').value;
            const content = editor.getMarkdown();
            const tagsInput = document.getElementById('tags').value;
            const visibility = document.getElementById('visibility').value;
            const seriesValue = document.getElementById('series').value;

            if (!title || !content) {
                alert("제목과 내용을 입력해주세요.");
                return;
            }

            const tags = tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag !== "");

            const payload = {
                title: title,
                content: content,
                tags: tags,
                is_temp: isTemp,
                visibility: visibility,
                series: seriesValue ? parseInt(seriesValue) : null,
                thumbnail: finalImageUrl !== "" ? finalImageUrl : null
            };

            try {
                const response = await fetch('/api/v1/post/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    alert(isTemp ? "임시 저장되었습니다." : "게시글이 성공적으로 발행되었습니다!");
                    window.location.href = isTemp ? "/api/v1/post/my/temp/page/" : "/";
                } else {
                    alert("처리 실패: " + (data.detail || JSON.stringify(data)));
                }
            } catch (error) {
                console.error('Error:', error);
                alert("서버 통신 중 오류가 발생했습니다.");
            }
        }

        document.getElementById('postForm').addEventListener('submit', function (e) {
            e.preventDefault();
            savePost(false);
        });

        document.getElementById('tempSaveBtn').addEventListener('click', function () {
            savePost(true);
        });

    });

    // 1. [변환하기] 버튼을 눌렀을 때 실행되는 이벤트입니다.
    document.getElementById('btn-ai-convert').addEventListener('click', async () => {
        const text = document.getElementById('ai-source-text').value.trim();
        const tone = document.querySelector('input[name="tone-options"]:checked').value;

        if (!text) {
            alert('변환할 텍스트를 입력해주세요.');
            return;
        }

        const resultTextArea = document.getElementById('ai-result-text');
        resultTextArea.value = '';

        // 1️⃣ 버튼을 누르자마자 로딩 스피너를 켭니다. (AI가 생각하는 6~7초 동안 유지됨)
        document.getElementById('ai-loading').classList.remove('d-none');

        const convertBtn = document.getElementById('btn-ai-convert');
        convertBtn.disabled = true;
        convertBtn.innerText = '변환 중...';

        try {
            const response = await fetch('/api/ai/tone-convert/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('access_token')
                },
                body: JSON.stringify({text: text, tone: tone})
            });

            if (!response.ok) {
                const errorData = await response.json();
                alert('변환 실패: ' + (errorData.error_detail || errorData.error || '알 수 없는 오류'));
                return;
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');

            let isFirstChunk = true; // 첫 번째 데이터 조각인지 확인하는 변수

            while (true) {
                const {done, value} = await reader.read();

                if (done) break;

                const chunkText = decoder.decode(value, {stream: true});

                // 2️⃣ 6~7초 뒤, 드디어 AI가 첫 글자(조각)를 뱉어내면 그때 로딩 스피너를 숨깁니다!
                if (isFirstChunk && chunkText) {
                    document.getElementById('ai-loading').classList.add('d-none');
                    isFirstChunk = false;
                }

                // 투명 공백 검사 없이 순수하게 글자를 화면에 이어 붙입니다.
                resultTextArea.value += chunkText;
                resultTextArea.scrollTop = resultTextArea.scrollHeight;
            }

            document.getElementById('btn-ai-apply').disabled = false;

        } catch (error) {
            console.error('AI Convert Error:', error);
            alert('서버 통신 중 오류가 발생했습니다.');
        } finally {
            // 종료 시 로딩 스피너 확실히 숨기기 및 버튼 원상복구
            document.getElementById('ai-loading').classList.add('d-none');
            convertBtn.disabled = false;
            convertBtn.innerText = '변환하기';
        }
    });

    // 2. [에디터에 삽입] 버튼을 눌렀을 때 실행되는 이벤트입니다.
    document.getElementById('btn-ai-apply').addEventListener('click', () => {
        // 변환 결과창에 있는 텍스트를 가져옵니다.
        const resultText = document.getElementById('ai-result-text').value;

        if (resultText && editor) {
            // Toast UI Editor의 내장 함수를 사용하여, 현재 커서가 있는 위치에 변환된 글을 쏙 집어넣습니다.
            // 줄바꿈(\n\n)을 추가하여 기존 글과 겹치지 않게 여백을 줍니다.
            editor.insertText('\n\n' + resultText + '\n\n');

            // 성공적으로 들어갔으니 열려있는 모달 팝업을 닫습니다.
            const modalEl = document.getElementById('aiToneModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();
        }
    });

</script>
{% endblock %}
