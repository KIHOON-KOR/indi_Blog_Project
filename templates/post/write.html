{% extends 'base.html' %}
{% block title %}글쓰기 - My Blog{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"/>
<style>
    /* 썸네일 미리보기 박스의 점선 테두리 스타일입니다. */
    .border-dashed {
        border-style: dashed !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center w-100">
    <div class="col-12 col-xl-15">
        <div class="text-center text-white mb-4">
            <h2 class="fw-bold">New Story</h2>
            <p class="opacity-75">당신의 지식과 경험을 공유해주세요.</p>
        </div>

        <div class="card auth-card shadow-lg border-0">
            <div class="card-body p-4 p-md-5">
                <form id="postForm">
                    <div class="mb-4">
                        <label for="title" class="form-label fw-bold text-secondary">제목</label>
                        <input type="text" class="form-control form-control-lg border-2" id="title"
                               placeholder="매력적인 제목을 입력하세요" required>
                    </div>

                    <div class="mb-5">
                        <label class="form-label fw-bold text-secondary">본문 내용</label>
                        <div id="editor"></div>
                    </div>

                    <div class="row g-4 mb-4">

                        <div class="col-lg-6">
                            <div class="bg-light rounded-4 p-4 h-100 border border-light-subtle">
                                <h5 class="fw-bold text-dark mb-4"><i class="bi bi-gear-fill text-success me-2"></i>기본
                                    설정</h5>

                                <div class="row mb-3">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <label for="visibility" class="form-label fw-bold text-secondary small">공개
                                            설정</label>
                                        <select class="form-select border-0 shadow-sm" id="visibility">
                                            <option value="PUBLIC" selected>전체 공개</option>
                                            <option value="PRIVATE">비공개 (나만 보기)</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-6">
                                        <label for="series" class="form-label fw-bold text-secondary small">시리즈
                                            (선택)</label>
                                        <select class="form-select border-0 shadow-sm" id="series">
                                            <option value="">선택 안 함</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mt-4">
                                    <label for="tags" class="form-label fw-bold text-secondary small">태그</label>
                                    <input type="text" class="form-control border-0 shadow-sm" id="tags"
                                           placeholder="예: Python, Django, 일상 (쉼표로 구분)">
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="bg-light rounded-4 p-4 h-100 border border-light-subtle d-flex flex-column">
                                <h5 class="fw-bold text-dark mb-3"><i class="bi bi-image text-success me-2"></i>대표 썸네일
                                </h5>

                                <label for="thumbnail" class="form-label text-secondary" style="font-size: 0.8rem;">
                                    이미지 주소(URL)를 입력해주세요 (파일 업로드 준비 중)
                                </label>
                                <input type="url" class="form-control border-0 shadow-sm mb-3" id="thumbnail"
                                       placeholder="https://example.com/image.jpg">

                                <div id="thumbnail-preview"
                                     class="rounded-3 border border-2 border-dashed border-secondary border-opacity-25 d-flex align-items-center justify-content-center overflow-hidden flex-grow-1 bg-white relative"
                                     style="min-height: 160px;">
                                    <span class="text-muted small"
                                          id="preview-text">이미지 URL을 입력하면<br>여기에 미리보기가 표시됩니다.</span>
                                    <img id="preview-img" src="" class="w-100 h-100 object-fit-cover d-none"
                                         alt="썸네일 미리보기">
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="/" class="btn btn-light rounded-pill px-4">취소</a>
                        <button type="button" id="tempSaveBtn" class="btn btn-outline-secondary rounded-pill px-4">
                            임시저장
                        </button>
                        <button type="submit" class="btn btn-primary rounded-pill px-5 shadow">발행하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

<script>
    // 에디터 객체 전역 변수
    let editor;

    document.addEventListener("DOMContentLoaded", async function () {
        const token = localStorage.getItem('access_token');
        if (!token) {
            alert("로그인이 필요한 서비스입니다.");
            window.location.href = "/api/v1/user/login-page/";
            return;
        }

        // 에디터 렌더링
        editor = new toastui.Editor({
            el: document.querySelector('#editor'),
            height: '700px', // 넓어진 화면에 맞춘 시원한 높이
            initialEditType: 'markdown',
            previewStyle: 'vertical',
            placeholder: '자유롭게 이야기를 풀어보세요...'
        });

        // 맞춤법 검사 및 우클릭 허용 로직
        setTimeout(() => {
            const editorInputArea = document.querySelector('.ProseMirror');
            if (editorInputArea) {
                editorInputArea.setAttribute('spellcheck', 'true');
                editorInputArea.setAttribute('lang', 'ko');
                editorInputArea.addEventListener('contextmenu', function (e) {
                    e.stopPropagation();
                });
            }
        }, 100);

        // 시리즈 목록 불러오기
        try {
            const seriesRes = await fetch('/api/v1/series/my/', {
                headers: {'Authorization': 'Bearer ' + token}
            });
            if (seriesRes.ok) {
                const seriesData = await seriesRes.json();
                const seriesList = seriesData.results || seriesData;
                const seriesSelect = document.getElementById('series');

                seriesList.forEach(series => {
                    const option = document.createElement('option');
                    option.value = series.id;
                    option.textContent = series.name;
                    seriesSelect.appendChild(option);
                });
            }
        } catch (error) {
            console.error('시리즈 목록 로드 실패:', error);
        }

        // ✨ 썸네일 URL 입력 시 실시간 미리보기 기능
        // 썸네일 입력칸 요소를 가져옵니다.
        const thumbnailInput = document.getElementById('thumbnail');
        // 미리보기 이미지를 보여줄 img 요소를 가져옵니다.
        const previewImg = document.getElementById('preview-img');
        // 미리보기 안내 텍스트 요소를 가져옵니다.
        const previewText = document.getElementById('preview-text');

        // 입력칸에 글자가 입력될 때마다('input' 이벤트) 실행되는 함수입니다.
        thumbnailInput.addEventListener('input', function () {
            // 입력된 값을 가져와 좌우 공백을 제거합니다.
            const url = this.value.trim();

            // 만약 URL이 입력되었다면
            if (url) {
                // img 태그의 주소(src)를 입력한 URL로 바꿉니다.
                previewImg.src = url;
                // img 태그의 숨김 처리(d-none)를 해제하여 화면에 보여줍니다.
                previewImg.classList.remove('d-none');
                // 안내 텍스트는 숨깁니다.
                previewText.style.display = 'none';
            } else {
                // URL이 다 지워졌다면 img 태그를 다시 숨깁니다.
                previewImg.classList.add('d-none');
                // img 태그의 주소도 비워줍니다.
                previewImg.src = '';
                // 안내 텍스트를 다시 보여줍니다.
                previewText.style.display = 'block';
            }
        });

        // 사용자가 잘못된 이미지 링크를 넣어서 엑스박스(에러)가 뜰 경우의 예외처리입니다.
        previewImg.addEventListener('error', function () {
            // 이미지를 숨기고
            this.classList.add('d-none');
            // 텍스트를 보이게 한 뒤, 안내 문구를 에러 메시지로 바꿉니다.
            previewText.style.display = 'block';
            previewText.innerHTML = '<span class="text-danger">이미지를 불러올 수 없습니다.<br>올바른 URL인지 확인해주세요.</span>';
        });
    });

    // 글 발행 / 임시저장 통신 함수
    async function savePost(isTemp = false) {
        const title = document.getElementById('title').value;
        const content = editor.getMarkdown();
        const tagsInput = document.getElementById('tags').value;
        const visibility = document.getElementById('visibility').value;
        const seriesValue = document.getElementById('series').value;
        // ✨ 입력된 썸네일 URL 값을 가져옵니다.
        const thumbnailUrl = document.getElementById('thumbnail').value.trim();

        if (!title || !content) {
            alert("제목과 내용을 입력해주세요.");
            return;
        }

        const tags = tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag !== "");

        // 백엔드로 보낼 JSON 데이터 구조입니다.
        const payload = {
            title: title,
            content: content,
            tags: tags,
            is_temp: isTemp,
            visibility: visibility,
            series: seriesValue ? parseInt(seriesValue) : null,
            // ✨ 썸네일 데이터도 함께 보냅니다. (입력 안 했으면 빈 문자열 또는 null)
            thumbnail: thumbnailUrl || null
        };

        try {
            const token = localStorage.getItem('access_token');
            const response = await fetch('/api/v1/post/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                alert(isTemp ? "임시 저장되었습니다." : "게시글이 성공적으로 발행되었습니다!");
                window.location.href = isTemp ? "/api/v1/post/my/temp/page/" : "/";
            } else {
                alert("처리 실패: " + (data.detail || JSON.stringify(data)));
            }
        } catch (error) {
            console.error('Error:', error);
            alert("서버 통신 중 오류가 발생했습니다.");
        }
    }

    document.getElementById('postForm').addEventListener('submit', function (e) {
        e.preventDefault();
        savePost(false);
    });

    document.getElementById('tempSaveBtn').addEventListener('click', function () {
        savePost(true);
    });
</script>
{% endblock %}
