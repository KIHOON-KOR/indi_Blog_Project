{% extends 'base.html' %} {% block title %}내 블로그 - My Blog{% endblock %}

{% block content %}
<div class="row w-100 justify-content-center"> <div class="col-lg-10"> <div class="text-white mb-4 d-flex justify-content-between align-items-end"> <div>
                <h2 class="fw-bold">내 블로그</h2> <p class="opacity-75 mb-0">내가 세상에 공유한 이야기들입니다.</p> </div>
            <a href="/api/v1/post/write/" class="btn btn-primary rounded-pill px-4">새 글 작성</a> </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden"> <div class="card-body p-0"> <div id="my-post-list" class="list-group list-group-flush"> <div class="text-center py-5"> <div class="spinner-border text-success" role="status"></div> <p class="text-muted mt-2">내 글을 불러오는 중입니다...</p> </div>
                </div>
            </div>
        </div>

        <div id="pagination-container" class="d-flex justify-content-center mt-4"></div> </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 현재 보고 있는 페이지 상태를 저장하는 변수입니다.
    let currentPage = 1;

    // 문서 로드가 완료되면 첫 페이지 로드를 시작합니다.
    document.addEventListener("DOMContentLoaded", () => fetchMyPosts(currentPage));

    /**
     * 내 포스트 목록을 API로 호출하고 화면에 그리는 함수입니다.
     */
    async function fetchMyPosts(page) {
        // 데이터를 넣을 컨테이너 DOM을 찾습니다.
        const container = document.getElementById('my-post-list');
        // 로컬 스토리지에서 인증용 JWT 토큰을 가져옵니다.
        const token = localStorage.getItem('access_token');

        // 토큰이 없으면 비정상적인 접근이므로 로그인 페이지로 강제 이동시킵니다.
        if (!token) {
            window.location.href = "/api/v1/user/login-page/";
            return;
        }

        // 로딩 중임을 알리는 UI를 출력합니다.
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-success"></div></div>';

        try {
            // ✨ 쿼리 파라미터로 page를 넘기고, 헤더에 Authorization 토큰을 담아 GET 요청합니다.
            const response = await fetch(`/api/v1/post/my/?page=${page}`, {
                headers: {'Authorization': 'Bearer ' + token}
            });

            // JSON 데이터를 파싱합니다.
            const data = await response.json();

            // 요청 성공 시 로직
            if (response.ok) {
                // 데이터에서 배열 형태의 게시글 목록을 뽑아냅니다.
                const posts = data.results || data;

                // 작성한 글이 없을 때의 예외 처리입니다.
                if (posts.length === 0) {
                    container.innerHTML = '<div class="text-center py-5 text-muted">아직 발행한 게시글이 없습니다.</div>';
                    document.getElementById('pagination-container').innerHTML = ''; // 페이지네이션 삭제
                    return;
                }

                // 로딩 메시지를 초기화합니다.
                container.innerHTML = '';

                // 배열을 순회하며 카드 HTML을 조립합니다.
                posts.forEach(post => {
                    const date = new Date(post.created_at).toLocaleDateString();

                    // 공개 상태(PUBLIC)인지 판별하여 뱃지 디자인과 문구를 세팅합니다.
                    const isPublic = post.visibility === 'PUBLIC';
                    const badgeText = isPublic ? '공개됨' : '비공개';
                    const badgeClass = isPublic ? 'bg-success' : 'bg-secondary';

                    const postHtml = `
                        <div class="list-group-item list-group-item-action border-0 px-4 py-3 border-bottom">
                            <div class="d-flex w-100 justify-content-between align-items-center">
                                <div class="text-truncate" style="max-width: 80%;">
                                    <a href="/api/v1/post/${post.id}/page/" class="text-decoration-none text-dark">
                                        <h5 class="mb-1 fw-bold">${post.title}</h5>
                                    </a>
                                    <small class="text-muted d-flex align-items-center gap-2">
                                        <span>발행일: ${date}</span>
                                        <span class="text-danger"><i class="bi bi-heart-fill"></i> ${post.likes_count || 0}</span>
                                    </small>
                                </div>
                                <div class="d-flex gap-2">
                                    <span class="badge ${badgeClass} bg-opacity-10 text-${isPublic ? 'success' : 'secondary'} rounded-pill px-3">
                                        ${isPublic ? '' : '🔒 '}${badgeText}
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                    // 컨테이너 끝에 렌더링합니다.
                    container.insertAdjacentHTML('beforeend', postHtml);
                });

                // 총 데이터 개수가 존재한다면 페이지네이션을 렌더링합니다.
                if (data.count !== undefined) {
                    renderPagination(data.count, page, document.getElementById('pagination-container'), 'fetchMyPosts');
                }
            } else {
                container.innerHTML = '<p class="text-danger text-center py-5">목록을 불러오지 못했습니다.</p>';
            }
        } catch (error) {
            console.error('Error fetching my posts:', error);
            container.innerHTML = '<p class="text-danger text-center py-5">서버 통신 중 오류가 발생했습니다.</p>';
        }
    }

    /**
     * 페이지네이션
     */
    function renderPagination(totalCount, currentPage, container, fetchFunctionName) {
        const pageSize = 10; // 페이지당 출력 개수
        const totalPages = Math.ceil(totalCount / pageSize); // 총 페이지 수 계산

        if (totalPages <= 1) { // 1페이지 이하면 버튼 숨김
            container.innerHTML = '';
            return;
        }

        let html = '<nav><ul class="pagination pagination-sm justify-content-center">';

        // 이전 버튼 (1페이지면 비활성화)
        const prevDisabled = currentPage === 1 ? 'disabled' : '';
        html += `<li class="page-item ${prevDisabled}"><a class="page-link text-success" href="#" onclick="event.preventDefault(); ${fetchFunctionName}(${currentPage - 1})">이전</a></li>`;

        // 페이지 번호 루프
        for (let i = 1; i <= totalPages; i++) {
            const activeClass = currentPage === i ? 'active bg-success border-success text-white' : 'text-success';
            html += `<li class="page-item"><a class="page-link ${activeClass}" href="#" onclick="event.preventDefault(); ${fetchFunctionName}(${i})">${i}</a></li>`;
        }

        // 다음 버튼 (마지막 페이지면 비활성화)
        const nextDisabled = currentPage === totalPages ? 'disabled' : '';
        html += `<li class="page-item ${nextDisabled}"><a class="page-link text-success" href="#" onclick="event.preventDefault(); ${fetchFunctionName}(${currentPage + 1})">다음</a></li>`;

        html += '</ul></nav>';
        container.innerHTML = html; // DOM에 적용
    }
</script>
{% endblock %}
