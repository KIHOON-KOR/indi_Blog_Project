{% extends 'base.html' %} {% block title %}내 블로그 - My Blog{% endblock %}

{% block content %}
<div class="row w-100 justify-content-center"> <div class="col-lg-10"> <div class="text-white mb-4 d-flex justify-content-between align-items-end"> <div>
                <h2 class="fw-bold">내 블로그</h2> <p class="opacity-75 mb-0">내가 세상에 공유한 이야기들입니다.</p> </div>
            <a href="/api/v1/post/write/" class="btn btn-primary rounded-pill px-4">새 글 작성</a> </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden"> <div class="card-body p-0"> <div id="my-post-list" class="list-group list-group-flush"> <div class="text-center py-5"> <div class="spinner-border text-success" role="status"></div> <p class="text-muted mt-2">내 글을 불러오는 중입니다...</p> </div>
                </div>
            </div>
        </div>

        <div id="pagination-container" class="d-flex justify-content-center mt-4"></div> </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", fetchMyPosts); // 페이지가 열리면 내 포스트를 가져옵니다.

    async function fetchMyPosts() { // 내 포스트 목록을 API로 호출하는 함수입니다.
        const container = document.getElementById('my-post-list'); // 데이터를 넣을 DOM 요소를 참조합니다.
        const token = localStorage.getItem('access_token'); // 로컬 스토리지에서 인증 토큰을 가져옵니다.

        if (!token) { // 로그인이 안 되어 있다면 리다이렉트합니다.
            window.location.href = "/api/v1/user/login-page/";
            return;
        }

        try {
            const response = await fetch('/api/v1/post/my/', { // 내 발행글 목록 API를 호출합니다.
                headers: { 'Authorization': 'Bearer ' + token } // 토큰을 헤더에 포함합니다.
            });

            const data = await response.json(); // 응답 데이터를 JSON으로 파싱합니다.

            if (response.ok) { // 요청이 성공했을 때의 로직입니다.
                const posts = data.results || data; // 페이지네이션 유무에 따라 데이터를 가져옵니다.

                if (posts.length === 0) { // 작성한 글이 없는 경우입니다.
                    container.innerHTML = '<div class="text-center py-5 text-muted">아직 발행한 게시글이 없습니다.</div>';
                    return;
                }

                container.innerHTML = ''; // 로딩 스피너를 제거합니다.

                posts.forEach(post => { // 각 포스트를 돌면서 HTML을 생성합니다.
                    const date = new Date(post.created_at).toLocaleDateString(); // 날짜 형식을 가독성 있게 변환합니다.

                    // [수정 포인트] visibility 상태에 따라 뱃지 디자인 결정 (변경 기능은 나중 수정페이지에서 처리)
                    const isPublic = post.visibility === 'PUBLIC'; // 전체 공개 상태인지 판별합니다.
                    const badgeText = isPublic ? '공개됨' : '비공개'; // 뱃지에 들어갈 텍스트입니다.
                    const badgeClass = isPublic ? 'bg-success' : 'bg-secondary'; // 뱃지 색상을 결정합니다.

                    const postHtml = `
                        <div class="list-group-item list-group-item-action border-0 px-4 py-3 border-bottom">
                            <div class="d-flex w-100 justify-content-between align-items-center">
                                <div class="text-truncate" style="max-width: 80%;">
                                    <a href="/api/v1/post/${post.id}/page/" class="text-decoration-none text-dark">
                                        <h5 class="mb-1 fw-bold">${post.title}</h5> </a>
                                    <small class="text-muted">발행일: ${date}</small> </div>
                                <div class="d-flex gap-2">
                                    <span class="badge ${badgeClass} bg-opacity-10 text-${isPublic ? 'success' : 'secondary'} rounded-pill px-3">
                                        ${isPublic ? '' : '🔒 '}${badgeText} </span>
                                </div>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', postHtml); // 완성된 HTML을 목록에 추가합니다.
                });
            } else { // 요청 실패 시 처리입니다.
                container.innerHTML = '<p class="text-danger text-center py-5">목록을 불러오지 못했습니다.</p>';
            }
        } catch (error) { // 통신 에러 처리입니다.
            console.error('Error fetching my posts:', error);
            container.innerHTML = '<p class="text-danger text-center py-5">서버 통신 중 오류가 발생했습니다.</p>';
        }
    }
</script>
{% endblock %}
