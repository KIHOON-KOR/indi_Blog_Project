{% extends 'base.html' %}
{% block title %}내 블로그 - My Blog{% endblock %}

{% block content %}
<div class="row w-100 justify-content-center">
    <div class="col-lg-10">
        <div class="text-white mb-4 d-flex justify-content-between align-items-end">
            <div class="w-100 me-4">
                <h2 class="fw-bold">내 블로그</h2>
                <p class="opacity-75 mb-0">내가 세상에 공유한 이야기들입니다.</p>

                <div class="row mt-3 mb-2">
                    <div class="col-md-10 col-lg-8">
                        <form id="search-form" class="d-flex bg-white rounded-pill p-1 shadow-sm"
                              onsubmit="handleSearch(event)">

                            <input type="text" id="search-input"
                                   class="form-control border-0 rounded-pill bg-transparent ps-4 flex-grow-1"
                                   placeholder="내 글 검색 (제목, 내용, 태그)"
                                   aria-label="Search" style="box-shadow: none; min-width: 0;">

                            <button class="btn btn-primary rounded-pill px-4 fw-bold flex-shrink-0 text-nowrap"
                                    type="submit">
                                <i class="bi bi-search me-1"></i>검색
                            </button>

                        </form>
                    </div>
                </div>
                <div id="current-tag-info" class="mt-3" style="display: none;">
                    <span class="badge bg-primary bg-opacity-75 fs-6 rounded-pill px-3 py-2 shadow-sm border border-light">
                        <i class="bi bi-tag-fill me-1"></i> <span id="tag-name-display"></span>
                        <a href="/api/v1/post/my/page/" class="text-white ms-2 text-decoration-none"><i
                                class="bi bi-x-circle-fill"></i></a>
                    </span>
                </div>
            </div>
            <a href="/api/v1/post/write/" class="btn btn-primary rounded-pill px-4 flex-shrink-0">새 글 작성</a>
        </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div id="my-post-list" class="list-group list-group-flush">
                    <div class="text-center py-5">
                        <div class="spinner-border text-success" role="status"></div>
                        <p class="text-muted mt-2">내 글을 불러오는 중입니다...</p></div>
                </div>
            </div>
        </div>

        <div id="pagination-container" class="d-flex justify-content-center mt-4"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 현재 보고 있는 페이지 번호를 저장하는 변수입니다. 초기값은 1입니다.
    let currentPage = 1;

    // 브라우저의 현재 주소창 URL에서 쿼리 스트링(? 이후의 문자열)을 가져옵니다.
    const urlParams = new URLSearchParams(window.location.search);

    // 쿼리 스트링 중 'tag'라는 이름의 파라미터 값을 가져와 currentTag 변수에 저장합니다. (예: ?tag=파이썬)
    const currentTag = urlParams.get('tag');

    // ✨ 쿼리 스트링 중 'search'라는 이름의 파라미터 값을 가져와 currentSearch 변수에 저장합니다. (예: ?search=장고)
    const currentSearch = urlParams.get('search');

    // HTML 문서의 로딩이 완료되면 실행될 함수를 등록합니다.
    document.addEventListener("DOMContentLoaded", () => {
        // 만약 URL에 태그 값이 존재한다면 실행됩니다.
        if (currentTag) {
            // 태그 정보를 보여주는 HTML 요소의 숨김 처리를 해제하여 화면에 보이게 합니다.
            document.getElementById('current-tag-info').style.display = 'block';
            // 태그 이름을 표시할 요소에 가져온 태그 텍스트를 삽입합니다.
            document.getElementById('tag-name-display').innerText = currentTag;
        }

        // ✨ 만약 URL에 검색어 값이 존재한다면 실행됩니다.
        if (currentSearch) {
            // 검색창 input 요소의 값을 URL에서 가져온 검색어로 채워 넣어, 사용자가 자신이 검색한 단어를 계속 볼 수 있게 합니다.
            document.getElementById('search-input').value = currentSearch;
        }

        // 내 글 목록을 불러오는 API 호출 함수를 실행합니다. (1페이지)
        fetchMyPosts(currentPage);
    });

    // ✨ 검색 폼이 제출될 때(엔터키를 누르거나 검색 버튼 클릭 시) 실행되는 함수입니다.
    function handleSearch(event) {
        // 브라우저가 폼을 제출하면서 페이지를 새로고침하는 기본 동작을 막습니다.
        event.preventDefault();

        // 검색창 input 요소에 입력된 값을 가져오고, 양끝의 공백을 제거(trim)하여 searchKeyword 변수에 저장합니다.
        const searchKeyword = document.getElementById('search-input').value.trim();

        // 이동할 기본 URL을 '내 블로그 페이지'로 설정합니다.
        let url = '/api/v1/post/my/page/';

        // 만약 검색어가 비어있지 않고 존재한다면 실행됩니다.
        if (searchKeyword) {
            // URL 뒤에 '?search=검색어' 형태로 파라미터를 추가합니다. (특수문자 오류 방지를 위해 encodeURIComponent 사용)
            url += `?search=${encodeURIComponent(searchKeyword)}`;
        }

        // 완성된 URL로 브라우저의 페이지를 이동시킵니다.
        window.location.href = url;
    }

    // 백엔드 API 서버와 통신하여 내 게시글 데이터를 가져오는 비동기 함수입니다.
    async function fetchMyPosts(page) {
        // 게시글 목록이 그려질 부모 HTML 요소를 가져옵니다.
        const container = document.getElementById('my-post-list');
        // 브라우저 로컬 스토리지에 저장되어 있는 인증 토큰(JWT)을 가져옵니다.
        const token = localStorage.getItem('access_token');

        // 토큰이 존재하지 않는다면(로그인 상태가 아니라면) 실행됩니다.
        if (!token) {
            // 사용자를 로그인 페이지로 강제로 이동시킵니다.
            window.location.href = "/api/v1/user/login-page/";
            // 이후의 코드가 실행되지 않도록 함수를 즉시 종료합니다.
            return;
        }

        // 데이터를 불러오는 동안 화면에 로딩 스피너(빙글빙글 도는 애니메이션)를 표시합니다.
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-success"></div></div>';

        // API 통신 중 에러가 발생할 수 있으므로 try-catch 블록으로 감싸줍니다.
        try {
            // 백엔드에 요청할 기본 API 주소를 문자열로 만듭니다. (요청한 페이지 번호 포함)
            let apiUrl = `/api/v1/post/my/?page=${page}`;

            // URL에서 추출한 태그 값이 존재한다면, 백엔드 API 주소에 '&tag=태그명'을 추가합니다.
            if (currentTag) {
                apiUrl += `&tag=${encodeURIComponent(currentTag)}`;
            }

            // ✨ URL에서 추출한 검색어 값이 존재한다면, 백엔드 API 주소에 '&search=검색어'를 추가합니다.
            if (currentSearch) {
                apiUrl += `&search=${encodeURIComponent(currentSearch)}`;
            }

            // fetch API를 사용하여 백엔드 서버에 HTTP GET 요청을 보냅니다.
            const response = await fetch(apiUrl, {
                // 내 글은 나만 볼 수 있어야 하므로, 헤더에 인증 토큰을 포함시켜 보냅니다.
                headers: {'Authorization': 'Bearer ' + token}
            });

            // 백엔드 서버에서 보내준 응답 데이터를 자바스크립트 객체(JSON) 형태로 변환합니다.
            const data = await response.json();

            // HTTP 응답 상태 코드가 200번대(성공)라면 실행됩니다.
            if (response.ok) {
                // 백엔드 페이지네이션 설정에 따라 데이터가 data.results에 있을 수도 있고, data 자체에 있을 수도 있으므로 안전하게 가져옵니다.
                const posts = data.results || data;

                // 불러온 게시글 데이터의 개수가 0개(빈 배열)라면 실행됩니다.
                if (posts.length === 0) {
                    // 기본적으로 보여줄 '결과 없음' 메시지를 설정합니다.
                    let emptyMsg = '아직 발행한 게시글이 없습니다.';

                    // ✨ 검색어가 있었다면 검색 결과가 없다는 메시지로 변경합니다.
                    if (currentSearch) {
                        emptyMsg = `'${currentSearch}'에 대한 검색 결과가 없습니다.`;
                    }
                    // 태그 검색이었다면 해당 태그의 글이 없다는 메시지로 변경합니다.
                    else if (currentTag) {
                        emptyMsg = `'${currentTag}' 태그로 작성한 내 글이 없습니다.`;
                    }

                    // 작성해둔 메시지를 화면 중앙에 표시합니다.
                    container.innerHTML = `<div class="text-center py-5 text-muted">${emptyMsg}</div>`;
                    // 데이터가 없으므로 하단 페이지네이션(번호 버튼) 영역을 비워버립니다.
                    document.getElementById('pagination-container').innerHTML = '';
                    // 함수를 즉시 종료합니다.
                    return;
                }

                // 새로운 데이터를 그리기 위해 로딩 스피너가 있던 공간을 깨끗하게 비웁니다.
                container.innerHTML = '';

                // 받아온 게시글 배열(posts)을 순회하며 하나씩 HTML로 만들어줍니다.
                posts.forEach(post => {
                    // 게시글의 생성 날짜 문자열을 읽기 좋은 날짜 포맷으로 변환합니다.
                    const date = new Date(post.created_at).toLocaleDateString();
                    // 게시글의 공개 여부(PUBLIC)를 불리언(true/false) 값으로 확인합니다.
                    const isPublic = post.visibility === 'PUBLIC';
                    // 공개 여부에 따라 화면에 표시할 뱃지의 텍스트를 결정합니다.
                    const badgeText = isPublic ? '공개됨' : '비공개';
                    // 공개 여부에 따라 화면에 표시할 뱃지의 색상 클래스를 결정합니다.
                    const badgeClass = isPublic ? 'bg-success' : 'bg-secondary';


                    // 등급 이미지 HTML 생성
                    const gradeImgHtml = post.author_grade_image
                            ? `<img src="${post.author_grade_image}" alt="grade" class="me-1" style="width: 18px; height: 18px; object-fit: contain;">`
                            : '';

                    // '발행일' 앞에 작성자 정보(등급 이미지 + 닉네임)를 추가했습니다.
                    const postHtml = `
                                                <div class="list-group-item list-group-item-action border-0 px-4 py-3 border-bottom bg-transparent">
                                                    <div class="d-flex w-100 justify-content-between align-items-center">
                                                        <div class="text-truncate" style="max-width: calc(100% - 70px);">
                                                            <a href="/api/v1/post/${post.id}/page/" class="text-decoration-none text-dark">
                                                                <h5 class="mb-1 fw-bold">${post.title}</h5>
                                                            </a>
                                                            <small class="text-muted d-flex align-items-center gap-2 mt-1">
                                                                <span class="d-flex align-items-center">by ${gradeImgHtml} <span class="text-success fw-bold ms-1">${post.author_nickname || '나'}</span></span>
                                                                <span>| ${date}</span>
                                                                <span class="text-danger"><i class="bi bi-heart-fill"></i> ${post.likes_count || 0}</span>
                                                                <span class="badge ${badgeClass} bg-opacity-10 text-${isPublic ? 'success' : 'secondary'} rounded-pill px-2 ms-1" style="font-size: 0.7rem;">
                                                                    ${isPublic ? '' : '🔒 '}${badgeText}
                                                                </span>
                                                            </small>
                                                        </div>

                                                        ${post.thumbnail ? `
                            <div class="ms-3 flex-shrink-0">
                            <img src="${post.thumbnail}" alt="thumbnail" style="width: 60px; height: 60px; object-fit: cover;" class="rounded-3 shadow-sm border">
                            </div>
                            ` : ''}
                                                    </div>
                                                </div>
                                            `;
                    // 완성된 HTML 텍스트를 게시글 목록 컨테이너의 맨 마지막 요소로 이어 붙입니다.
                    container.insertAdjacentHTML('beforeend', postHtml);
                });

                // 응답 데이터에 전체 게시글 개수(count) 정보가 포함되어 있다면 실행됩니다.
                if (data.count !== undefined) {
                    // 페이지네이션 렌더링 함수를 호출하여 화면 하단에 페이지 번호 버튼들을 생성합니다.
                    renderPagination(data.count, page, document.getElementById('pagination-container'), 'fetchMyPosts');
                }
            } else {
                // 응답이 성공(ok)이 아닐 경우 사용자에게 에러 메시지를 표시합니다.
                container.innerHTML = '<p class="text-danger text-center py-5">목록을 불러오지 못했습니다.</p>';
            }
        } catch (error) {
            // 네트워크 오류 등 fetch 과정 자체에서 예외(에러)가 발생했을 때 처리합니다.
            console.error('Error fetching my posts:', error);
            container.innerHTML = '<p class="text-danger text-center py-5">서버 통신 중 오류가 발생했습니다.</p>';
        }
    }

    // 기존에 작성하셨던 renderPagination 로직 유지 (범용적 페이지네이션 생성 함수)
    function renderPagination(totalCount, currentPage, container, fetchFunctionName) {
        const pageSize = 10;
        const totalPages = Math.ceil(totalCount / pageSize);

        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }

        let html = '<nav><ul class="pagination pagination-sm justify-content-center">';
        const prevDisabled = currentPage === 1 ? 'disabled' : '';
        html += `<li class="page-item ${prevDisabled}"><a class="page-link text-success" href="#" onclick="event.preventDefault(); ${fetchFunctionName}(${currentPage - 1})">이전</a></li>`;

        for (let i = 1; i <= totalPages; i++) {
            const activeClass = currentPage === i ? 'active bg-success border-success text-white' : 'text-success';
            html += `<li class="page-item"><a class="page-link ${activeClass}" href="#" onclick="event.preventDefault(); ${fetchFunctionName}(${i})">${i}</a></li>`;
        }

        const nextDisabled = currentPage === totalPages ? 'disabled' : '';
        html += `<li class="page-item ${nextDisabled}"><a class="page-link text-success" href="#" onclick="event.preventDefault(); ${fetchFunctionName}(${currentPage + 1})">다음</a></li>`;
        html += '</ul></nav>';
        container.innerHTML = html;
    }
</script>
{% endblock %}
