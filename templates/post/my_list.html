{% extends 'base.html' %} {% block title %}내 블로그 - My Blog{% endblock %} {% block content %}
<div class="row w-100 justify-content-center">
    <div class="col-lg-10">
        <div class="text-white mb-4 d-flex justify-content-between align-items-end">
            <div>
                <h2 class="fw-bold">내 블로그</h2>
                <p class="opacity-75 mb-0">내가 세상에 공유한 이야기들입니다.</p>
            </div>
            <a href="/api/v1/post/write/" class="btn btn-primary rounded-pill px-4">새 글 작성</a>
        </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div id="my-post-list" class="list-group list-group-flush">
                    <div class="text-center py-5">
                        <div class="spinner-border text-success" role="status"></div>
                        <p class="text-muted mt-2">내 글을 불러오는 중입니다...</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="pagination-container" class="d-flex justify-content-center mt-4"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 페이지 로드가 완료되면 실행됩니다.
    document.addEventListener("DOMContentLoaded", function () {
        fetchMyPosts(); // 내 게시글을 불러오는 함수를 호출합니다.
    });

    /**
     * 내 블로그 공개글 목록을 API로부터 가져와 화면에 그리는 함수입니다.
     */
    async function fetchMyPosts() {
        const container = document.getElementById('my-post-list'); // 목록을 넣을 HTML 요소를 선택합니다.
        const token = localStorage.getItem('access_token'); // 로컬 스토리지에서 인증 토큰을 꺼냅니다.

        // 로그인 토큰이 없으면 로그인 페이지로 튕겨냅니다.
        if (!token) {
            alert("로그인이 필요합니다.");
            window.location.href = "/api/v1/user/login-page/";
            return;
        }

        try {
            // 내 블로그 전용 API(/api/v1/post/my/)에 GET 요청을 보냅니다.
            const response = await fetch('/api/v1/post/my/', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token, // 인증 헤더를 추가합니다.
                    'Content-Type': 'application/json'
                }
            });

            const data = await response.json(); // 응답 데이터를 JSON으로 파싱합니다.

            if (response.ok) {
                const posts = data.results || data; // DRF 페이지네이션 구조(results) 또는 배열을 받아옵니다.

                // 작성한 글이 하나도 없을 경우의 처리입니다.
                if (posts.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <p class="text-muted mb-3">아직 발행한 게시글이 없습니다.</p>
                            <a href="/api/v1/post/write/" class="btn btn-outline-success btn-sm rounded-pill">첫 글 쓰러 가기</a>
                        </div>`;
                    return;
                }

                container.innerHTML = ''; // 기존 로딩 UI를 비웁니다.

                // 받아온 게시글들을 순회하며 HTML을 생성합니다.
                posts.forEach(post => {
                    const date = new Date(post.created_at).toLocaleDateString(); // 날짜 형식을 가독성 있게 변환합니다.

                    const postHtml = `
                        <div class="list-group-item list-group-item-action border-0 px-4 py-3 border-bottom">
                            <div class="d-flex w-100 justify-content-between align-items-center">
                                <div class="text-truncate" style="max-width: 80%;">
                                    <a href="/post/${post.id}/" class="text-decoration-none text-dark">
                                        <h5 class="mb-1 fw-bold">${post.title}</h5>
                                    </a>
                                    <small class="text-muted">발행일: ${date}</small>
                                </div>
                                <div class="d-flex gap-2">
                                    <span class="badge bg-success bg-opacity-10 text-success rounded-pill px-3">공개됨</span>
                                </div>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', postHtml); // 생성한 HTML을 목록에 추가합니다.
                });
            } else {
                // 토큰 만료 등의 사유로 에러 발생 시 처리입니다.
                if (response.status === 401) {
                    alert("인증이 만료되었습니다. 다시 로그인해주세요.");
                    window.location.href = "/api/v1/user/login-page/";
                } else {
                    container.innerHTML = '<p class="text-danger text-center py-5">목록을 불러오지 못했습니다.</p>';
                }
            }
        } catch (error) {
            console.error('Error fetching my posts:', error);
            container.innerHTML = '<p class="text-danger text-center py-5">서버 통신 중 오류가 발생했습니다.</p>';
        }
    }
</script>
{% endblock %}
