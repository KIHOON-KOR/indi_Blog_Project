{% extends 'base.html' %}
{% block title %}게시글 상세 - My Blog{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"/>
<style>
    /* 기존 댓글 수정 폼 트랜지션 효과 유지 */
    .comment-edit-form {
        display: none; /* 기본적으로 수정 폼은 숨겨둡니다. */
        transition: all 0.3s ease; /* 나타나고 사라질 때 0.3초 동안 부드럽게 전환됩니다. */
    }

    .comment-content-box {
        transition: all 0.3s ease; /* 댓글 내용 박스도 상태 변화 시 부드럽게 전환됩니다. */
    }

    /* ✨ 새롭게 추가된 본문(Toast UI) 스타일 최적화 코드입니다. */
    /* !important를 사용하여 Toast UI의 기본 스타일을 덮어씌웁니다. */
    .toastui-editor-contents {
        font-size: 1.15rem !important; /* 기본 글자 크기를 16px에서 약 18.4px로 키워 시원하게 만듭니다. */
        line-height: 1.8 !important; /* 줄 간격을 넓혀서 글이 다닥다닥 붙어 보이지 않게 숨통을 틉니다. */
        color: #2c3e50 !important; /* 완전한 검은색(#000)보다 눈의 피로가 덜한 짙은 남/회색 계열로 설정합니다. */
    }

    .toastui-editor-contents p {
        margin-bottom: 1.5rem; /* 엔터를 쳤을 때 생기는 문단과 문단 사이의 여백을 넉넉하게 줍니다. */
    }

    .toastui-editor-contents h1,
    .toastui-editor-contents h2,
    .toastui-editor-contents h3 {
        margin-top: 2.5rem !important; /* 소제목 위쪽 여백을 넓게 줘서 이전 문단과 확실히 구분되게 합니다. */
        margin-bottom: 1rem !important; /* 소제목 아래쪽 여백은 살짝 좁혀서 다음 문단과 연결감을 줍니다. */
        color: var(--brand-dark-green) !important; /* 소제목의 색상을 우리 블로그의 메인 테마색으로 통일합니다. */
        font-weight: 700 !important; /* 소제목의 굵기를 두껍게 강조합니다. */
    }

    .toastui-editor-contents img {
        border-radius: 0.75rem; /* 본문 안에 들어가는 이미지들의 모서리도 둥글게 깎아줍니다. */
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); /* 본문 이미지에 가벼운 그림자를 줘서 입체감을 살립니다. */
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center w-100">
    <div class="col-lg-9">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white mb-4">
            <div id="post-thumbnail-wrapper" class="d-none px-4 pt-4 px-md-5 pt-md-5 text-center">

                <img id="post-thumbnail" src=""
                     class="img-fluid rounded-4 shadow-sm"
                     style="max-height: 350px; width: auto; object-fit: contain; border: 1px solid rgba(0,0,0,0.05);">
            </div>

            <div class="card-body p-4 p-md-5">
                <div class="mb-4 border-bottom pb-4">
                    <div id="post-series" class="mb-3 d-none"></div>

                    <h1 id="post-title" class="fw-bold display-6 mb-3" style="color: var(--brand-dark-green);"></h1>

                    <div class="d-flex justify-content-between align-items-center">
                        <div class="text-muted small">
                            by <span id="post-author" class="text-success fw-bold"></span> |
                            <span id="post-date"></span>
                            <span id="post-visibility-badge" class="ms-2"></span>
                        </div>
                        <div id="author-actions" class="d-none">
                            <a id="edit-btn" href="#" class="btn btn-outline-secondary btn-sm rounded-pill px-3">수정</a>
                            <button onclick="handleDelete()" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                                삭제
                            </button>
                        </div>
                    </div>

                    <div id="post-tags" class="mt-3 mb-4"></div>
                </div>

                <div id="series-widget"
                     class="card border border-2 border-success border-opacity-25 rounded-4 mb-5 d-none bg-white shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <div class="d-flex justify-content-between align-items-end mb-4 border-bottom border-success border-opacity-10 pb-3">
                            <div>
                                <h6 class="text-success opacity-75 fw-bold mb-1" style="font-size: 0.85rem;">SERIES</h6>
                                <h4 class="fw-bold mb-0">
                                    <a href="#" id="widget-series-link"
                                       class="text-decoration-none text-dark transition-all"></a>
                                </h4>
                            </div>
                        </div>
                        <ul id="series-post-list" class="list-unstyled mb-0 d-flex flex-column gap-2">
                        </ul>
                    </div>
                </div>

                <div id="viewer" class="mb-5"></div>

                <div class="d-flex justify-content-center mt-4 border-top pt-4">
                    <button id="like-btn" onclick="toggleLike()"
                            class="btn btn-outline-secondary rounded-pill px-4 py-2 d-flex align-items-center gap-2 transition-all">
                        <i id="like-icon" class="bi bi-heart fs-5"></i>
                        <span class="fw-bold">좋아요</span>
                        <span id="like-count" class="badge bg-secondary rounded-pill fs-6">0</span>
                    </button>
                </div>

                <div class="mt-5 border-top pt-5">
                    <h4 class="fw-bold mb-4" style="color: var(--brand-dark-green);">
                        댓글 <span id="comment-count" class="text-success ms-1 fs-5">0</span>
                    </h4>

                    <div class="card border-0 bg-light mb-4 rounded-4">
                        <div class="card-body p-3 p-md-4">
                            <form id="comment-form">
                                <div class="mb-3">
                                    <textarea id="comment-content" class="form-control border-0 bg-white shadow-sm"
                                              rows="3" placeholder="다양한 의견을 남겨주세요..." required></textarea>
                                </div>
                                <div class="d-flex justify-content-end">
                                    <button type="submit" id="comment-submit-btn"
                                            class="btn btn-primary rounded-pill px-4 fw-bold">댓글 작성
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div id="comment-list" class="d-flex flex-column gap-3 mb-4">
                        <div class="text-center py-4 text-muted">댓글을 불러오는 중입니다...</div>
                    </div>

                    <div id="comment-pagination-container" class="d-flex justify-content-center"></div>
                </div>
                <div class="text-center mt-5 border-top pt-4">
                    <a href="/" class="btn btn-light rounded-pill px-4 shadow-sm">← 목록으로</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

<script>
    // 1. URL에서 게시글 ID를 추출합니다.
    const pathSegments = window.location.pathname.split('/');
    const postId = pathSegments[pathSegments.indexOf('post') + 1];

    // 2. 전역 상태를 관리하는 변수들입니다.
    let currentIsLiked = false;
    let currentLikeCount = 0;
    let currentCommentPage = 1; // 현재 댓글 페이지

    // 3. 페이지가 전부 렌더링되면 게시글과 댓글을 동시에 불러옵니다.
    document.addEventListener("DOMContentLoaded", () => {
        fetchPostDetail();
        fetchComments(currentCommentPage);
    });

    // ==========================================
    // 기존 게시글 로직 복구 (원래 작성하셨던 코드)
    // ==========================================

    // 게시글 상세 정보를 서버에서 가져오는 비동기 함수입니다.
    async function fetchPostDetail() {
        try {
            const token = localStorage.getItem('access_token');
            const headers = {};
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }

            const response = await fetch(`/api/v1/post/${postId}/`, {headers: headers});
            const post = await response.json();

            if (response.ok) {
                // 게시글 제목, 작성자, 작성일 삽입
                document.getElementById('post-title').innerText = post.title;
                document.getElementById('post-author').innerText = post.author_nickname || '익명';
                document.getElementById('post-date').innerText = new Date(post.created_at).toLocaleDateString();

                // 좋아요 정보 업데이트 및 렌더링
                currentLikeCount = post.likes_count || 0;
                currentIsLiked = post.is_liked || false;
                renderLikeButtonUI();

                // Toast UI 에디터 뷰어 생성
                const viewer = toastui.Editor.factory({
                    el: document.querySelector('#viewer'),
                    viewer: true,
                    initialValue: post.content
                });

                // 썸네일 이미지 처리
                if (post.thumbnail) {
                    const thumbWrapper = document.getElementById('post-thumbnail-wrapper');
                    thumbWrapper.classList.remove('d-none');
                    document.getElementById('post-thumbnail').src = post.thumbnail;
                }

                // 태그 렌더링
                if (post.tags && post.tags.length > 0) {
                    const tagContainer = document.getElementById('post-tags');

                    tagContainer.innerHTML = post.tags.map(tag =>
                            `<a href="/api/v1/post/all/page/?tag=${encodeURIComponent(tag)}"
                                                class="badge bg-light text-success border me-1 rounded-pill text-decoration-none hover-shadow transition-all">
                                                #${tag}
                                            </a>`
                    ).join('');
                }

                // [수정 3] 시리즈가 있는 글이라면 뱃지를 띄우고 목차 위젯을 불러옵니다.
                if (post.series_name) {
                    const seriesContainer = document.getElementById('post-series');
                    seriesContainer.innerHTML = `
                        <a href="/api/v1/series/${post.series_id}/page/" class="badge bg-primary text-decoration-none px-3 py-2 fs-6 shadow-sm">
                            📚 ${post.series_name}
                        </a>`;
                    seriesContainer.classList.remove('d-none');

                    // ▼ 시리즈 목차를 로드하는 함수 호출
                    loadSeriesWidget(post.series_id, post.series_name, post.id);
                }

                // 본인 글일 경우 수정/삭제 버튼 표시
                const currentNickname = localStorage.getItem('nickname');
                if (currentNickname && currentNickname === post.author_nickname) {
                    document.getElementById('author-actions').classList.remove('d-none');
                    document.getElementById('edit-btn').href = `/api/v1/post/${postId}/edit/page/`;
                }
            } else {
                alert(post.error_detail || "게시글을 찾을 수 없습니다.");
                window.location.href = "/";
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }

    // 좋아요 UI 변경 함수
    function renderLikeButtonUI() {
        const btn = document.getElementById('like-btn');
        const icon = document.getElementById('like-icon');
        const countBadge = document.getElementById('like-count');

        countBadge.innerText = currentLikeCount;

        if (currentIsLiked) {
            icon.className = 'bi bi-heart-fill text-danger';
            btn.classList.replace('btn-outline-secondary', 'btn-outline-danger');
            countBadge.classList.replace('bg-secondary', 'bg-danger');
        } else {
            icon.className = 'bi bi-heart text-secondary';
            btn.classList.replace('btn-outline-danger', 'btn-outline-secondary');
            countBadge.classList.replace('bg-danger', 'bg-secondary');
        }
    }

    // 좋아요 토글 기능
    async function toggleLike() {
        const token = localStorage.getItem('access_token');
        if (!token) {
            if (confirm("좋아요는 로그인 후 이용 가능합니다. 로그인하시겠습니까?")) {
                window.location.href = "/api/v1/user/login-page/";
            }
            return;
        }

        currentIsLiked = !currentIsLiked;
        currentLikeCount += currentIsLiked ? 1 : -1;
        renderLikeButtonUI();

        try {
            const method = currentIsLiked ? 'POST' : 'DELETE';
            const response = await fetch(`/api/v1/post/${postId}/likes/`, {
                method: method,
                headers: {'Authorization': 'Bearer ' + token}
            });

            if (!response.ok) throw new Error("서버 좋아요 처리 실패");
        } catch (error) {
            console.error('Like error:', error);
            alert("좋아요 처리에 실패했습니다.");
            currentIsLiked = !currentIsLiked;
            currentLikeCount += currentIsLiked ? 1 : -1;
            renderLikeButtonUI();
        }
    }

    // 삭제 처리 기능
    async function handleDelete() {
        if (!confirm("정말 이 게시글을 삭제하시겠습니까?")) return;
        const token = localStorage.getItem('access_token');
        const response = await fetch(`/api/v1/post/${postId}/`, {
            method: 'DELETE',
            headers: {'Authorization': 'Bearer ' + token}
        });

        if (response.status === 204) {
            alert("삭제되었습니다.");
            window.location.href = "/";
        }
    }

    // ==========================================
    // 새롭게 추가되는 댓글 로직
    // ==========================================

    // 댓글 목록 조회 함수
    async function fetchComments(page) {
        const container = document.getElementById('comment-list');
        const paginationContainer = document.getElementById('comment-pagination-container');

        try {
            const response = await fetch(`/api/v1/comment/${postId}/?page=${page}`);
            const data = await response.json();

            if (response.ok) {
                const comments = data.results || data;
                const totalCount = data.count !== undefined ? data.count : comments.length;
                document.getElementById('comment-count').innerText = totalCount;

                if (comments.length === 0) {
                    container.innerHTML = '<div class="text-center py-5 text-muted">아직 작성된 댓글이 없습니다. 첫 번째 댓글을 남겨보세요!</div>';
                    paginationContainer.innerHTML = '';
                    return;
                }

                container.innerHTML = '';
                const currentNickname = localStorage.getItem('nickname');

                comments.forEach(comment => {
                    const date = new Date(comment.created_at).toLocaleDateString();
                    const isMyComment = currentNickname && currentNickname === comment.author_nickname;

                    const actionHtml = isMyComment
                            ? `<button onclick="toggleEditMode(${comment.id})" class="btn btn-link text-secondary p-0 text-decoration-none" style="font-size: 0.8rem;">수정</button>
                               <button onclick="deleteComment(${comment.id})" class="btn btn-link text-danger p-0 text-decoration-none ms-2" style="font-size: 0.8rem;">삭제</button>`
                            : '';

                    const commentHtml = `
                        <div class="card border-0 bg-light-subtle rounded-4" id="comment-${comment.id}">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <div>
                                        <span class="fw-bold text-success">${comment.author_nickname || '익명'}</span>
                                        <span class="text-muted ms-2" style="font-size: 0.8rem;">${date}</span>
                                    </div>
                                    <div class="d-flex gap-2">
                                        ${actionHtml}
                                    </div>
                                </div>
                                <div id="comment-content-${comment.id}" class="comment-content-box text-dark" style="white-space: pre-wrap;">${comment.content}</div>
                                <div id="comment-edit-form-${comment.id}" class="comment-edit-form mt-3">
                                    <textarea id="edit-textarea-${comment.id}" class="form-control mb-2" rows="3">${comment.content}</textarea>
                                    <div class="d-flex justify-content-end gap-2">
                                        <button onclick="toggleEditMode(${comment.id})" class="btn btn-sm btn-light rounded-pill px-3">취소</button>
                                        <button onclick="updateComment(${comment.id})" class="btn btn-sm btn-success rounded-pill px-3">저장</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', commentHtml);
                });

                if (data.total_pages !== undefined || data.count !== undefined) {
                    const totalPages = data.total_pages || Math.ceil(data.count / 10);
                    renderPagination(totalPages, page, paginationContainer, 'fetchComments');
                }
            } else {
                container.innerHTML = '<p class="text-danger text-center py-4">댓글을 불러오지 못했습니다.</p>';
            }
        } catch (error) {
            console.error('Comment Load Error:', error);
        }
    }

    // 댓글 작성 폼 제출 이벤트
    document.getElementById('comment-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = localStorage.getItem('access_token');
        if (!token) {
            alert("댓글을 작성하려면 로그인이 필요합니다.");
            window.location.href = "/api/v1/user/login-page/";
            return;
        }

        const contentInput = document.getElementById('comment-content');
        const submitBtn = document.getElementById('comment-submit-btn');
        submitBtn.disabled = true;

        try {
            const response = await fetch(`/api/v1/comment/${postId}/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({content: contentInput.value})
            });

            if (response.ok) {
                contentInput.value = '';
                fetchComments(1);
            } else {
                const data = await response.json();
                alert("댓글 작성 실패: " + (data.detail || "알 수 없는 오류"));
            }
        } catch (error) {
            console.error('Comment Submit Error:', error);
            alert("서버 통신 중 오류가 발생했습니다.");
        } finally {
            submitBtn.disabled = false;
        }
    });

    // 댓글 수정 모드 토글
    function toggleEditMode(commentId) {
        const contentBox = document.getElementById(`comment-content-${commentId}`);
        const editForm = document.getElementById(`comment-edit-form-${commentId}`);

        if (contentBox.style.display === 'none') {
            contentBox.style.display = 'block';
            editForm.style.display = 'none';
        } else {
            contentBox.style.display = 'none';
            editForm.style.display = 'block';
        }
    }

    // 댓글 수정 요청
    async function updateComment(commentId) {
        const token = localStorage.getItem('access_token');
        const updatedContent = document.getElementById(`edit-textarea-${commentId}`).value;

        try {
            const response = await fetch(`/api/v1/comment/post/${commentId}/`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({content: updatedContent})
            });

            if (response.ok) {
                alert("댓글이 수정되었습니다.");
                fetchComments(currentCommentPage);
            } else {
                const data = await response.json();
                alert("수정 실패: " + (data.detail || "권한이 없거나 오류가 발생했습니다."));
            }
        } catch (error) {
            console.error('Comment Update Error:', error);
        }
    }

    // 페이지네이션 함수
    function renderPagination(totalPages, currentPage, container, fetchFunctionName) {
        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }

        let html = '<nav><ul class="pagination pagination-sm justify-content-center">';

        const prevDisabled = currentPage === 1 ? 'disabled' : '';
        html += `<li class="page-item ${prevDisabled}"><a class="page-link text-success" href="#" onclick="event.preventDefault(); ${fetchFunctionName}(${currentPage - 1})">이전</a></li>`;

        for (let i = 1; i <= totalPages; i++) {
            const activeClass = currentPage === i ? 'active bg-success border-success text-white' : 'text-success';
            html += `<li class="page-item"><a class="page-link ${activeClass}" href="#" onclick="event.preventDefault(); ${fetchFunctionName}(${i})">${i}</a></li>`;
        }

        const nextDisabled = currentPage === totalPages ? 'disabled' : '';
        html += `<li class="page-item ${nextDisabled}"><a class="page-link text-success" href="#" onclick="event.preventDefault(); ${fetchFunctionName}(${currentPage + 1})">다음</a></li>`;

        html += '</ul></nav>';
        container.innerHTML = html;
    }

    // 댓글 삭제 요청 함수
    async function deleteComment(commentId) {
        if (!confirm("정말 이 댓글을 삭제하시겠습니까?")) return;

        const token = localStorage.getItem('access_token');

        try {
            const response = await fetch(`/api/v1/comment/post/${commentId}/`, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (response.status === 204) {
                alert("댓글이 삭제되었습니다.");
                fetchComments(currentCommentPage);
            } else {
                const data = await response.json();
                alert("삭제 실패: " + (data.detail || "권한이 없거나 오류가 발생했습니다."));
            }
        } catch (error) {
            console.error('Comment Delete Error:', error);
        }
    }

    // ==========================================
    // [수정 4] 새롭게 추가된 시리즈 목차 로드 함수
    // ==========================================
    async function loadSeriesWidget(seriesId, seriesName, currentPostId) {
        const widget = document.getElementById('series-widget');
        const link = document.getElementById('widget-series-link');
        const listContainer = document.getElementById('series-post-list');

        // 위젯 타이틀 설정
        link.textContent = seriesName;
        link.href = `/api/v1/series/${seriesId}/page/`;

        try {
            const response = await fetch(`/api/v1/post/?series=${seriesId}`);
            const data = await response.json();
            const posts = data.results || data;

            if (posts && posts.length > 0) {
                widget.classList.remove('d-none');
                listContainer.innerHTML = '';

                // 목차 배열 뒤집기 및 렌더링
                posts.reverse().forEach((p, index) => {
                    const isCurrent = p.id === currentPostId;

                    // 현재 글과 다른 글의 디자인을 다르게 적용
                    const textColor = isCurrent ? 'text-success fw-bold' : 'text-secondary';
                    const currentBadge = isCurrent ? `<span class="badge bg-success bg-opacity-10 text-success rounded-pill ms-2 px-2 border border-success border-opacity-25">현재 읽는 중</span>` : '';

                    // 동그란 숫자 뱃지 디자인
                    const numberBadge = isCurrent
                            ? `<span class="badge bg-success rounded-circle d-flex align-items-center justify-content-center me-3 shadow-sm" style="width:26px; height:26px; font-size: 0.85rem;">${index + 1}</span>`
                            : `<span class="badge bg-light text-secondary rounded-circle d-flex align-items-center justify-content-center me-3 border" style="width:26px; height:26px; font-size: 0.85rem;">${index + 1}</span>`;

                    listContainer.innerHTML += `
                            <li class="d-flex align-items-center py-2 px-2 rounded-3 transition-all ${isCurrent ? 'bg-light' : ''}">
                                ${numberBadge}
                                <a href="/api/v1/post/${p.id}/page/" class="text-decoration-none ${textColor} text-truncate flex-grow-1" style="font-size: 0.95rem;">
                                    ${p.title}
                                </a>
                                ${currentBadge}
                            </li>
                        `;
                });
            }
        } catch (error) {
            console.error("시리즈 목차 로드 실패:", error);
        }
    }
</script>
{% endblock %}
