{% extends 'base.html' %}
{% block title %}게시글 상세 - My Blog{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"/>
{% endblock %}

{% block content %}
<div class="row justify-content-center w-100">
    <div class="col-lg-9">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white mb-4">
            <div id="post-thumbnail-wrapper" class="d-none">
                <img id="post-thumbnail" src="" class="w-100" style="height: 350px; object-fit: cover;">
            </div>

            <div class="card-body p-4 p-md-5">
                <div class="mb-4 border-bottom pb-4">
                    <h1 id="post-title" class="fw-bold display-6 mb-3" style="color: var(--brand-dark-green);"></h1>

                    <div class="d-flex justify-content-between align-items-center">
                        <div class="text-muted small">
                            by <span id="post-author" class="text-success fw-bold"></span> |
                            <span id="post-date"></span>
                            <span id="post-visibility-badge" class="ms-2"></span>
                        </div>
                        <div id="author-actions" class="d-none">
                            <a id="edit-btn" href="#" class="btn btn-outline-secondary btn-sm rounded-pill px-3">수정</a>
                            <button onclick="handleDelete()" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                                삭제
                            </button>
                        </div>
                    </div>

                    <div id="post-tags" class="mt-3"></div>
                </div>

                <div id="viewer" class="mb-5"></div>

                <div class="d-flex justify-content-center mt-4 border-top pt-4">
                    <button id="like-btn" onclick="toggleLike()" class="btn btn-outline-secondary rounded-pill px-4 py-2 d-flex align-items-center gap-2 transition-all">
                        <i id="like-icon" class="bi bi-heart fs-5"></i>
                        <span class="fw-bold">좋아요</span>
                        <span id="like-count" class="badge bg-secondary rounded-pill fs-6">0</span>
                    </button>
                </div>

                <div class="text-center mt-5 border-top pt-4">
                    <a href="/" class="btn btn-light rounded-pill px-4 shadow-sm">← 목록으로</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

<script>
    // 현재 접속한 페이지의 URL에서 경로를 '/' 기준으로 쪼갭니다.
    const pathSegments = window.location.pathname.split('/');
    // 'post'라는 문자열 다음의 경로값(게시글 ID)을 추출합니다.
    const postId = pathSegments[pathSegments.indexOf('post') + 1];

    // [추가] 화면에서 상태를 관리할 전역 변수 (낙관적 업데이트용)
    let currentIsLiked = false; // 현재 내가 좋아요를 눌렀는지 여부
    let currentLikeCount = 0;   // 현재 게시글의 총 좋아요 개수

    // HTML 문서가 모두 렌더링(로드)되면 fetchPostDetail 함수를 실행합니다.
    document.addEventListener("DOMContentLoaded", fetchPostDetail);

    // 게시글 상세 정보를 서버에서 가져오는 비동기 함수입니다.
    async function fetchPostDetail() {
        try {
            // [최선(Best Practice) 적용] 로컬 스토리지에서 토큰을 꺼냅니다.
            const token = localStorage.getItem('access_token');
            // 서버에 보낼 헤더 객체를 생성합니다.
            const headers = {};
            // 토큰이 존재한다면(로그인 상태라면) 헤더에 Authorization 토큰을 담아줍니다.
            // 그래야 서버에서 '이 요청을 보낸 유저가 좋아요를 눌렀는지(is_liked)'를 알 수 있습니다.
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }

            // fetch API를 사용해 백엔드 상세 조회 엔드포인트로 GET 요청을 보냅니다. (헤더 포함)
            const response = await fetch(`/api/v1/post/${postId}/`, {headers: headers});
            // 응답 데이터를 JSON 객체로 파싱합니다.
            const post = await response.json();

            // 응답이 정상(HTTP 200번대)이라면 화면을 그립니다.
            if (response.ok) {
                // 게시글 제목, 작성자, 작성일을 각각의 HTML 요소에 텍스트로 삽입합니다.
                document.getElementById('post-title').innerText = post.title;
                document.getElementById('post-author').innerText = post.author_nickname || '익명';
                document.getElementById('post-date').innerText = new Date(post.created_at).toLocaleDateString();

                // [추가] 서버에서 받아온 좋아요 정보(개수, 내 좋아요 여부)를 전역 변수에 덮어씌웁니다.
                currentLikeCount = post.likes_count || 0; // 값이 없으면 0으로 안전하게 처리
                currentIsLiked = post.is_liked || false;  // 값이 없으면 false로 안전하게 처리

                // [추가] 받아온 좋아요 데이터를 바탕으로 화면의 하트 버튼 UI를 그려주는 함수를 호출합니다.
                renderLikeButtonUI();

                // Toast UI 뷰어 객체를 생성하여 마크다운 본문을 HTML로 렌더링합니다.
                const viewer = toastui.Editor.factory({
                    el: document.querySelector('#viewer'), // 렌더링할 대상 DOM
                    viewer: true, // 에디터(수정) 모드가 아닌 뷰어(읽기) 모드로 설정
                    initialValue: post.content // 서버에서 받은 마크다운 텍스트 삽입
                });

                // 게시글에 썸네일 이미지가 존재한다면
                if (post.thumbnail) {
                    // 썸네일을 감싸는 래퍼 요소의 숨김 처리(d-none)를 해제하고
                    const thumbWrapper = document.getElementById('post-thumbnail-wrapper');
                    thumbWrapper.classList.remove('d-none');
                    // img 태그의 src 속성에 이미지 URL을 넣어줍니다.
                    document.getElementById('post-thumbnail').src = post.thumbnail;
                }

                // 게시글에 태그 배열이 존재하고 1개 이상이라면
                if (post.tags && post.tags.length > 0) {
                    // 태그가 들어갈 컨테이너를 찾고
                    const tagContainer = document.getElementById('post-tags');
                    // map을 이용해 각 태그를 뱃지 형태의 HTML 문자열로 변환한 뒤 join으로 합쳐서 삽입합니다.
                    tagContainer.innerHTML = post.tags.map(tag =>
                            `<span class="badge bg-light text-success border me-1 rounded-pill">#${tag}</span>`
                    ).join('');
                }

                // 현재 로그인한 로컬스토리지의 닉네임과 게시글 작성자의 닉네임이 일치하는지 확인합니다.
                const currentNickname = localStorage.getItem('nickname');
                if (currentNickname && currentNickname === post.author_nickname) {
                    // 본인의 글이라면 숨겨두었던 [수정], [삭제] 액션 버튼을 보이게(d-none 제거) 합니다.
                    document.getElementById('author-actions').classList.remove('d-none');
                    // 수정 버튼의 링크(href)를 해당 게시글의 수정 페이지 URL로 맞춰줍니다.
                    document.getElementById('edit-btn').href = `/api/v1/post/${postId}/edit/page/`;
                }
            } else {
                // 응답이 정상이 아니라면 에러 메시지를 띄우고 메인 페이지로 쫓아냅니다.
                alert(post.error_detail || "게시글을 찾을 수 없습니다.");
                window.location.href = "/";
            }
        } catch (error) {
            // 통신 에러 등 예기치 못한 에러 발생 시 콘솔에 로그를 남깁니다.
            console.error('Error:', error);
        }
    }

    // [추가] 전역 변수(currentIsLiked, currentLikeCount)의 상태에 맞게 좋아요 버튼의 UI를 변경하는 함수입니다.
    function renderLikeButtonUI() {
        const btn = document.getElementById('like-btn');       // 하트 모양 버튼 본체
        const icon = document.getElementById('like-icon');     // 하트 아이콘
        const countBadge = document.getElementById('like-count'); // 숫자가 적힌 뱃지

        // 화면의 뱃지 숫자를 현재 변수의 숫자로 즉시 업데이트합니다.
        countBadge.innerText = currentLikeCount;

        if (currentIsLiked) {
            // 내가 '좋아요'를 누른 상태일 때 (빨간색 꽉 찬 하트)
            icon.className = 'bi bi-heart-fill text-danger';
            btn.classList.replace('btn-outline-secondary', 'btn-outline-danger');
            countBadge.classList.replace('bg-secondary', 'bg-danger');
        } else {
            // 내가 '좋아요'를 누르지 않은 상태일 때 (회색 빈 하트)
            icon.className = 'bi bi-heart text-secondary';
            btn.classList.replace('btn-outline-danger', 'btn-outline-secondary');
            countBadge.classList.replace('bg-danger', 'bg-secondary');
        }
    }

    // [추가] 사용자가 좋아요 버튼을 클릭했을 때 실행되는 비동기 함수입니다.
    async function toggleLike() {
        // 로컬 스토리지에서 인증 토큰을 가져옵니다.
        const token = localStorage.getItem('access_token');

        // 토큰이 없다면 비로그인 유저이므로, Confirm 창을 띄워 로그인 페이지로 유도합니다.
        if (!token) {
            if (confirm("좋아요는 로그인 후 이용 가능합니다. 로그인하시겠습니까?")) {
                window.location.href = "/api/v1/user/login-page/";
            }
            return; // 이후 로직이 실행되지 않도록 함수를 빠져나갑니다.
        }

        // [최선(Best Practice) 적용] 낙관적 업데이트(Optimistic Update)
        // 서버의 응답을 기다리지 않고, 사용자가 클릭하자마자 즉각적으로 화면의 색상과 숫자를 먼저 바꿉니다.
        currentIsLiked = !currentIsLiked; // True -> False, False -> True 로 반전
        currentLikeCount += currentIsLiked ? 1 : -1; // 좋아요면 +1, 취소면 -1
        renderLikeButtonUI(); // 변경된 변수를 바탕으로 화면을 즉시 갱신! (체감 속도 증가)

        try {
            // 좋아요(True) 상태가 되었다면 생성(POST)을, 취소(False) 상태가 되었다면 삭제(DELETE) 메서드를 선택합니다.
            const method = currentIsLiked ? 'POST' : 'DELETE';

            // 해당 게시글의 좋아요 API 엔드포인트로 HTTP 요청을 보냅니다.
            const response = await fetch(`/api/v1/post/${postId}/likes/`, {
                method: method,
                headers: {'Authorization': 'Bearer ' + token} // 인증된 회원임을 증명합니다.
            });

            // 만약 서버에서 404, 500 등 오류 응답을 내려보냈다면 에러를 발생시켜 catch 블록으로 던집니다.
            if (!response.ok) {
                throw new Error("서버 좋아요 처리 실패");
            }
            // 성공했다면 이미 화면은 바꿔놓았으니 추가 동작 없이 마무리합니다.

        } catch (error) {
            // 네트워크 오류나 서버 예외 발생 시 롤백(Rollback) 처리를 합니다.
            console.error('Like error:', error);
            alert("좋아요 처리에 실패했습니다.");

            // 미리 올려두었던 숫자와 상태를 원상태로 되돌립니다.
            currentIsLiked = !currentIsLiked; // 다시 반전시켜 원상 복구
            currentLikeCount += currentIsLiked ? 1 : -1; // 숫자도 원상 복구
            renderLikeButtonUI(); // 원상 복구된 데이터로 화면을 다시 그립니다.
        }
    }

    // 사용자가 게시글 삭제 버튼을 눌렀을 때 실행되는 함수입니다.
    async function handleDelete() {
        // 브라우저 기본 Confirm 창을 띄워 실수로 누른 것인지 한 번 더 확인합니다.
        if (!confirm("정말 이 게시글을 삭제하시겠습니까?")) return;

        // 로컬스토리지에서 토큰을 가져옵니다.
        const token = localStorage.getItem('access_token');
        // 상세 조회 엔드포인트에 DELETE HTTP 메서드로 삭제 요청을 보냅니다.
        const response = await fetch(`/api/v1/post/${postId}/`, {
            method: 'DELETE',
            headers: {'Authorization': 'Bearer ' + token}
        });

        // 백엔드에서 정상적으로 삭제(Soft Delete)되어 204 No Content가 반환되었다면
        if (response.status === 204) {
            alert("삭제되었습니다.");
            // 글이 삭제되었으므로 홈페이지('/')로 강제 이동시킵니다.
            window.location.href = "/";
        }
    }
</script>
{% endblock %}
