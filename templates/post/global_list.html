{% extends 'base.html' %}
{% block title %}전체 피드 - My Blog{% endblock %}

{% block content %}
<div class="row w-100 justify-content-center">
    <div class="col-lg-10">
        <div class="text-white mb-4">
            <h2 class="fw-bold">전체 피드</h2>
            <p class="opacity-75">모든 블로거들의 새로운 소식을 만나보세요.</p>

            <div id="current-tag-info" class="mt-3" style="display: none;">
                <span class="badge bg-success fs-6 rounded-pill px-3 py-2 shadow-sm">
                    <i class="bi bi-tag-fill me-1"></i> <span id="tag-name-display"></span>
                    <a href="/api/v1/post/all/page/" class="text-white ms-2 text-decoration-none"><i
                            class="bi bi-x-circle-fill"></i></a>
                </span>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div id="global-post-list" class="list-group list-group-flush">
                    <div class="text-center py-5">
                        <div class="spinner-border text-success" role="status"></div>
                        <p class="text-muted mt-2">글을 불러오는 중입니다...</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="pagination-container" class="d-flex justify-content-center mt-4"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentPage = 1;
    // 브라우저의 현재 URL에서 쿼리 파라미터(?tag=...)를 쉽게 추출하기 위해 URLSearchParams 객체를 생성합니다.
    const urlParams = new URLSearchParams(window.location.search);
    // 'tag'라는 이름의 파라미터 값을 꺼내옵니다. (없으면 null이 됩니다)
    const currentTag = urlParams.get('tag');

    document.addEventListener("DOMContentLoaded", function () {
        // 만약 URL에 태그 값이 존재한다면,
        if (currentTag) {
            // 태그 정보를 보여주는 UI 요소를 화면에 나타나게 합니다.
            document.getElementById('current-tag-info').style.display = 'block';
            // 뱃지 안의 텍스트를 현재 검색 중인 태그 이름으로 변경합니다.
            document.getElementById('tag-name-display').innerText = currentTag;
        }
        // 첫 페이지 데이터를 불러오는 함수를 실행합니다.
        fetchGlobalPosts(currentPage);
    });

    async function fetchGlobalPosts(page) {
        const container = document.getElementById('global-post-list');
        const paginationContainer = document.getElementById('pagination-container');

        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-success" role="status"></div><p class="text-muted mt-2">글을 불러오는 중입니다...</p></div>';

        try {
            // API 호출 URL을 기본적으로 페이지만 포함하여 만듭니다.
            let apiUrl = `/api/v1/post/?page=${page}`;

            // 만약 현재 추출한 태그 값이 존재한다면
            if (currentTag) {
                // API URL 뒤에 '&tag=태그명'을 덧붙여 백엔드 서비스 레이어로 전달되게 합니다. (encodeURIComponent로 특수문자 깨짐 방지)
                apiUrl += `&tag=${encodeURIComponent(currentTag)}`;
            }

            // 조립된 URL로 백엔드에 GET 요청을 보냅니다.
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (response.ok) {
                const posts = data.results || data;

                if (posts.length === 0) {
                    // 글이 없을 때, 일반 상황과 태그 필터링 상황의 안내 메시지를 다르게 보여줍니다.
                    const emptyMsg = currentTag
                            ? `'${currentTag}' 태그가 포함된 게시글이 없습니다.`
                            : '아직 등록된 게시글이 없습니다.';
                    container.innerHTML = `<div class="text-center py-5 text-muted">${emptyMsg}</div>`;
                    paginationContainer.innerHTML = '';
                    return;
                }

                container.innerHTML = '';

                posts.forEach(post => {
                    const date = new Date(post.created_at).toLocaleDateString();

                    const postHtml = `
                        <div class="list-group-item list-group-item-action border-0 px-4 py-3 border-bottom bg-transparent">
                            <div class="d-flex w-100 justify-content-between align-items-center">
                                <div class="text-truncate" style="max-width: 75%;">
                                    <a href="/api/v1/post/${post.id}/page/" class="text-decoration-none text-dark">
                                        <h5 class="mb-1 fw-bold">${post.title}</h5>
                                    </a>
                                    <small class="text-muted d-flex align-items-center gap-2">
                                        <span>by <span class="text-success fw-bold">${post.author_nickname || '익명'}</span></span>
                                        <span>| ${date}</span>
                                        <span class="text-danger"><i class="bi bi-heart-fill"></i> ${post.likes_count || 0}</span>
                                    </small>
                                </div>
                                ${post.thumbnail ? `<img src="${post.thumbnail}" style="width: 50px; height: 50px; object-fit: cover;" class="rounded">` : ''}
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', postHtml);
                });

                if (data.count !== undefined) {
                    renderPagination(data.count, page, document.getElementById('pagination-container'), 'fetchGlobalPosts');
                }
            } else {
                container.innerHTML = '<p class="text-danger text-center py-5">목록을 불러오지 못했습니다.</p>';
            }
        } catch (error) {
            console.error('Error:', error);
            container.innerHTML = '<p class="text-danger text-center py-5">서버 통신 오류가 발생했습니다.</p>';
        }
    }

    // ✨ 누락되었던 페이지네이션 렌더링 함수를 추가했습니다.
    /**
     * 범용적으로 사용할 수 있도록 최적화된 페이지네이션 렌더링 함수입니다.
     * @param {number} totalCount - API에서 받아온 전체 게시글의 개수
     * @param {number} currentPage - 현재 사용자가 보고 있는 페이지 번호
     * @param {HTMLElement} container - 페이지 버튼들이 그려질 HTML 부모 요소
     * @param {string} fetchFunctionName - 페이지 클릭 시 데이터를 불러올 함수 이름
     */
    function renderPagination(totalCount, currentPage, container, fetchFunctionName) {
        // 1. 한 페이지에 보여줄 데이터 개수를 10개로 고정합니다. (백엔드 페이지네이션 설정과 동일해야 함)
        const pageSize = 10;

        // 2. 전체 개수를 10으로 나눈 뒤 소수점을 올림(Math.ceil)하여 총 필요한 페이지 수를 계산합니다.
        const totalPages = Math.ceil(totalCount / pageSize);

        // 3. 만약 총 페이지가 1페이지 이하(데이터가 10개 이하)라면 페이징이 필요 없습니다.
        if (totalPages <= 1) {
            // 4. 페이지네이션을 보여줄 필요가 없으므로 컨테이너를 깨끗하게 비우고 함수를 즉시 종료합니다.
            container.innerHTML = '';
            return;
        }

        // 5. 부트스트랩 클래스를 활용하여 페이지네이션 UI를 감싸는 HTML 구조를 엽니다.
        let html = '<nav><ul class="pagination pagination-sm justify-content-center">';

        // 6. 현재 페이지가 1페이지인지 확인하여 [이전] 버튼을 비활성화(disabled)할지 결정합니다.
        const prevDisabled = currentPage === 1 ? 'disabled' : '';

        // 7. [이전] 버튼의 HTML 태그를 조립합니다. 클릭 시 현재 페이지 번호에서 1을 뺀 값으로 데이터를 다시 불러옵니다.
        html += `<li class="page-item ${prevDisabled}"><a class="page-link text-success" href="#" onclick="event.preventDefault(); ${fetchFunctionName}(${currentPage - 1})">이전</a></li>`;

        // 8. 1페이지부터 계산된 총 페이지 수(totalPages)까지 반복문을 실행하여 숫자 버튼들을 만듭니다.
        for (let i = 1; i <= totalPages; i++) {
            // 9. 반복문을 도는 중의 숫자(i)가 현재 보고 있는 페이지 번호와 같다면 색상을 채워 활성화 상태(active)로 만듭니다.
            const activeClass = currentPage === i ? 'active bg-success border-success text-white' : 'text-success';

            // 10. 각 숫자(i) 버튼에 대한 HTML 태그를 생성하여 전체 HTML 문자열에 누적시킵니다.
            html += `<li class="page-item"><a class="page-link ${activeClass}" href="#" onclick="event.preventDefault(); ${fetchFunctionName}(${i})">${i}</a></li>`;
        }

        // 11. 현재 페이지가 마지막 페이지인지 확인하여 [다음] 버튼을 비활성화할지 결정합니다.
        const nextDisabled = currentPage === totalPages ? 'disabled' : '';

        // 12. [다음] 버튼의 HTML 태그를 조립합니다. 클릭 시 현재 페이지 번호에서 1을 더한 값으로 데이터를 다시 불러옵니다.
        html += `<li class="page-item ${nextDisabled}"><a class="page-link text-success" href="#" onclick="event.preventDefault(); ${fetchFunctionName}(${currentPage + 1})">다음</a></li>`;

        // 13. 열어두었던 <nav>와 <ul> 태그를 닫아주어 HTML 조립을 마무리합니다.
        html += '</ul></nav>';

        // 14. 문자열로 조립이 완료된 전체 HTML을 브라우저의 실제 컨테이너 요소 안에 렌더링합니다.
        container.innerHTML = html;
    }
</script>
{% endblock %}
