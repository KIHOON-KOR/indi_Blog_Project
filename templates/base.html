<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}My Blog{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-dark-green: #0a2e1a;
            --brand-accent-green: #1e8754;
            --brand-hover-green: #156b41;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(
                rgba(10, 46, 26, 0.85),
                rgba(10, 46, 26, 0.95)
            ), url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar { background-color: transparent !important; }
        .navbar-brand { color: rgba(255,255,255,0.9) !important; font-weight: 700; }
        .nav-link { color: rgba(255,255,255,0.8) !important; font-weight: 500; }
        .nav-link:hover { color: #fff !important; }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .auth-card {
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .btn-primary {
            background-color: var(--brand-accent-green);
            border-color: var(--brand-accent-green);
            padding: 0.5rem 1.2rem; /* 버튼 크기 조정 */
            font-weight: 600;
            border-radius: 2rem; /* 둥근 버튼 */
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: var(--brand-hover-green) !important;
            border-color: var(--brand-hover-green) !important;
            transform: translateY(-2px);
        }

        .form-control:focus {
            border-color: var(--brand-accent-green);
            box-shadow: 0 0 0 0.25rem rgba(30, 135, 84, 0.15);
        }

        a.text-brand { color: var(--brand-accent-green); text-decoration: none; font-weight: 600; }
        a.text-brand:hover { text-decoration: underline; color: var(--brand-hover-green); }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-tree-fill me-2" viewBox="0 0 16 16">
                  <path d="M8.416.223a.5.5 0 0 0-.832 0l-3 4.5A.5.5 0 0 0 5 5.5h.098L3.076 8.735A.5.5 0 0 0 3.5 9.5h.191l-1.638 3.276a.5.5 0 0 0 .447.724H7V16h2v-2.5h4.5a.5.5 0 0 0 .447-.724L12.31 9.5h.191a.5.5 0 0 0 .424-.765L10.902 5.5h.098a.5.5 0 0 0 .416-.777l-3-4.5z"/>
                </svg>
                My Blog
            </a>

            <button class="navbar-toggler bg-white opacity-75" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto align-items-center">

                    <div id="guest-menu" class="d-flex align-items-center">
                        <li class="nav-item">
                            <a class="nav-link me-2" href="/api/v1/user/login-page/">로그인</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-primary btn-sm" href="/api/v1/user/signup-page/">회원가입</a>
                        </li>
                    </div>

                    <div id="user-menu" class="d-flex align-items-center" style="display: none !important;">
                        <li class="nav-item">
                            <a class="nav-link text-secondary" href="{% url 'trash_post_list_page' %}">
                                <i class="bi bi-trash3"></i>
                                휴지통
                            </a>
                        </li>

                        <li class="nav-item me-3">
                            <a class="nav-link text-white-50 small" href="/api/v1/post/my/page/">내 블로그</a>
                        </li>

                        <li class="nav-item me-3">
                            <a class="nav-link text-white-50 small" href="/api/v1/series/my/page/">시리즈 관리</a>
                        </li>

                        <li class="nav-item me-3">
                            <a class="nav-link text-white-50 small" href="/api/v1/post/my/temp/page/">임시 저장함</a>
                        </li>

                        <li class="nav-item me-3">
                            <a class="nav-link text-white small fw-bold" href="{% url 'mypage_page' %}">마이페이지</a>
                        </li>
                        <li class="nav-item me-3 d-flex align-items-center">
                            <img id="nav-grade-img" src="" alt="grade" class="d-none me-2"
                                 style="width: 24px; height: 24px; object-fit: contain;">

                            <span class="text-white opacity-75 small">안녕하세요, <strong id="user-nickname"
                                                                                     class="text-white">User</strong>님</span>
                        </li>

                        <li class="nav-item">
                            <a class="btn btn-outline-light btn-sm rounded-pill px-3" href="#" onclick="handleLogout()">로그아웃</a>
                        </li>
                    </div>

                </ul>
            </div>
        </div>
    </nav>

    <div class="main-container container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            checkLoginStatus();
        });

        function checkLoginStatus() {
            // 로컬 스토리지에서 사용자의 접근 토큰(JWT)을 가져옵니다.
            const token = localStorage.getItem('access_token');

            // 로컬 스토리지에서 사용자의 닉네임을 가져옵니다.
            const nickname = localStorage.getItem('nickname');

            // 로컬 스토리지에서 home.html에서 저장해둔 등급 이미지 주소를 가져옵니다.
            const gradeImgUrl = localStorage.getItem('user_grade_img');

            // 비로그인 상태일 때 보여줄 메뉴 요소를 찾습니다.
            const guestMenu = document.getElementById('guest-menu');

            // 로그인 상태일 때 보여줄 메뉴 요소를 찾습니다.
            const userMenu = document.getElementById('user-menu');

            // 닉네임이 들어갈 HTML 요소를 찾습니다.
            const nicknameElement = document.getElementById('user-nickname');

            // 등급 이미지가 들어갈 HTML 요소를 찾습니다.
            const navGradeImg = document.getElementById('nav-grade-img');

            if (token) {
                // 로그인 상태라면 손님 메뉴를 숨기고 유저 메뉴를 보여줍니다.
                guestMenu.style.setProperty('display', 'none', 'important');
                userMenu.style.setProperty('display', 'flex', 'important');

                // 화면에 닉네임을 표시합니다.
                if (nickname && nicknameElement) {
                    nicknameElement.innerText = nickname;
                }

                // 로컬 스토리지에 등급 이미지가 존재한다면 실행합니다.
                if (gradeImgUrl && navGradeImg) {
                    // img 태그의 주소(src)를 내 등급 이미지 주소로 설정합니다.
                    navGradeImg.src = gradeImgUrl;
                    // 이미지가 화면에 보이도록 숨김 클래스(d-none)를 제거합니다.
                    navGradeImg.classList.remove('d-none');
                }
            } else {
                // 비로그인 상태라면 손님 메뉴를 보여주고 유저 메뉴를 숨깁니다.
                guestMenu.style.setProperty('display', 'flex', 'important');
                userMenu.style.setProperty('display', 'none', 'important');
            }
        }

        function handleLogout() {
            // 로그아웃 시 확인 알림창을 띄웁니다.
            if (confirm("정말 로그아웃 하시겠습니까?")) {
                // 로그아웃 하므로 모든 인증 관련 데이터와 닉네임을 삭제합니다.
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                localStorage.removeItem('nickname');

                // 로그아웃 시 다른 계정으로 들어왔을 때 섞이지 않도록 등급 이미지 정보도 함께 삭제합니다.
                localStorage.removeItem('user_grade_img');

                // 삭제가 완료되면 메인 페이지로 이동합니다.
                alert("로그아웃 되었습니다.");
                window.location.href = "/";
            }
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
