version: '3.8'

# 실행할 모니터링 관련 컨테이너(서비스)들을 정의하기 시작합니다.
services:

  # 1. cAdvisor: 도커 호스트와 컨테이너들의 리소스(CPU, 메모리 등) 수집기
  cadvisor:
    # Google에서 제공하는 cAdvisor 최신 공식 이미지를 기반으로 실행합니다.
    image: gcr.io/cadvisor/cadvisor:latest
    # 실행될 컨테이너의 이름을 'cadvisor'로 명확하게 지정합니다.
    container_name: cadvisor
    # 서버가 재부팅되거나 컨테이너가 꺼졌을 때 항상 자동으로 재시작되도록 설정합니다.
    restart: always
    # 포트 포워딩: 외부에서 cAdvisor 데이터에 접근할 수 있도록 포트를 엽니다.
    ports:
      # 호스트(EC2)의 8080 포트를 컨테이너 내부의 8080 포트로 연결합니다.
      - "8080:8080"
    # cAdvisor가 EC2 서버 자체의 상태와 도커 컨테이너들의 상태를 읽을 수 있도록 권한(볼륨)을 줍니다.
    volumes:
      # 호스트의 최상위 루트 디렉토리를 컨테이너에 읽기 전용(ro)으로 연결합니다.
      - /:/rootfs:ro
      # 실행 중인 프로세스 및 시스템 런타임 정보를 담은 디렉토리를 읽기 전용으로 연결합니다.
      - /var/run:/var/run:ro
      # 시스템 하드웨어 및 커널 정보를 담은 디렉토리를 읽기 전용으로 연결합니다.
      - /sys:/sys:ro
      # 도커 데몬 및 전체 컨테이너 데이터가 저장된 곳을 읽기 전용으로 연결합니다. (가장 중요)
      - /var/lib/docker/:/var/lib/docker:ro
      # 디스크 파티션 및 I/O(읽기/쓰기) 정보를 확인하기 위해 연결합니다.
      - /dev/disk/:/dev/disk:ro

  # 2. Prometheus: cAdvisor가 수집한 데이터를 주기적으로 가져와 저장하는 시계열 DB
  prometheus:
    # Prometheus 최신 공식 이미지를 사용합니다.
    image: prom/prometheus:latest
    # 컨테이너의 이름을 'prometheus'로 지정합니다.
    container_name: prometheus
    # 항상 자동으로 재시작되도록 설정합니다.
    restart: always
    # 포트 포워딩 설정입니다.
    ports:
      # 호스트(EC2)의 9090 포트를 컨테이너 내부의 9090 포트로 연결합니다.
      - "9090:9090"
    # Prometheus가 어떤 데이터를 어떻게 수집할지 적힌 설정 파일을 컨테이너에 넣어줍니다.
    volumes:
      # 현재 폴더에 있는 prometheus.yml 파일을 컨테이너 내부의 기본 설정 파일 경로로 덮어씌웁니다.
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    # 컨테이너가 실행될 때 적용할 옵션입니다.
    command:
      # 방금 우리가 마운트한 설정 파일을 읽어서 실행하도록 경로를 강제합니다.
      - '--config.file=/etc/prometheus/prometheus.yml'

  # 3. Grafana: 수집된 딱딱한 데이터를 예쁜 그래프와 대시보드로 시각화해주는 웹 툴
  grafana:
    # Grafana 최신 공식 이미지를 사용합니다.
    image: grafana/grafana:latest
    # 컨테이너 이름을 'grafana'로 지정합니다.
    container_name: grafana
    # 항상 자동으로 재시작되도록 설정합니다.
    restart: always
    # 우리가 웹 브라우저로 접속하기 위한 포트 설정입니다.
    ports:
      # 호스트(EC2)의 3000 포트를 컨테이너의 3000 포트(Grafana 웹 UI)로 연결합니다.
      - "3000:3000"
    # 컨테이너들의 실행 순서를 제어합니다.
    depends_on:
      # 데이터를 시각화하려면 DB(Prometheus)가 필요하므로, Prometheus가 켜진 후에 실행되도록 의존성을 부여합니다.
      - prometheus