name: Code Quality Checks & Tests

on:
  pull_request:
    branches:
      - "main"
      - "develop"

# ────────── [여기에 정의하면 모든 Job과 Step에서 공유됩니다] ──────────
env: # 워크플로우 전체에서 사용할 전역 환경 변수 설정입니다.
  AWS_ACCESS_KEY_ID: "dummy"         # 모든 스텝에서 공통으로 쓰일 더미 액세스 키입니다.
  AWS_SECRET_ACCESS_KEY: "dummy"     # 모든 스텝에서 공통으로 쓰일 더미 시크릿 키입니다.
  AWS_STORAGE_BUCKET_NAME: "dummy"   # 모든 스텝에서 공통으로 쓰일 더미 버킷 이름입니다.
  DJANGO_SETTINGS_MODULE: "config.settings" # 장고 설정을 명시적으로 지정하여 에러를 방지합니다.

jobs:
  # 1. 린트 및 정적 분석 (Linting)
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code # 소스 코드를 가상 머신으로 가져옵니다.
        uses: actions/checkout@v3

      - name: Set up Python # 파이썬 3.12 환경을 구성합니다.
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Poetry # 의존성 관리 도구인 Poetry를 설치합니다.
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "${HOME}/.poetry/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies # 빌드 속도 향상을 위해 설치된 패키지들을 캐싱합니다.
        id: cache-venv
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: python-3.12-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            python-3.12-poetry-

      - name: Install dependencies # 캐시가 없으면 필요한 라이브러리들을 설치합니다.
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: poetry install --no-root

      - name: Create .env file # DB 정보 등이 담긴 Secret을 사용하여 .env 파일을 생성합니다.
        run: |
          echo "${{ secrets.DJANGO_ENVS }}" > .env

      - name: Run Ruff (Lint & Import Sorting) # Ruff를 이용해 코드 스타일과 임포트 순서를 검사합니다.
        run: poetry run ruff check .

      - name: Run Black (Code Formatting) # Black을 이용해 코드 포맷팅 규칙 위반 여부를 확인합니다.
        run: poetry run black . --check

      - name: Run Mypy (Type Checking) # 정적 타입 검사를 실행합니다. (상단 env 덕분에 추가 env 블록이 필요 없습니다)
        run: poetry run mypy .

  # 2. 테스트 (Tests)
  test:
    needs: ci # ci Job이 성공했을 때만 실행하여 불필요한 자원 낭비를 막습니다.
    runs-on: ubuntu-latest
    services: # 테스트에 필요한 DB와 Redis 서비스를 띄웁니다.
      db:
        image: postgres:15
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: blog_user
          POSTGRES_PASSWORD: blog_password
          POSTGRES_DB: blog_db_dev
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:latest
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    steps:
      - name: Checkout code # 다시 한 번 코드를 체크아웃합니다. (새로운 가상 머신이므로)
        uses: actions/checkout@v3

      - name: Set up Python # 파이썬 환경을 설정합니다.
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Poetry # Poetry를 설치합니다.
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "${HOME}/.poetry/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies # 캐시를 불러와 시간을 절약합니다.
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: python-3.12-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies # 의존성을 설치합니다.
        run: poetry install --no-root

      - name: Create .env file # 테스트 환경용 .env 파일을 생성합니다.
        run: echo "${{ secrets.DJANGO_ENVS }}" > .env

      - name: Run Django Migration # DB 스키마를 최신 상태로 적용합니다. (전역 env를 사용하므로 깔끔해졌습니다)
        run: poetry run python manage.py migrate

      - name: Run Tests & Coverage # 테스트를 실행하고 코드 커버리지를 측정합니다.
        run: |
          poetry run coverage run --source='.' manage.py test
          echo "📊 Total Coverage Report:"
          poetry run coverage report -m